name: nhachung
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      retries: 5
    networks: [nhachung_net]

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      storage: { condition: service_started }
    environment:
      DATABASE_URL: postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${DB_NAME}
      MIGRATION_DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      OTP_PEPPER: ${OTP_PEPPER}
      OTP_ADAPTER: ${OTP_ADAPTER}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN}
      NODE_ENV: ${NODE_ENV}
      # `npm run seed` chạy trong chính container này (`docker compose exec api
      # npm run seed`), nên mật khẩu của các tài khoản mẫu phải có mặt ở đây.
      # Không có giá trị mặc định: seed dừng lại và nói rõ nếu thiếu.
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      # Tác vụ định kỳ (`src/jobs/`). Đặt `false` khi chạy nhiều bản sao `api`
      # mà muốn tách chúng ra một tiến trình riêng — khoá tư vấn đã lo việc hai
      # bản sao cùng thức dậy, nhưng tách hẳn vẫn là cách sạch hơn.
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
    # KHÔNG khai `healthcheck:` ở đây. compose ghi đè HOÀN TOÀN chỉ thị
    # HEALTHCHECK của image (không hợp nhất), nên có một khối ở đây từng làm
    # image chạy `node -e ...` (api/Dockerfile) trong khi container thật lại
    # chạy `wget` — hai nơi tưởng nói cùng một việc nhưng chỉ một nơi có hiệu
    # lực, và không nơi nào cảnh báo khi chúng lệch nhau. Soát xét độc lập Task
    # 9 xác nhận bằng `docker inspect ... --format '{{json .Config.Healthcheck}}'`
    # (ra `wget`, không phải `node`) và log truy cập có "user-agent":"Wget".
    # Nguồn sự thật DUY NHẤT bây giờ là HEALTHCHECK trong api/Dockerfile — sửa
    # cách kiểm tra thì sửa ở đó, không thêm lại khối này.
    networks: [nhachung_net]

  storage:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: [storage_data:/data]
    networks: [nhachung_net]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [nhachung_net]

  # Gắn chính sách MinIO cho khoá sao lưu, rồi chết. Task 18.
  #
  # Nó tồn tại vài giây và nó là chỗ DUY NHẤT trong stack có thông tin đăng
  # nhập QUẢN TRỊ của MinIO. Nếu đặc quyền ấy nằm trong container `backup` thì
  # container ấy tự nới được chính sách của chính mình, và câu "khoá sao lưu
  # không xoá được" mất hết ý nghĩa. Nó cũng TỰ KIỂM BẰNG CHẠY THẬT rằng khoá
  # sao lưu ghi được nhưng không xoá được, và thoát khác 0 nếu không phải vậy.
  storage-init:
    image: minio/mc
    depends_on: [storage]
    restart: "no"
    entrypoint: ["/bin/sh", "/storage-init.sh"]
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY}
    volumes:
      - ./backup/storage-init.sh:/storage-init.sh:ro
      - ./backup/policy:/policy:ro
    networks: [nhachung_net]

  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      storage: { condition: service_started }
      storage-init: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET}
      # KHOÁ RIÊNG của container sao lưu, không phải khoá gốc của MinIO. Chính
      # sách của nó (backup/policy/backup.json) cho đọc kho ảnh và CHỈ GHI THÊM
      # vào kho nhật ký — không một lệnh xoá nào, ở bất kỳ kho nào. Người sửa
      # được nhật ký không được xoá bản sao đối chiếu.
      S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY}
      S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET}
      # Đích ngoài máy chủ. Tệp khoá tài khoản dịch vụ được GẮN VÀO, không nằm
      # trong kho mã nguồn và không đi cùng bản sao lưu — mất khoá gốc là mất
      # toàn bộ dữ liệu nhạy cảm (đặc tả mục 10), nên kho khoá đi đường riêng.
      GDRIVE_SERVICE_ACCOUNT_FILE: ${GDRIVE_SERVICE_ACCOUNT_FILE:-}
      GDRIVE_FOLDER_ID: ${GDRIVE_FOLDER_ID:-}
      GDRIVE_PATH: ${GDRIVE_PATH:-nhachung}
    volumes:
      - ./backups:/backups
      - ./secrets:/secrets:ro
    networks: [nhachung_net]

volumes: { db_data: , storage_data: , caddy_data: , caddy_config: }
networks: { nhachung_net: }
