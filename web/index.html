<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nhà Chung 86 — Kết nối người 86 Hưng Yên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   NHÀ CHUNG 86 — HỆ THỐNG THIẾT KẾ (v2 — theo mockup mới)
   ============================================================ */
:root{
  --orange:#F07A2F;
  --orange-dark:#D9631F;
  --orange-darker:#B4501A;
  --orange-light:#FBE3D1;
  --orange-light-2:#FDF3EB;
  --green-950:#141414;
  --green-900:#1C1C1C;
  --green-800:#16463390;
  --green-700:#2E2E2E;
  --green-600:#2A8560;
  --green-light:#E1F5EA;
  --green-light-2:#EAF7F0;
  --cream:#FFFFFF;
  --cream-2:#F6F6F4;
  --white:#FFFFFF;
  --ink:#141414;
  --body:#4C4C4C;
  --muted:#8B8B8B;
  --border:#E6E4E0;
  --border-2:#F0EFEC;
  --danger:#C0392B;
  --danger-light:#FBEAE7;
  --ok:#2A8560;
  --r-xl:22px;
  --r-lg:16px;
  --r-md:12px;
  --r-sm:9px;
  --r-full:999px;
  --sh-sm:0 1px 2px rgba(0,0,0,.05);
  --sh-md:0 4px 16px rgba(0,0,0,.07);
  --sh-lg:0 12px 36px rgba(14,42,32,.12);
  --sh-modal:0 24px 64px rgba(10,26,20,.28);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--cream);
  color:var(--ink);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14.5px}
h1,h2,h3,h4{margin:0;font-weight:700;color:var(--ink)}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
::selection{background:var(--orange-light);color:var(--orange-darker)}
:focus-visible{outline:2.5px solid var(--orange);outline-offset:2px;border-radius:6px}
.hidden{display:none !important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* ---------- layout helpers ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:0 40px}
.grid{display:grid;gap:20px}
.flex{display:flex}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.flex-center{display:flex;align-items:center;justify-content:center}
.gap-8{gap:8px}.gap-10{gap:10px}.gap-12{gap:12px}.gap-16{gap:16px}.gap-20{gap:20px}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-20{margin-top:20px}.mt-24{margin-top:24px}.mt-32{margin-top:32px}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}.mb-20{margin-bottom:20px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:0;border-radius:var(--r-full);padding:12px 22px;font-size:14.5px;font-weight:600;
  transition:.15s ease;white-space:nowrap;
}
.btn svg{flex:none}
.btn-primary{background:var(--orange);color:#fff;box-shadow:0 2px 10px rgba(238,122,52,.28)}
.btn-primary:hover{background:var(--orange-dark)}
.btn-dark{background:var(--green-900);color:#fff}
.btn-dark:hover{background:var(--green-950)}
.btn-outline{background:#fff;color:var(--ink);border:1.5px solid var(--border)}
.btn-outline:hover{border-color:var(--orange);color:var(--orange-dark)}
.btn-ghost{background:transparent;color:var(--body)}
.btn-ghost:hover{background:var(--cream-2)}
.btn-danger{background:var(--danger-light);color:var(--danger)}
.btn-danger:hover{background:#F6D9D3}
.btn-sm{padding:8px 16px;font-size:13.5px;border-radius:var(--r-full)}
.btn-lg{padding:14px 28px;font-size:15.5px}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-icon{width:38px;height:38px;padding:0;border-radius:var(--r-md);background:#fff;border:1.5px solid var(--border)}
.btn-icon:hover{border-color:var(--orange)}

/* ---------- cards ---------- */
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-sm)}
.card-pad{padding:22px}
.card-hover{transition:.18s ease}
.card-hover:hover{box-shadow:var(--sh-md);transform:translateY(-2px);border-color:#E7DCC5}

/* ---------- badges / tags / chips ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:var(--r-full)}
.badge-green{background:var(--green-light);color:var(--green-700)}
.badge-orange{background:var(--orange-light);color:var(--orange-darker)}
.badge-gray{background:var(--cream-2);color:var(--muted)}
.badge-danger{background:var(--danger-light);color:var(--danger)}
.chip{border:1.5px solid var(--border);background:#fff;border-radius:var(--r-full);padding:7px 15px;font-size:13.5px;font-weight:500;color:var(--body);transition:.15s}
.chip:hover{border-color:var(--orange);color:var(--orange-dark)}
.chip.active{background:var(--green-900);border-color:var(--green-900);color:#fff}

/* ---------- avatars ---------- */
.av{border-radius:50%;object-fit:cover;flex:none;background:var(--green-light)}
.av-fallback{border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;background:var(--green-900);color:var(--orange-light)}

/* ---------- forms ---------- */
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:7px}
.field .hint{font-size:12px;color:var(--muted);margin-top:5px}
.field .err{font-size:12.5px;color:var(--danger);margin-top:6px;display:none;font-weight:500}
.field.invalid .err{display:block}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger);background:var(--danger-light)}
.input,select.input,textarea.input{
  width:100%;border:1.5px solid var(--border);border-radius:var(--r-md);padding:11px 14px;
  background:#fdfcf9;color:var(--ink);transition:.15s;
}
.input:focus{outline:none;border-color:var(--orange);background:#fff;box-shadow:0 0 0 3px var(--orange-light-2)}
textarea.input{resize:vertical;min-height:90px}
.req{color:var(--orange-dark)}
.checkrow{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;color:var(--body)}
.checkrow input{margin-top:3px}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* ---------- toast ---------- */
#toast-wrap{position:fixed;top:20px;right:20px;z-index:900;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--green-950);color:#fff;padding:13px 18px;border-radius:var(--r-md);font-size:13.5px;font-weight:500;
  box-shadow:var(--sh-lg);display:flex;align-items:center;gap:10px;min-width:260px;animation:toastIn .25s ease;}
.toast.err{background:#5A2018}
.toast svg{flex:none;color:var(--orange)}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

/* ---------- modal ---------- */
#modal-layer{position:fixed;inset:0;z-index:800;display:none}
#modal-layer.show{display:block}
.modal-backdrop{position:absolute;inset:0;background:rgba(14,26,20,.5);backdrop-filter:blur(2px);animation:fadeIn .15s ease}
.modal{position:relative;max-width:560px;margin:5vh auto;background:#fff;border-radius:var(--r-xl);box-shadow:var(--sh-modal);
  max-height:90vh;display:flex;flex-direction:column;animation:modalIn .18s ease}
.modal.modal-lg{max-width:760px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border-2)}
.modal-head h3{font-size:18px}
.modal-body{padding:22px 24px;overflow-y:auto}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border-2);display:flex;justify-content:flex-end;gap:10px}
.modal-close{width:32px;height:32px;border-radius:50%;border:0;background:var(--cream-2);display:grid;place-items:center;color:var(--body)}
.modal-close:hover{background:var(--orange-light);color:var(--orange-dark)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

/* ---------- misc ---------- */
.divider{height:1px;background:var(--border-2);border:0;margin:18px 0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--orange-dark)}
.muted{color:var(--muted)}
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty svg{margin:0 auto 14px;opacity:.5}
.progress{height:7px;border-radius:var(--r-full);background:var(--cream-2);overflow:hidden}
.progress > span{display:block;height:100%;border-radius:var(--r-full);background:linear-gradient(90deg,var(--orange),var(--orange-dark))}
.tabs{display:flex;gap:6px;border-bottom:1.5px solid var(--border);margin-bottom:20px}
.tab{padding:11px 4px;margin-right:22px;font-size:14.5px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;cursor:pointer;background:none;border-top:0;border-left:0;border-right:0}
.tab.active{color:var(--ink);border-bottom-color:var(--orange)}

/* ============================================================
   PUBLIC SITE (landing)
   ============================================================ */
.pub-header{height:80px;background:#fff;border-bottom:1px solid var(--border-2);position:sticky;top:0;z-index:60}
.pub-header .wrap{height:100%;display:flex;align-items:center}
.brand{display:flex;align-items:center;gap:11px}
.brand .mark{width:42px;height:42px;border-radius:12px;background:var(--green-900);display:grid;place-items:center;flex:none}
.brand b{font-size:19px;font-weight:800;line-height:1.1}
.brand b span{color:var(--orange)}
.brand i{font-style:normal;display:block;font-size:10px;color:var(--muted);letter-spacing:.14em;font-weight:600}
.pub-nav{display:flex;gap:32px;margin-left:56px}
.pub-nav a{font-size:14.5px;font-weight:600;color:var(--ink)}
.pub-nav a:hover{color:var(--orange-dark)}
.pub-header .tr{margin-left:auto;display:flex;align-items:center;gap:14px}

.hero{position:relative;min-height:560px;display:flex;align-items:center;overflow:hidden;isolation:isolate}
.hero-bg{position:absolute;inset:0;z-index:0}
.hero-bg img{width:100%;height:100%;object-fit:cover;object-position:center}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,8,6,.88) 0%,rgba(4,8,6,.68) 42%,rgba(4,8,6,.32) 72%,rgba(4,8,6,.15) 100%),linear-gradient(0deg,rgba(4,8,6,.55) 0%,rgba(4,8,6,0) 40%)}
.hero .wrap{position:relative;z-index:2;padding:90px 40px 84px;max-width:1280px}
.hero-inner{max-width:600px}
.hero h1{font-size:46px;line-height:1.18;letter-spacing:-.01em}
.hero h1 .l1{color:#fff;display:block}
.hero h1 .l2{color:var(--orange);display:block}
.hero p{color:#E7E7E2;font-size:15.5px;margin-top:18px;max-width:500px;line-height:1.65}
.hero-search{margin-top:26px;background:#fff;border:1.5px solid var(--border);border-radius:var(--r-full);padding:6px 6px 6px 20px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh-lg)}
.hero-search input{flex:1;border:0;background:none;font-size:14.5px;padding:9px 0}
.hero-search input:focus{outline:none}
.hero-search .btn{border-radius:var(--r-full)}
.hero-tags{margin-top:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:#D6D6CE}
.hero-tags .chip{padding:6px 13px;font-size:12.5px}

.feat-grid{padding:0 0 60px}
.feat-grid .grid{grid-template-columns:repeat(4,1fr)}
.feat-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;transition:.18s}
.feat-card:hover{box-shadow:var(--sh-md);transform:translateY(-3px)}
.feat-card img{height:130px;width:100%;object-fit:cover}
.feat-card .b{padding:16px 18px 20px}
.feat-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;margin-bottom:10px}
.feat-ic.g{background:var(--green-light);color:var(--green-700)}
.feat-ic.o{background:var(--orange-light);color:var(--orange-darker)}
.feat-card h4{font-size:15.5px}
.feat-card p{font-size:13px;color:var(--muted);margin-top:5px;line-height:1.55}
.feat-card .stat{margin-top:12px;font-size:13px;font-weight:700;color:var(--ink)}

.quote-bar{background:var(--green-950);color:#fff;padding:26px 0;margin-bottom:0}
.quote-bar .wrap{display:flex;align-items:center;gap:26px}
.quote-bar .gate{width:64px;height:64px;flex:none;opacity:.9}
.quote-bar q{font-size:14.5px;font-style:italic;color:#EDEAE0;display:block;max-width:640px;line-height:1.6}
.quote-bar .attr{font-size:12.5px;color:var(--orange);font-weight:700;margin-top:5px}
.quote-bar .stats{margin-left:auto;display:flex;gap:34px}
.quote-bar .stats div{text-align:center}
.quote-bar .stats b{display:block;font-size:22px;color:var(--orange);font-weight:800}
.quote-bar .stats span{font-size:11.5px;color:#B9C4BC}

.pub-footer{background:#fff;padding:28px 0;border-top:1px solid var(--border-2);font-size:13px;color:var(--muted)}
.pub-footer .wrap{display:flex;justify-content:space-between;align-items:center}

/* ============================================================
   APP SHELL
   ============================================================ */
.app-shell{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
.sidebar{background:#111111;color:#C9C9C9;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sidebar .lg{display:flex;align-items:center;gap:11px;padding:22px 22px 18px;border-bottom:1px solid #232323}
.sidebar .lg .mark{width:38px;height:38px;border-radius:10px;background:var(--orange);display:grid;place-items:center}
.sidebar .lg b{color:#fff;font-size:16px;font-weight:800;display:block;line-height:1.1}
.sidebar .lg b span{color:var(--orange)}
.sidebar .lg i{font-style:normal;font-size:9px;letter-spacing:.14em;color:#7A7A7A;font-weight:600}
.sidebar-scroll{flex:1;overflow-y:auto;padding-bottom:10px}
.sb-group{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#6E6E6E;font-weight:700;padding:16px 22px 8px}
.sb-link{display:flex;align-items:center;gap:11px;padding:10px 22px;font-size:14px;font-weight:500;color:#C6C6C6;margin:1px 10px;border-radius:var(--r-md);position:relative}
.sb-link svg{flex:none;opacity:.85}
.sb-link:hover{background:#1E1E1E;color:#fff}
.sb-link.active{background:var(--orange);color:#fff;font-weight:700}
.sb-link.active svg{opacity:1}
.sb-link .n{margin-left:auto;font-size:10.5px;background:#262626;padding:1px 7px;border-radius:9px;color:#A8A8A8}
.sb-link.active .n{background:rgba(255,255,255,.25);color:#fff}
.sidebar-quote{margin:14px 14px 20px;background:linear-gradient(160deg,#1B1B1B,#0B0B0B);border:1px solid #262626;border-radius:var(--r-lg);padding:18px;position:relative;overflow:hidden}
.sidebar-quote::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--orange)}
.sidebar-quote p{font-size:12.5px;line-height:1.6;color:#CFCFCF;position:relative;z-index:1}
.sidebar-quote b{display:block;margin-top:10px;font-size:12.5px;color:var(--orange);position:relative;z-index:1}
.sidebar-quote svg{position:absolute;right:8px;bottom:6px;opacity:.12;width:70px;height:70px}
.sidebar .me{display:flex;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid #232323}

.topbar{height:74px;background:#fff;border-bottom:1px solid var(--border-2);display:flex;align-items:center;padding:0 32px;gap:18px;position:sticky;top:0;z-index:40}
.topbar h1{font-size:20px}
.topbar-search{margin-left:22px;flex:1;max-width:420px;position:relative}
.topbar-search input{width:100%;border:1.5px solid var(--border);border-radius:var(--r-md);padding:10px 14px 10px 38px;font-size:13.5px;background:var(--cream)}
.topbar-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.topbar-search-results{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-lg);max-height:360px;overflow-y:auto;display:none;z-index:50}
.topbar-search-results.show{display:block}
.tsr-item{display:flex;align-items:center;gap:10px;padding:10px 14px;font-size:13.5px;border-bottom:1px solid var(--border-2)}
.tsr-item:hover{background:var(--cream)}
.tsr-item small{display:block;color:var(--muted);font-size:11.5px}
.tsr-cat{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--orange-dark);padding:8px 14px 2px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px;position:relative}
.ico-btn{width:38px;height:38px;border-radius:var(--r-md);border:1.5px solid var(--border);display:grid;place-items:center;background:var(--cream);position:relative;color:var(--ink)}
.ico-btn:hover{border-color:var(--orange);color:var(--orange-dark)}
.ico-btn .bd{position:absolute;top:-5px;right:-5px;background:var(--orange);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:1px 5px;min-width:16px;text-align:center}
.who{display:flex;align-items:center;gap:10px;cursor:pointer;padding:5px;border-radius:var(--r-md)}
.who:hover{background:var(--cream)}
.who b{display:block;font-size:13.5px;line-height:1.2}
.who span{font-size:11.5px;color:var(--muted)}
.who svg{color:var(--muted)}

.dropdown{position:absolute;top:calc(100% + 10px);right:0;background:#fff;border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-lg);min-width:260px;z-index:70;overflow:hidden;display:none}
.dropdown.show{display:block}
.dropdown .dd-head{padding:14px 16px;border-bottom:1px solid var(--border-2)}
.dropdown .dd-item{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--border-2)}
.dropdown .dd-item:last-child{border-bottom:0}
.dropdown .dd-item:hover{background:var(--cream)}
.dropdown .dd-item p{font-size:13px;line-height:1.4}
.dropdown .dd-item small{color:var(--muted);font-size:11.5px}
.dropdown .dd-link{display:flex;align-items:center;gap:10px;padding:11px 16px;font-size:13.5px;font-weight:500}
.dropdown .dd-link:hover{background:var(--cream)}
.dropdown .dd-foot{padding:10px 16px;text-align:center;font-size:12.5px;font-weight:700;color:var(--orange-dark);border-top:1px solid var(--border-2)}
.dot-unread{width:7px;height:7px;border-radius:50%;background:var(--orange);flex:none;margin-top:5px}

.content{padding:28px 32px 60px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;gap:16px}
.page-head h1{font-size:26px}
.page-head p{color:var(--muted);font-size:14px;margin-top:5px}

/* ---------- dashboard stat cards ---------- */
.stat-row{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 14px;text-align:center}
.stat-ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px}
.stat-ic.g{background:var(--green-light);color:var(--green-700)}
.stat-ic.o{background:var(--orange-light);color:var(--orange-darker)}
.stat-card b{display:block;font-size:19px;font-weight:800}
.stat-card .lbl{font-size:12px;color:var(--muted);margin-top:2px}
.stat-card .delta{font-size:11px;color:var(--green-700);margin-top:6px;font-weight:600}

.section-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden}
.section-card .sc-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border-2)}
.section-card .sc-head h3{font-size:15.5px}
.section-card .sc-head a{font-size:12.5px;font-weight:700;color:var(--orange-dark)}
.sc-list{padding:6px 8px}
.sc-row{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:var(--r-md)}
.sc-row:hover{background:var(--cream)}
.sc-row .t{flex:1;min-width:0}
.sc-row .t b{font-size:13.5px;font-weight:600;display:block}
.sc-row .t span{font-size:12px;color:var(--muted)}
.feed-item{display:flex;gap:12px;padding:12px 14px}
.feed-item img{width:64px;height:64px;border-radius:var(--r-md);object-fit:cover;flex:none}
.feed-item .t b{font-size:13.5px;display:block}
.feed-item .t p{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.feed-item .t .who2{margin-top:6px;font-size:11.5px;color:var(--orange-dark);font-weight:700}
.opens-card{padding:12px 14px}
.opens-card img{width:100%;height:110px;object-fit:cover;border-radius:var(--r-md)}
.opens-card h4{font-size:13.5px;margin-top:10px}
.opens-card .meta{font-size:11.5px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between}
.opens-card .pc{font-weight:800;color:var(--orange-dark)}

/* ---------- active members strip ---------- */
.active-strip{display:flex;gap:14px;overflow-x:auto;padding:4px 2px}
.active-chip{flex:none;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--border);border-radius:var(--r-full);padding:8px 16px 8px 8px}
.active-chip b{font-size:13px;display:block}
.active-chip span{font-size:11px;color:var(--muted)}
.active-chip .rank{margin-left:6px;font-size:11px;font-weight:800;color:var(--orange-dark)}

/* ---------- generic content grids ---------- */
.filter-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.filter-bar .input{max-width:280px}
.cards-3{grid-template-columns:repeat(3,1fr)}
.cards-2{grid-template-columns:1fr 1fr}
.member-card{padding:18px}
.member-card .top{display:flex;gap:12px}
.member-card h4{font-size:14.5px}
.member-card .role{font-size:12.5px;color:var(--muted);margin-top:2px}
.member-card p.desc{font-size:12.5px;color:var(--body);margin-top:10px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.member-card .tags{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap}

.project-card{overflow:hidden}
.project-card img{height:150px;width:100%;object-fit:cover}
.project-card .b{padding:16px 18px}
.project-card h4{font-size:15px}
.project-card .loc{font-size:12px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:5px}
.project-card .progress{margin-top:12px}
.project-card .meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:8px}
.project-card .pc{font-weight:800;color:var(--orange-dark)}

.activity-row{display:flex;gap:16px;align-items:center;padding:16px 18px}
.activity-row .date{width:56px;flex:none;text-align:center;background:var(--green-light);border-radius:var(--r-md);padding:8px 0;color:var(--green-700)}
.activity-row .date b{display:block;font-size:19px;font-weight:800}
.activity-row .date span{font-size:10.5px;text-transform:uppercase;font-weight:700}
.activity-row .t{flex:1;min-width:0}
.activity-row h4{font-size:14.5px}
.activity-row .meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:14px;flex-wrap:wrap}
.activity-row .meta span{display:inline-flex;align-items:center;gap:4px}

.aid-card{padding:18px;display:flex;flex-direction:column;gap:10px}
.aid-card .top{display:flex;justify-content:space-between;align-items:flex-start}
.aid-card h4{font-size:14.5px}
.aid-card p{font-size:13px;color:var(--body);line-height:1.55}
.aid-card .meta{font-size:12px;color:var(--muted);display:flex;gap:12px;align-items:center}

.msg-shell{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 190px);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:#fff}
.msg-list{border-right:1px solid var(--border-2);overflow-y:auto}
.msg-item{display:flex;gap:11px;padding:13px 16px;border-bottom:1px solid var(--border-2);position:relative}
.msg-item:hover,.msg-item.active{background:var(--cream)}
.msg-item.active{border-left:3px solid var(--orange)}
.msg-item .t{flex:1;min-width:0}
.msg-item .t .r1{display:flex;justify-content:space-between;font-size:13px}
.msg-item .t b{font-weight:700}
.msg-item .t .time{font-size:11px;color:var(--muted)}
.msg-item .t p{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-thread{display:flex;flex-direction:column}
.msg-thread .th-head{padding:14px 20px;border-bottom:1px solid var(--border-2);display:flex;align-items:center;gap:12px}
.msg-thread .th-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.bubble{max-width:62%;padding:11px 15px;border-radius:16px;font-size:13.5px;line-height:1.5}
.bubble.in{background:var(--cream-2);align-self:flex-start;border-bottom-left-radius:4px}
.bubble.out{background:var(--orange);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.bubble .tm{display:block;font-size:10.5px;margin-top:5px;opacity:.65}
.msg-thread .th-foot{padding:14px 18px;border-top:1px solid var(--border-2);display:flex;gap:10px;align-items:center}
.msg-thread .th-foot input{flex:1}

.memory-card{overflow:hidden}
.memory-card img{height:170px;width:100%;object-fit:cover}
.memory-card .b{padding:16px 18px}
.memory-card h4{font-size:15px}
.memory-card p{font-size:12.5px;color:var(--body);margin-top:8px;line-height:1.6}
.memory-card .meta{margin-top:12px;font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between}

.trust-badge-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.trust-badge{padding:20px;text-align:center}
.trust-badge .ic{width:52px;height:52px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center}
.timeline{border-left:2px solid var(--border);margin-left:8px}
.tl-item{position:relative;padding:0 0 22px 22px}
.tl-item::before{content:'';position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--orange);border:2px solid #fff;box-shadow:0 0 0 2px var(--orange-light)}
.tl-item b{font-size:13.5px;display:block}
.tl-item span{font-size:12px;color:var(--muted)}

.priv-row{display:flex;align-items:center;justify-content:space-between;padding:15px 4px;border-bottom:1px solid var(--border-2)}
.priv-row:last-child{border-bottom:0}
.priv-row .l b{font-size:13.5px;display:block}
.priv-row .l span{font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--cream-2);border-radius:var(--r-full);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:var(--r-full);font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh-sm)}

.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;inset:0;background:var(--border);border-radius:var(--r-full);transition:.15s;cursor:pointer}
.switch .slider::before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked + .slider{background:var(--orange)}
.switch input:checked + .slider::before{transform:translateX(18px)}

.profile-head{display:flex;align-items:center;gap:16px;margin-top:0}
.profile-head .av{border:4px solid #fff;box-shadow:var(--sh-md)}
.profile-head .info{background:#fff;flex:1;border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 18px;box-shadow:var(--sh-sm);display:flex;align-items:center;gap:14px}
.profile-head h2{font-size:19px}
.profile-head .role{font-size:13px;color:var(--muted);margin-top:2px}

.kv-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border-2);font-size:13.5px}
.kv-row:last-child{border-bottom:0}
.kv-row .k{color:var(--muted)}
.kv-row .v{font-weight:600}

@media (max-width:1180px){
  .stat-row{grid-template-columns:repeat(3,1fr)}
  .feat-grid .grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:860px){
  .app-shell{grid-template-columns:1fr}
  .sidebar{display:none}
  .hero{min-height:460px}
  .hero h1{font-size:34px}
}

/* ---- Role switcher (topbar) ---- */
.role-switch{display:flex;gap:4px;background:var(--cream-2);border:1px solid var(--border);border-radius:var(--r-full);padding:3px}
.role-chip{display:flex;align-items:center;gap:6px;border:0;background:none;padding:6px 12px;border-radius:var(--r-full);font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:.15s}
.role-chip:hover{color:var(--ink)}
.role-chip.active{background:var(--orange);color:#fff;box-shadow:var(--sh-sm)}
@media (max-width:1180px){ .role-chip span{display:none} .role-chip{padding:7px 9px} }

/* ---- Role hint banner ---- */
.role-hint{display:flex;gap:12px;align-items:flex-start;background:var(--orange-light-2);border:1px solid var(--orange-light);border-left:3px solid var(--orange);border-radius:var(--r-md);padding:13px 16px;margin-bottom:22px;font-size:13.5px;color:var(--body);line-height:1.55}
.role-hint .ic{color:var(--orange-dark);flex:none;margin-top:1px}
.role-hint b{color:var(--ink)}

/* ---- Signals (Tín hiệu) ---- */
.signal-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:14px;transition:.15s;cursor:pointer}
.signal-card:hover{box-shadow:var(--sh-md);border-color:var(--orange-light)}
.signal-top{display:flex;align-items:center;gap:9px;margin-bottom:8px;flex-wrap:wrap}
.signal-card h3{font-size:15.5px;margin:2px 0 6px}
.signal-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.signal-meta span{display:flex;align-items:center;gap:5px}
.steps-bar{display:flex;align-items:center;gap:0;margin:16px 0}
.steps-bar .st{flex:1;text-align:center;position:relative;font-size:11px;color:var(--muted);font-weight:600}
.steps-bar .st .dot{width:26px;height:26px;border-radius:50%;background:var(--cream-2);border:2px solid var(--border);display:grid;place-items:center;margin:0 auto 6px;font-size:12px;color:var(--muted);position:relative;z-index:2}
.steps-bar .st.done .dot{background:var(--green-700,#1a6b4f);border-color:var(--green-700,#1a6b4f);color:#fff}
.steps-bar .st.active .dot{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 0 0 4px var(--orange-light)}
.steps-bar .st.done, .steps-bar .st.active{color:var(--ink)}
.steps-bar .st::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--border);z-index:1}
.steps-bar .st:first-child::before{display:none}
.steps-bar .st.done::before,.steps-bar .st.active::before{background:var(--green-700,#1a6b4f)}

/* ---- Jobs (Việc làm) ---- */
.job-card{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:14px;transition:.15s}
.job-card:hover{box-shadow:var(--sh-md)}
.job-card h3{font-size:16px;margin:0 0 4px;cursor:pointer}
.job-card h3:hover{color:var(--orange-dark)}
.job-tags{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.job-tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:var(--r-full);background:var(--cream-2);color:var(--body)}
.applicant-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-2)}
.applicant-row:last-child{border-bottom:0}
.applicant-row .info{flex:1;min-width:0}
.applicant-row .info b{font-size:13.5px}
.applicant-row .info p{font-size:12.5px;color:var(--muted);margin-top:2px}

/* ---- Fund (Quỹ) ---- */
.fund-hero{background:linear-gradient(135deg,#141414,#2A2A2A);color:#fff;border-radius:var(--r-xl);padding:32px;position:relative;overflow:hidden;margin-bottom:22px}
.fund-hero h2{color:#fff;font-size:24px;margin-bottom:8px}
.fund-hero p{color:#BDBDBD;font-size:14px;max-width:620px;line-height:1.6}
.fund-stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.fund-stat{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px}
.fund-stat .v{font-size:22px;font-weight:800;color:var(--ink)}
.fund-stat .l{font-size:12.5px;color:var(--muted);margin-top:3px}
.term-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.term-box{background:var(--cream-2);border-radius:var(--r-md);padding:16px;text-align:center}
.term-box .v{font-size:18px;font-weight:800;color:var(--orange-dark)}
.term-box .l{font-size:12px;color:var(--muted);margin-top:4px}

/* ---- Chess (Cờ tướng) ---- */
.chess-wrap{display:grid;grid-template-columns:max-content 300px;gap:24px;align-items:start;justify-content:center}
.xq-board{--cell:54px;position:relative;width:max-content;background:linear-gradient(#EFD3A0,#E7C489);border:3px solid #7A4E24;border-radius:10px;padding:calc(var(--cell)/2 + 6px);box-shadow:var(--sh-md)}
.xq-grid{position:relative;width:calc(var(--cell)*8);height:calc(var(--cell)*9)}
.xq-lines{position:absolute;inset:0;pointer-events:none}
.xq-lines line{stroke:#7A4E24;stroke-width:1.4}
.xq-river{position:absolute;left:0;right:0;top:calc(var(--cell)*4);height:var(--cell);display:flex;align-items:center;justify-content:space-around;color:#9A6A34;font-weight:700;font-size:15px;letter-spacing:.5em;pointer-events:none;font-family:serif}
.xq-pt{position:absolute;width:var(--cell);height:var(--cell);transform:translate(-50%,-50%);display:grid;place-items:center;cursor:pointer}
.xq-piece{pointer-events:none;width:calc(var(--cell) - 8px);height:calc(var(--cell) - 8px);border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:800;font-family:serif;background:radial-gradient(circle at 38% 32%,#FFF7E8,#E7Cfa0);border:2px solid #7A4E24;box-shadow:0 2px 3px rgba(0,0,0,.25);user-select:none}
.xq-piece.r{color:#C0392B;border-color:#C0392B}
.xq-piece.b{color:#1A1A1A;border-color:#333}
.xq-pt:hover .xq-piece{transform:translateY(-1px)}
.xq-piece{transition:transform .12s}
.xq-pt.sel .xq-piece{box-shadow:0 0 0 3px var(--orange),0 2px 6px rgba(0,0,0,.35);transform:translateY(-2px)}
.xq-pt.last::after{content:"";position:absolute;inset:6px;border:2px dashed rgba(122,78,36,.65);border-radius:50%;pointer-events:none}
.xq-pt .hint{pointer-events:none;width:14px;height:14px;border-radius:50%;background:rgba(20,120,80,.5)}
.xq-pt .hint.cap{width:calc(var(--cell) - 8px);height:calc(var(--cell) - 8px);background:none;border:3px solid rgba(200,60,40,.6);border-radius:50%}
.chess-side .panel{background:#fff;border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;margin-bottom:14px}
.turn-badge{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;margin-bottom:6px}
.turn-dot{width:16px;height:16px;border-radius:50%;border:2px solid #7A4E24}
.turn-dot.r{background:#C0392B}.turn-dot.b{background:#1A1A1A}
@media (max-width:1200px){ .xq-board{--cell:46px} }
@media (max-width:920px){ .chess-wrap{grid-template-columns:1fr;justify-content:start} .xq-board{--cell:34px} }
.cap-tray{display:flex;flex-wrap:wrap;gap:5px;min-height:30px}
.cap-pc{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:800;font-family:serif;background:#EFE3CC;border:1.5px solid #C8B79A}
.cap-pc.r{color:#C0392B;border-color:#d9a79f}
.cap-pc.b{color:#1A1A1A;border-color:#bbb}
.mv-list{max-height:210px;overflow-y:auto;font-size:12.5px}
.mv-row{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--border-2)}
.mv-row:last-child{border-bottom:0}
.mv-n{width:26px;color:var(--muted);flex:none}
.mv-r{color:#C0392B;font-weight:600;flex:1}
.mv-b{color:#1A1A1A;font-weight:600;flex:1}

/* ---- Profile (rich) ---- */
.profile-cover .cover-tag{position:absolute;bottom:10px;right:14px;font-size:11.5px;color:rgba(255,255,255,.85)}
.skill-mini{background:var(--cream-2);border:1px solid var(--border-2);border-radius:var(--r-md);padding:13px 15px}
.skill-mini b{font-size:13.5px;display:block}
.skill-mini p{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.endorse{background:var(--cream-2);border-left:3px solid var(--orange);border-radius:0 var(--r-md) var(--r-md) 0;padding:14px 16px}
.endorse p{font-size:13.5px;line-height:1.65;color:var(--body);font-style:italic}
.endorse .by{font-size:12.5px;color:var(--muted);margin-top:8px;font-weight:600}
.scope-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border-2);font-size:13px}
.scope-row:last-of-type{border-bottom:0}
.scope-row .k{color:var(--muted)}
.scope-row .v{font-weight:600}
.scope-tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:var(--r-full);background:var(--orange-light-2);color:var(--orange-dark)}
.scope-tag.closed{background:#EEE;color:#777}
.hist-row{display:flex;gap:12px;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--border-2)}
.hist-row:last-child{border-bottom:0}
.hist-row .d{color:var(--muted);flex:none;width:56px}
.hist-row .t{color:var(--body)}

/* ---- Relations graph ---- */
.rel-graph{position:relative;padding:16px}
.rel-chip{position:absolute;top:16px;right:18px;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--cream-2);border:1px solid var(--border);padding:5px 11px;border-radius:var(--r-full);z-index:2}
.rel-legend{display:flex;gap:22px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:8px 6px 4px}
.rel-legend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.rel-item{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--border-2)}
.rel-item:last-child{border-bottom:0}
.rel-item .info{flex:1;min-width:0}
.rel-item .info b{font-size:13.5px}
.rel-item .info p{font-size:12px;color:var(--muted);margin-top:2px}
.rel-item .rel-meta{font-size:11px;color:var(--muted);text-align:right;line-height:1.5}
.rel-item .rel-meta span{color:#1a6b4f;font-weight:600}
.note-soft{display:flex;gap:10px;align-items:flex-start;background:var(--cream-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;font-size:12.5px;color:var(--muted);line-height:1.6}
.note-soft svg{flex:none;margin-top:1px;color:var(--orange-dark)}

/* ---- Privacy 3-state segmented ---- */
.priv-field{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border-2)}
.priv-field:last-child{border-bottom:0}
.pf-l b{font-size:13.5px;display:block}
.pf-l span{font-size:12px;color:var(--muted)}
.pf-r{font-size:11.5px;color:var(--muted);min-width:88px;text-align:right}
.seg{display:inline-flex;background:var(--cream-2);border:1px solid var(--border);border-radius:var(--r-full);padding:3px}
.seg-btn{border:0;background:none;font-size:12px;font-weight:600;color:var(--muted);padding:6px 12px;border-radius:var(--r-full);cursor:pointer;white-space:nowrap}
.seg-btn.active{background:#141414;color:#fff}
.rights-card{background:var(--green-950);border-radius:var(--r-lg);padding:20px}
.rights-card .rc-title{font-size:11px;letter-spacing:.12em;color:#9A9A9A;font-weight:700;margin-bottom:12px}
.rights-card ul{list-style:none;margin:0 0 16px;padding:0}
.rights-card li{font-size:12.5px;color:#D4D4D4;padding:6px 0 6px 18px;position:relative;line-height:1.5}
.rights-card li::before{content:"—";position:absolute;left:0;color:#6A6A6A}

/* ---- Personal memory ledger ---- */
.mem-timeline{border-left:2px solid var(--border);margin-left:10px}
.mem-row{position:relative;display:flex;gap:14px;padding:0 0 20px 22px}
.mem-row:last-child{padding-bottom:0}
.mem-ic{position:absolute;left:-15px;top:-2px;width:28px;height:28px;border-radius:50%;background:#2C2C2C;color:#fff;display:grid;place-items:center;border:3px solid #fff}
.mem-ic.announce{background:var(--orange)}
.mem-ic.join{background:#141414;}
.mem-body{flex:1;min-width:0}
.mem-body b{font-size:13.5px;display:block}
.mem-body p{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}

.fb-doc{color:var(--orange-dark);font-weight:600}
.bar-item{margin-bottom:12px}
.bar-track{height:7px;border-radius:4px;background:var(--cream-2);margin-top:5px;overflow:hidden}
.bar-track span{display:block;height:100%;background:var(--green-950);border-radius:4px}
.bar-item:nth-child(2) .bar-track span{background:var(--orange)}
.chart-wrap{display:flex;align-items:flex-end;justify-content:space-around;height:190px;gap:12px;padding-bottom:8px}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.chart-bars{display:flex;align-items:flex-end;gap:4px;height:150px}
.cb{width:16px;border-radius:3px 3px 0 0;display:block}

.chart-lbl{font-size:11.5px;color:var(--body);margin-top:8px;font-weight:600}
.chart-lbl.muted{color:var(--muted);font-weight:400}
.seal{width:44px;height:44px;border-radius:50%;border:2px solid var(--orange);color:var(--orange-dark);display:grid;place-items:center;flex:none}

.queue-row.locked{opacity:.6}
.log-row{display:flex;gap:12px;align-items:flex-start;padding:12px 18px;border-bottom:1px solid var(--border-2)}
.log-row:last-child{border-bottom:0}
.log-time{font-size:11px;color:var(--muted);width:78px;flex:none;line-height:1.4}
.log-row b{font-size:13px;display:block}
.log-row p{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.hash{font-size:10px;color:var(--muted);font-family:ui-monospace,monospace;margin-top:4px}
.funnel{display:flex;align-items:center;gap:6px}
.fn-box{flex:1;border:1.5px solid var(--border);border-radius:var(--r-md);padding:14px 10px;text-align:center;background:#fff}
.fn-box.stuck{border-color:var(--danger,#C0392B);border-width:2px}
.fn-box b{font-size:22px;display:block;line-height:1}
.fn-box span{font-size:11.5px;display:block;margin-top:4px;font-weight:600}
.fn-box em{font-style:normal;font-size:10.5px;color:var(--muted)}
.fn-arrow{color:var(--orange);flex:none}
.fix-card{border:1.5px solid var(--border);border-radius:var(--r-md);padding:14px 16px;margin-bottom:10px}
.fix-card.on{border-color:var(--green-950);background:#F2F2F0}
.fix-card b{font-size:13.5px;display:block;margin-bottom:5px}
.fix-card p{font-size:12px;color:var(--muted);line-height:1.5}
.perm-table{width:100%;border-collapse:collapse;font-size:12px}
.perm-table th{padding:10px 8px;background:var(--cream-2);font-size:10px;letter-spacing:.04em;color:var(--muted);font-weight:700;text-align:center;white-space:nowrap}
.perm-table td{padding:9px 8px;border-top:1px solid var(--border-2);text-align:center}
.perm-table tr.pt-group td{background:var(--cream-2);font-size:10px;letter-spacing:.05em;font-weight:700;color:var(--muted);text-align:left;padding:8px 12px}
.search-hero{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--border);border-radius:var(--r-full);padding:8px 10px 8px 20px;margin-bottom:12px;color:var(--muted)}
.filter-row{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:12.5px;cursor:pointer}
.filter-row input{flex:none}
.filter-row span{flex:1}
.filter-row em{font-style:normal;font-size:11.5px;color:var(--muted)}
.sr-row{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--border-2);cursor:pointer}
.sr-row:last-child{border-bottom:0}
.sr-row .info{flex:1;min-width:0}
.sr-row .info b{font-size:13.5px;display:block}
.sr-row .info p{font-size:12px;color:var(--muted);margin-top:2px}
.sr-why{width:270px;flex:none;text-align:right}
.sr-why p{font-size:11.5px;color:var(--body);line-height:1.45;margin-top:3px}
.svc-hero{position:relative;border-radius:var(--r-lg);overflow:hidden;min-height:260px}
.svc-hero img{width:100%;height:100%;min-height:260px;object-fit:cover;position:absolute;inset:0}
.svc-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,25,18,.88),rgba(10,25,18,.15) 60%)}
.svc-cap{position:absolute;bottom:0;left:0;right:0;padding:22px;z-index:2}
.svc-cap h2{color:#fff;font-size:20px}
.svc-cap p{color:#BDBDBD;font-size:12.5px;margin-top:4px}
@media (max-width:1100px){ .sr-row{flex-wrap:wrap} .sr-why{width:100%;text-align:left} .funnel{flex-wrap:wrap} }

function secureImageUrl(path,fallback=AVATAR(1)){
  if(!path) return fallback;
  if(!String(path).startsWith('/files/')) return path;
  if(LIVE_FILE_URLS[path]) return LIVE_FILE_URLS[path];
  if(liveMode()&&!LIVE_FILE_LOADING[path]){
    LIVE_FILE_LOADING[path]=true;
    queueMicrotask(()=>api.blob(path).then(blob=>{
      LIVE_FILE_URLS[path]=URL.createObjectURL(blob);
      if(state.me?.avatar_url===path) CURRENT_USER.avatar=LIVE_FILE_URLS[path];
      render();
    }).catch(()=>{}).finally(()=>{delete LIVE_FILE_LOADING[path];}));
  }
  return fallback;
}

function profileAvatar(member,fallback=AVATAR(1)){

function playTing(){
  if(!soundEnabled || !soundUnlocked) return;
  try{
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    const ctx = new C(); const now = ctx.currentTime;
    [880, 660].forEach((hz,i)=>{ const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.value=hz; o.type='sine'; g.gain.setValueAtTime(0.0001, now+i*.11); g.gain.exponentialRampToValueAtTime(.12, now+i*.11+.015); g.gain.exponentialRampToValueAtTime(.0001, now+i*.11+.1); o.connect(g).connect(ctx.destination); o.start(now+i*.11); o.stop(now+i*.11+.12); });
  }catch(e){}
}
function unlockSound(){ soundUnlocked=true; playTing(); }
function stopRealtime(){ if(notificationStream){ notificationStream.close(); notificationStream=null; } }
async function loadLiveNotifications(){
  if(!liveMode()) return;
  try{ const r=await api.get('/notifications?limit=30'); LIVE_NOTIFICATIONS=r.data||[]; render(); }catch(e){ /* UI demo vẫn dùng được nếu API tạm unavailable */ }
}
function startRealtime(){
  stopRealtime();
  if(!liveMode() || !window.EventSource) return;
  const token=api.accessToken(); if(!token) return;
  notificationStream = new EventSource(api.baseUrl()+'/notifications/stream?access_token='+encodeURIComponent(token));
  notificationStream.addEventListener('notification', e=>{ try{ const n=JSON.parse(e.data); LIVE_NOTIFICATIONS.unshift(n); playTing(); render(); }catch(err){} });
  notificationStream.addEventListener('message', e=>{ try{
    const m=JSON.parse(e.data), me=currentActorId();
    if(!me || (m.sender_id!==me && m.recipient_id!==me)) return;
    const sentByMe=m.sender_id===me, id=sentByMe?m.recipient_id:m.sender_id;
    if(!id || id===me) return;
    if(!(LIVE_MESSAGES[id]||[]).some(x=>x.id===m.id))(LIVE_MESSAGES[id] ||= []).push(m);
    LIVE_CONTACTS[id]={id,full_name:sentByMe?m.recipient_name:m.sender_name,avatar_url:sentByMe?m.recipient_avatar_url:m.sender_avatar_url};
    playTing(); render();
  }catch(err){} });
  notificationStream.onerror=()=>{};
  loadLiveNotifications();
  loadLiveInbox();
}
async function loadLiveConversation(memberId){
  const me=currentActorId();
  if(!liveMode() || !memberId || memberId===me) return;
  try{
    const r=await api.get('/messages'+api.qs({with_member_id:memberId,limit:100}));
    LIVE_MESSAGES[memberId]=(r.data||[]).filter(m=>(m.sender_id===me&&m.recipient_id===memberId)||(m.sender_id===memberId&&m.recipient_id===me));
    const sample=LIVE_MESSAGES[memberId][0];
    if(sample&&!LIVE_CONTACTS[memberId]){
      const sentByMe=sample.sender_id===me;
      LIVE_CONTACTS[memberId]={id:memberId,full_name:sentByMe?sample.recipient_name:sample.sender_name,avatar_url:sentByMe?sample.recipient_avatar_url:sample.sender_avatar_url};
    }
    if(!LIVE_CONTACTS[memberId]) loadLiveContact(memberId);
    render();
  }catch(e){ toast(e.message,true); }
}
async function loadLiveContact(memberId){
  const me=currentActorId();
  if(!liveMode()||!memberId||memberId===me||LIVE_CONTACTS[memberId]) return;
  try{
    const member=await api.get('/members/'+encodeURIComponent(memberId));
    LIVE_CONTACTS[memberId]={id:member.id,full_name:member.full_name,job:member.job||'',area:member.area,avatar_url:member.avatar_url};
    render();
  }catch(e){}
}
async function loadLiveInbox(){
  if(!liveMode()) return;
  try{
    const r=await api.get('/messages?limit=100');
    const me=currentActorId(), nextMessages={}, nextContacts={};
    if(state.activeConvo&&state.activeConvo!==me&&LIVE_CONTACTS[state.activeConvo]){
      nextContacts[state.activeConvo]=LIVE_CONTACTS[state.activeConvo];
      nextMessages[state.activeConvo]=LIVE_MESSAGES[state.activeConvo]||[];
    }
    for(const m of (r.data||[])){
      if(m.sender_id!==me && m.recipient_id!==me) continue;
      const sentByMe=m.sender_id===me, id=sentByMe?m.recipient_id:m.sender_id;
      if(!id || id===me) continue;
      (nextMessages[id] ||= []).push(m);
      nextContacts[id]={id,full_name:sentByMe?m.recipient_name:m.sender_name,avatar_url:sentByMe?m.recipient_avatar_url:m.sender_avatar_url};
    }
    LIVE_MESSAGES=nextMessages;
    LIVE_CONTACTS=nextContacts;
    if(state.activeConvo===me) state.activeConvo=null;
    render();
  }catch(e){}
}
function liveContact(memberId){
  const row=LIVE_CONTACTS[memberId] || DIRECTORY.rows.find(x=>x.id===memberId);
  const area=row && (row.area_name || (typeof row.area==='object' ? row.area?.name : row.area));
  return row ? {id:row.id,name:row.full_name||row.name||'Thành viên',job:row.job||'',area:area||'',avatar:secureImageUrl(row.avatar_url,row.avatar||AVATAR(1))} : (findMember(memberId)||{id:memberId,name:'Đang tải thành viên…',job:'',area:'',avatar:AVATAR(1)});
}
function liveConversationSummaries(){
  if(!liveMode()) return [];
  const me=currentActorId();
  return Object.entries(LIVE_MESSAGES).filter(([memberId])=>memberId!==me).map(([memberId,messages])=>{
    const sorted=messages.slice().sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
    return {memberId,member:liveContact(memberId),last:sorted.at(-1),unread:sorted.filter(m=>m.recipient_id===state.me.id&&!m.read_at).length};
  }).filter(x=>x.last).sort((a,b)=>new Date(b.last.created_at)-new Date(a.last.created_at));
}
function isLiveConvo(){
  return liveMode() && state.activeConvo!==currentActorId()
    && Boolean(LIVE_CONTACTS[state.activeConvo] || (state.activeConvo && /^[0-9a-f-]{36}$/i.test(state.activeConvo)));
}

function esc(str){ return String(str==null?'':str).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){ return name.split(' ').filter(Boolean).slice(-2).map(w=>w[0]).join('').toUpperCase(); }
function fmtDate(d){ const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function dayNum(d){ return new Date(d+'T00:00:00').getDate(); }
function monthAbbr(d){ return 'Th' + (new Date(d+'T00:00:00').getMonth()+1); }

function toast(msg, isErr=false){
  const wrap=document.getElementById('toast-wrap');
  const el=document.createElement('div');
  el.className='toast'+(isErr?' err':'');
  el.innerHTML = ic(isErr?'alert':'check',17) + `<span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.25s'; setTimeout(()=>el.remove(),250); }, 3200);
}

/* form validation helper: rules = [[fieldName, value, [ [testFn, msg], ... ]]] */
function validateForm(formEl, rules){
  let ok=true; let firstErr=null;
  rules.forEach(([name, tests])=>{
    const fieldEl = formEl.querySelector(`[data-field="${name}"]`);
    if(!fieldEl) return;
    let fieldOk=true, msg='';
    for(const [test, m] of tests){ if(!test){ fieldOk=false; msg=m; break; } }
    fieldEl.classList.toggle('invalid', !fieldOk);
    const errEl = fieldEl.querySelector('.err');
    if(errEl) errEl.textContent = msg;
    if(!fieldOk){ ok=false; if(!firstErr) firstErr=fieldEl; }
  });
  if(firstErr) firstErr.scrollIntoView({behavior:'smooth', block:'center'});
  return ok;
}
function val(id){ const el=document.getElementById(id); return el ? el.value.trim() : ''; }
function unreadMsgCount(){
  if(liveMode()) return Object.values(LIVE_MESSAGES).flat().filter(m=>m.recipient_id===state.me.id && !m.read_at).length;
  return CONVERSATIONS.reduce((s,c)=>s+c.unread,0);
}
function unreadNotifCount(){ return liveMode() ? liveUnreadNotifications() : NOTIFICATIONS.filter(n=>!n.read).length; }

function buildTimeline(u){
  const items=[`Tham gia cộng đồng Nhà Chung 86 vào ${esc(u.joined||'—')}`];
  const skills = SKILLS.filter(s=>s.ownerId===u.id);
  if(skills.length) items.push(`Chia sẻ năng lực đầu tiên: “${esc(skills[0].title)}”`);
  items.push(`Đóng góp ${u.hours} giờ cho các hoạt động chung của cộng đồng`);
  if(u.hours>=70) items.push('Được cộng đồng ghi nhận là thành viên tích cực');
  if(u.verified) items.push('Hoàn tất xác minh danh tính tại Trung tâm tin cậy');
  return items.reverse();
}

function profileCapabilities(u){
  if(liveMode()) return (u.capabilities||[]).map(s=>({
    id:s.id,title:s.title,desc:s.description||'',cat:s.category||'',
    level:s.years_experience==null?'':`${s.years_experience} năm kinh nghiệm`
  }));
  return SKILLS.filter(s=>s.ownerId===u.id);
}

function profileWorkBadge(u){
  const summary=u.work_summary||{status:u.work_status||'paused'};
  const workerLabels={
    working:'Đang làm việc',agreed:'Đã nhận việc',ready:'Đang nhận việc',
    available:'Đang nhận việc',by_appointment:'Nhận việc theo hẹn',paused:'Tạm nghỉ nhận việc'
  };
  const posterLabels={working:'Đang có người thực hiện',agreed:'Đã thống nhất người làm'};
  const label=(summary.role==='poster'?posterLabels[summary.status]:null)
    ||workerLabels[summary.status]||'Chưa đặt trạng thái công việc';
  const detail=summary.job_title?` · ${summary.job_title}`:'';
  const tone=summary.status==='paused'?'badge-gray':'badge-green';
  return `<span class="badge ${tone}">${esc(label+detail)}</span>`;
}

function profileHistory(u){
  if(!liveMode()) return MEMORY_LOG.slice(0,4).map(m=>({title:m.title,occurred_at:m.date}));
  return u.participation_history||[];
}

function historyTitle(item){
  const prefix={
    joined:'Gia nhập cộng đồng',capability:'Công bố năng lực',work_completed:'Hoàn thành công việc',
    activity:'Tham gia hoạt động',job_posted:'Đăng nhu cầu công việc',job_connection:'Kết nối công việc'
  }[item.kind];
  if(item.kind==='joined') return prefix;
  return [prefix,item.title].filter(Boolean).join(': ');
}

function historyDate(value){
  const date=new Date(value);
  return Number.isNaN(date.getTime())?String(value||'—'):date.toLocaleDateString('vi-VN',{month:'2-digit',year:'numeric'});
}

function DemoRelationsPage(){
  const R=RELATIONS;
  // layout coordinates in a 720x470 viewBox

  const worked = [ {x:150,y:220}, {x:570,y:220}, {x:210,y:392} ];

  let edges='', nodes='';
  // referrer edge (solid orange)
  edges+=`<line x1="${cx}" y1="${cy}" x2="${ref.x}" y2="${ref.y}" stroke="${orange}" stroke-width="2.5"/>`;
  // worked edges (green, thickness by jobs)
  R.workedWith.forEach((w,i)=>{ const p=worked[i]||worked[0]; edges+=`<line x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}" stroke="${green}" stroke-width="${1.5+w.jobs}"/>`; });
  // broughtIn edges (orange dashed)
  R.broughtIn.forEach((b,i)=>{ const p=brought[i]||brought[0]; edges+=`<line x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}" stroke="${orange}" stroke-width="2" stroke-dasharray="5 5"/>`; });

  R.broughtIn.forEach((b,i)=>{ const p=brought[i]||brought[0]; nodes+=node(p.x,p.y,initials(b.name),b.name+' — tôi đưa vào','#2C2C2C'); });

  return `

          <div class="rel-legend">
            <span><i style="background:${orange}"></i> Sợi đưa vào cộng đồng — cố định, không đổi</span>
            <span><i style="background:${green}"></i> Đã cùng làm việc — dày lên theo số lần</span>

      <div class="grid" style="gap:16px">

          <div class="sc-head"><h3>Người đưa tôi vào</h3></div>
          <div class="card-pad" style="padding-top:10px">

              <div class="info"><b>${esc(R.referrer.name)}</b><p>${esc(R.referrer.job)} · ${esc(R.referrer.area)}</p></div>
              <div class="rel-meta">${esc(R.referrer.date)}<br><span>${esc(R.referrer.note)}</span></div>
            </div>
          </div>
        </div>
        <div class="section-card">
          <div class="sc-head"><h3>Tôi đã đưa vào cộng đồng</h3></div>

/* ===========================================================================
   MÀN DANH BẠ — MỐC 2. Màn DUY NHẤT của "Con người" chạy bằng dữ liệu THẬT.
   Nguồn: GET /members?q&area_id&page&limit  (mặc định `status=member`, chốt ở
   Task 10 — danh bạ không hiện `guest`/`left`).

   NGUYÊN TẮC 4, ĐIỂM SỐNG CÒN: danh sách KHÔNG BAO GIỜ trả `value`, kể cả
   trường mức `public` — mọi `contacts.<field>.value` đều là `null` theo thiết
   kế (đặc tả mục 5.2 dòng 789). Số thật chỉ đến từ
   GET /members/:id/contacts/:field: mỗi lần một trường, một người, một dòng
   nhật ký. Ở đây KHÔNG có đường tắt nào lấy số hàng loạt, và đừng thêm một
   đường như vậy: một vòng lặp gọi 20 lần cũng chính là lấy hàng loạt.
=========================================================================== */
// Gõ vào ô tìm kiếm không được bắn một request mỗi phím: mỗi lời gọi
// GET /members ghi MỘT dòng `member.list` vào audit_log, nên gõ 12 ký tự sẽ
// đẻ 12 dòng nhật ký cho một hành động duy nhất của người dùng.
let dirReloadTimer = null;
function scheduleDirectoryReload(){
  clearTimeout(dirReloadTimer);
  dirReloadTimer = setTimeout(function(){
    DIRECTORY.meta.page = 1;
    DIRECTORY.loaded = false;
    if(state.route === 'members') loadDirectory();
  }, 350);
}

function resetDirectory(){
  DIRECTORY.loading = false;
  DIRECTORY.loaded  = false;
  DIRECTORY.error   = null;
  DIRECTORY.rows    = [];
  DIRECTORY.meta    = {page:1, limit:20, total:0};
  DIRECTORY.phones  = {};
  DIRECTORY.pending = {};
}

async function loadDirectory(){
  if(DIRECTORY.loading) return;
  DIRECTORY.loading = true;
  DIRECTORY.error = null;
  try{
    // Ô lọc khu vực phải mang `area_id` (uuid) chứ không phải tên xã — tên xã
    // của dữ liệu giả không tra ngược ra id được. Lấy cây khu vực thật một lần.
    if(!DIRECTORY.areas.length){
      const a = await api.get('/areas');
      DIRECTORY.areas = flattenAreas(a.data || []);
    }
    const r = await api.get('/members' + api.qs({
      q: state.memberFilter.q,
      area_id: state.memberFilter.area,
      page: DIRECTORY.meta.page,
      limit: DIRECTORY.meta.limit
    }));
    DIRECTORY.rows = r.data;
    DIRECTORY.meta = r.meta;
    DIRECTORY.loaded = true;
  }catch(err){
    DIRECTORY.error = err.message;
    DIRECTORY.loaded = true;
  }finally{
    DIRECTORY.loading = false;
    // Giữ con trỏ trong ô tìm kiếm: người dùng gõ tiếp trong lúc chờ mạng là
    // chuyện thường, mà render() trần sẽ cướp focus giữa chừng.
    rerenderPreservingFocus();
  }
}

function flattenAreas(nodes, depth=0, out=[]){
  nodes.forEach(n=>{
    out.push({id:n.id, name:'— '.repeat(depth) + n.name});
    if(n.children && n.children.length) flattenAreas(n.children, depth+1, out);
  });
  return out;
}

/* Bấm "Xem số" → ĐÚNG MỘT lời gọi cho ĐÚNG MỘT người, ĐÚNG MỘT trường. */
async function revealPhone(id){
  if(DIRECTORY.pending[id] || DIRECTORY.phones[id]) return;
  DIRECTORY.pending[id] = true;
  render();
  try{
    const r = await api.get(`/members/${encodeURIComponent(id)}/contacts/phone`);
    DIRECTORY.phones[id] = r.value;
  }catch(err){
    toast(err.message, true);
  }finally{
    delete DIRECTORY.pending[id];
    rerenderPreservingFocus();
  }
}

/* `profile_fields` — bốn trường hồ sơ (job, area, price, family) nay cũng có
   mức riêng tư THẬT SỰ được cưỡng chế (Task 13). Máy chủ trả `job: null` khi
   chủ hồ sơ đã đóng, y như khi họ chưa khai — nên phải nhìn `state` mới nói
   đúng được. In "Chưa cập nhật nghề nghiệp" cho một trường bị CHỦ HỒ SƠ ẨN là
   thay một lời nói dối bằng một lời nói dối khác. */
function profileText(m, key, value, empty){
  const st = (m.profile_fields && m.profile_fields[key] && m.profile_fields[key].state) || 'visible';
  if(value) return value;
  return (st === 'visible' || st === 'self') ? empty : 'Chủ hồ sơ đã ẩn mục này';
}

/* Bao bì `contacts` của đặc tả mục 5.2 — sáu trạng thái, mỗi trạng thái một
   hình dạng nút. KHÔNG tự đoán trạng thái từ `level`: `state` là thứ máy chủ
   đã tính (fn_privacy_state trong CSDL), đoán lại ở đây là dựng bản sao thứ hai
   của luật riêng tư. */
function phoneCell(m){
  const c = (m.contacts && m.contacts.phone) || {state:'closed', value:null};
  const shown = DIRECTORY.phones[m.id];
  const busy = DIRECTORY.pending[m.id];

  if(shown) return `<div class="locked-bar" style="padding:9px 11px">${ic('phone',14)}<div><p style="font-size:12.5px;margin:0"><b>${esc(shown)}</b></p></div></div>`;

  switch(c.state){
    case 'self':
      return `<button class="btn btn-outline btn-sm btn-block" data-action="dir-show-phone" data-id="${esc(m.id)}" ${busy?'disabled':''}>${busy?'Đang lấy…':'Số của bạn — xem'}</button>`;
    case 'visible':
      return `<button class="btn btn-primary btn-sm btn-block" data-action="dir-show-phone" data-id="${esc(m.id)}" ${busy?'disabled':''}>${busy?'Đang lấy…':'Xem số'}</button>`;
    case 'can_request':
      return `<button class="btn btn-outline btn-sm btn-block" data-action="dir-request-phone" data-id="${esc(m.id)}">Xin xem số liên hệ</button>`;
    case 'requested':
      return `<div class="locked-bar" style="padding:9px 11px">${ic('clock',14)}<div><p style="font-size:11.5px;margin:0">Đang chờ chủ hồ sơ trả lời</p></div></div>`;
    case 'denied':
      return `<div class="locked-bar" style="padding:9px 11px;opacity:.55">${ic('lock',14)}<div><p style="font-size:11.5px;margin:0">Chủ hồ sơ chưa đồng ý. Có thể gửi yêu cầu mới khi cần.</p></div></div>`;
    default: // 'closed'
      return `<div class="locked-bar" style="padding:9px 11px">${ic('lock',14)}<div><p style="font-size:11.5px;margin:0">Chủ hồ sơ đã đóng thông tin này</p></div></div>`;
  }
}

function openWizard(name){ WIZ.name=name; WIZ.step=0; openModal(WizardHTML(), 'modal-lg'); }
function WizardHTML(){
  const w = WIZARDS[WIZ.name]; if(!w) return '';
  const s = w.steps[WIZ.step], last = WIZ.step===w.steps.length-1;
  return `
    <div class="modal-head"><div><h3>${esc(w.title)}</h3><div class="wz-sub">Bước ${WIZ.step+1} trên ${w.steps.length} · ${esc(s.label)}</div></div>
      <button class="modal-close" data-close-modal>${ic('x',16)}</button></div>
    <div class="wz-bar">${w.steps.map((st,i)=>`<div class="wz-dot ${i<WIZ.step?'done':''} ${i===WIZ.step?'active':''}"><span>${i<WIZ.step?ic('check',12):i+1}</span>${esc(st.label)}</div>`).join('')}</div>
    <form id="form-wizard" novalidate>
      <div class="modal-body">${s.html()}</div>
      <div class="modal-foot">
        ${WIZ.step>0?`<button class="btn btn-outline" type="button" data-action="wiz-back">${ic('chevronright',14)} Quay lại</button>`:`<button class="btn btn-outline" type="button" data-close-modal>Hủy</button>`}
        <button class="btn btn-outline" type="button" data-action="toast-demo" data-msg="Đã lưu nháp.">Lưu nháp</button>
        <button class="btn btn-primary" type="submit">${last?'Hoàn tất':'Tiếp tục'}</button>
      </div>
    </form>`;
}
function wizValidate(){
  const form = document.getElementById('form-wizard'); if(!form) return true;
  const w = WIZARDS[WIZ.name];
  const rules = {
    createSkill:[[['title','wz-sk-title',4,'Tên năng lực cần ít nhất 4 ký tự.'],['desc','wz-sk-desc',15,'Mô tả cần ít nhất 15 ký tự.']],[],[]],
    createAidReq:[[['title','wz-aid-title',5,'Vui lòng nói rõ việc cần giúp.'],['desc','wz-aid-desc',15,'Nói rõ hơn ít nhất 15 ký tự.']],[],[]],
    createActivity:[[['title','wz-ac-title',5,'Tên hoạt động cần ít nhất 5 ký tự.'],['desc','wz-ac-desc',15,'Mục đích cần ít nhất 15 ký tự.']],[],[]]
  }[WIZ.name] || [];
  const stepRules = rules[WIZ.step]||[];
  if(!stepRules.length) return true;
  return validateForm(form, stepRules.map(r=>[r[0], [[val(r[1]).length>=r[2], r[3]]]]));
}

function hasActualRole(role){ return Boolean(state.me?.roles?.includes(role)); }
function canReadJoinRequests(){ return hasActualRole('approver') || hasActualRole('content_ops'); }
function joinStatusLabel(status){
  return ({pending:'Chờ ban duyệt',met_confirmed:'Sẵn sàng duyệt',approved:'Đã duyệt',rejected:'Đã từ chối',draft:'Bản nháp'})[status] || status;
}
function joinStatusClass(status){
  return status==='approved' ? 'badge-green' : status==='rejected' ? 'badge-danger' : status==='met_confirmed' ? 'badge-orange' : 'badge-gray';
}
function joinDate(value){
  if(!value) return '';
  try{ return new Intl.DateTimeFormat('vi-VN',{dateStyle:'short',timeStyle:'short'}).format(new Date(value)); }
  catch(e){ return String(value); }
}
async function loadJoinRequests(force=false){
  if(!liveMode() || !canReadJoinRequests() || state.joinRequestsLoading) return;
  if(state.joinRequests && !force) return;
  state.joinRequestsLoading=true;
  state.joinRequestsError='';
  if(state.route==='admin') render();
  try{
    const r=await api.get('/join-requests?limit=100');
    state.joinRequests=r.data||[];
  }catch(err){
    state.joinRequestsError=err.message;
  }finally{
    state.joinRequestsLoading=false;
    if(state.route==='admin') render();
  }
}
async function approveJoinRequest(id, button){
  if(!hasActualRole('approver')){ toast('Tài khoản này không có quyền duyệt đơn.',true); return; }
  if(!confirm('Duyệt đơn này và tạo tài khoản thành viên chính thức?')) return;
  if(button) button.disabled=true;
  try{
    await api.post(`/join-requests/${encodeURIComponent(id)}/approve`, {note:'Duyệt từ bảng quản trị'});
    toast('Đã duyệt đơn và tạo tài khoản thành viên.');
    state.joinRequests=null;
    await loadJoinRequests(true);
  }catch(err){
    if(button) button.disabled=false;
    toast(err.message,true);
  }
}

            <p class="muted" style="font-size:11.5px;margin-top:8px">Một người giữ hai vai được, nhưng phải là hai bộ quyền tách bạch để nhật ký ghi rõ.</p>
          </div></div>
        <div class="rights-card"><div class="rc-title">HỢP NHẤT CÔNG CỤ THÌ ĐƯỢC, HỢP NHẤT QUYỀN LỰC THÌ KHÔNG</div><p style="font-size:12.5px;color:#D4D4D4;line-height:1.6;margin:0">Ở hội nhỏ, một người kiêm hai vai là chuyện thường. Nhưng một tài khoản có đủ mọi quyền thì không bao giờ chấp nhận được — vì khi có chuyện, không ai truy được ai đã làm gì.</p></div>
      </div>
    </div>`;
}

/* ---------- CỜ TƯỚNG (Xiangqi) ---------- */
const XQ_CH = {
  r:{K:'帥',A:'仕',E:'相',H:'傌',R:'俥',C:'炮',P:'兵'},
  b:{K:'將',A:'士',E:'象',H:'馬',R:'車',C:'砲',P:'卒'}
};
function xqStart(){
  const b = Array.from({length:10},()=>Array(9).fill(null));
  const back=['R','H','E','A','K','A','E','H','R'];
  for(let c=0;c<9;c++){ b[0][c]={t:back[c],s:'b'}; b[9][c]={t:back[c],s:'r'}; }
  b[2][1]={t:'C',s:'b'}; b[2][7]={t:'C',s:'b'};
  b[7][1]={t:'C',s:'r'}; b[7][7]={t:'C',s:'r'};
  for(let c=0;c<9;c+=2){ b[3][c]={t:'P',s:'b'}; b[6][c]={t:'P',s:'r'}; }
  return b;
}
const CHESS = { board:xqStart(), turn:'r', sel:null, targets:[], over:false, msg:'', check:false, history:[], moves:[], captured:[], last:null, flip:false };
function xqReset(){ CHESS.board=xqStart(); CHESS.turn='r'; CHESS.sel=null; CHESS.targets=[]; CHESS.over=false; CHESS.msg=''; CHESS.check=false; CHESS.history=[]; CHESS.moves=[]; CHESS.captured=[]; CHESS.last=null; }
function xqUndo(){
  const prev = CHESS.history.pop();
  if(!prev) return false;
  CHESS.board=prev.board; CHESS.turn=prev.turn; CHESS.captured=prev.captured;
  CHESS.msg=prev.msg; CHESS.over=prev.over; CHESS.check=false;
  CHESS.moves.pop(); CHESS.sel=null; CHESS.targets=[];
  const m=CHESS.history[CHESS.history.length-1];
  CHESS.last=null;
  return true;
}
function xqIn(r,c){ return r>=0&&r<10&&c>=0&&c<9; }
function xqSide(b,r,c){ return b[r][c]?b[r][c].s:null; }
function xqPalace(s,r,c){ if(c<3||c>5) return false; return s==='r'? (r>=7&&r<=9) : (r>=0&&r<=2); }
function xqClone(b){ return b.map(row=>row.map(p=>p?{t:p.t,s:p.s}:null)); }
function xqKing(b,s){ for(let r=0;r<10;r++)for(let c=0;c<9;c++){const p=b[r][c]; if(p&&p.t==='K'&&p.s===s) return [r,c];} return null; }
function xqPseudo(b,r,c){
  const p=b[r][c]; if(!p) return [];
  const s=p.s, res=[];
  const add=(rr,cc)=>{ if(xqIn(rr,cc)&&xqSide(b,rr,cc)!==s) res.push([rr,cc]); };
  if(p.t==='R'||p.t==='C'){
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(const [dr,dc] of dirs){
      let rr=r+dr,cc=c+dc;
      while(xqIn(rr,cc)&&!b[rr][cc]){ res.push([rr,cc]); rr+=dr; cc+=dc; }
      if(p.t==='R'){ if(xqIn(rr,cc)&&xqSide(b,rr,cc)!==s) res.push([rr,cc]); }
      else { // cannon: need a screen then a capture
        if(xqIn(rr,cc)){ rr+=dr; cc+=dc; while(xqIn(rr,cc)&&!b[rr][cc]){ rr+=dr; cc+=dc; } if(xqIn(rr,cc)&&xqSide(b,rr,cc)!==s) res.push([rr,cc]); }
      }
    }
  } else if(p.t==='H'){
    const cand=[[2,1],[2,-1],[-2,1],[-2,-1],[1,2],[1,-2],[-1,2],[-1,-2]];
    for(const [dr,dc] of cand){ const rr=r+dr,cc=c+dc; if(!xqIn(rr,cc)) continue;
      const lr = Math.abs(dr)===2 ? r+dr/2 : r, lc = Math.abs(dc)===2 ? c+dc/2 : c;
      if(b[lr][lc]) continue; add(rr,cc); }
  } else if(p.t==='E'){
    const cand=[[2,2],[2,-2],[-2,2],[-2,-2]];
    for(const [dr,dc] of cand){ const rr=r+dr,cc=c+dc; if(!xqIn(rr,cc)) continue;
      if(s==='r'&&rr<5) continue; if(s==='b'&&rr>4) continue;
      if(b[r+dr/2][c+dc/2]) continue; add(rr,cc); }
  } else if(p.t==='A'){
    for(const [dr,dc] of [[1,1],[1,-1],[-1,1],[-1,-1]]){ const rr=r+dr,cc=c+dc; if(xqPalace(s,rr,cc)) add(rr,cc); }
  } else if(p.t==='K'){
    for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){ const rr=r+dr,cc=c+dc; if(xqPalace(s,rr,cc)) add(rr,cc); }
  } else if(p.t==='P'){
    const fwd = s==='r'? -1 : 1; add(r+fwd,c);
    const crossed = s==='r'? r<=4 : r>=5;
    if(crossed){ add(r,c+1); add(r,c-1); }
  }
  return res;
}
function xqGeneralsFace(b){
  const rk=xqKing(b,'r'), bk=xqKing(b,'b'); if(!rk||!bk) return false;
  if(rk[1]!==bk[1]) return false;
  const c=rk[1]; const lo=Math.min(rk[0],bk[0]), hi=Math.max(rk[0],bk[0]);
  for(let r=lo+1;r<hi;r++){ if(b[r][c]) return false; }
  return true;
}
function xqAttacked(b, tr, tc, byS){
  for(let r=0;r<10;r++)for(let c=0;c<9;c++){ const p=b[r][c]; if(p&&p.s===byS){ if(xqPseudo(b,r,c).some(([mr,mc])=>mr===tr&&mc===tc)) return true; } }
  return false;
}
function xqInCheck(b,s){ const k=xqKing(b,s); if(!k) return true; return xqAttacked(b,k[0],k[1], s==='r'?'b':'r') || xqGeneralsFace(b); }
function xqLegal(b,r,c){
  return xqPseudo(b,r,c).filter(([rr,cc])=>{
    const nb=xqClone(b); nb[rr][cc]=nb[r][c]; nb[r][c]=null;
    return !xqInCheck(nb, b[r][c].s);
  });
}
function xqAnyLegal(b,s){ for(let r=0;r<10;r++)for(let c=0;c<9;c++){const p=b[r][c]; if(p&&p.s===s&&xqLegal(b,r,c).length) return true;} return false; }
const XQ_FILE = ['9','8','7','6','5','4','3','2','1'];
function xqNotation(p, sr, sc, rr, cc){
  const name = XQ_CH[p.s][p.t];
  const from = p.s==='r' ? XQ_FILE[sc] : String(sc+1);
  const to   = p.s==='r' ? XQ_FILE[cc] : String(cc+1);
  const dir = rr===sr ? 'bình' : ((p.s==='r') === (rr<sr) ? 'tiến' : 'thoái');
  return `${name}${from} ${dir} ${to}`;
}
function xqMove(r,c){
  if(CHESS.over) return;
  const b=CHESS.board, p=b[r][c];
  if(CHESS.sel){
    const [sr,sc]=CHESS.sel;
    if(CHESS.targets.some(([tr,tc])=>tr===r&&tc===c)){
      const moving=b[sr][sc], captured=b[r][c];
      CHESS.history.push({board:xqClone(b), turn:CHESS.turn, captured:CHESS.captured.map(x=>({...x})), msg:CHESS.msg, over:CHESS.over});
      CHESS.moves.push({txt:xqNotation(moving,sr,sc,r,c), side:CHESS.turn});
      if(captured) CHESS.captured.push({t:captured.t, s:captured.s});
      CHESS.last=[[sr,sc],[r,c]];
      b[r][c]=b[sr][sc]; b[sr][sc]=null;
      CHESS.sel=null; CHESS.targets=[];
      CHESS.turn = CHESS.turn==='r'?'b':'r';
      const opp=CHESS.turn;
      if(!xqAnyLegal(b,opp)){ CHESS.over=true; CHESS.msg = (opp==='r'?'Đen':'Đỏ')+' thắng! Chiếu bí.'; }
      else if(xqInCheck(b,opp)){ CHESS.check=true; CHESS.msg='Chiếu tướng!'; }
      else { CHESS.check=false; CHESS.msg=''; }
      render(); return;
    }
    if(p&&p.s===CHESS.turn){ CHESS.sel=[r,c]; CHESS.targets=xqLegal(b,r,c); render(); return; }
    CHESS.sel=null; CHESS.targets=[]; render(); return;
  } else {
    if(p&&p.s===CHESS.turn){ CHESS.sel=[r,c]; CHESS.targets=xqLegal(b,r,c); render(); }
  }
}
function ChessPage(){
  const b=CHESS.board;
  const U=100;
  // board lines svg
  let lines='';
  for(let r=0;r<10;r++) lines+=`<line x1="0" y1="${r*U}" x2="${8*U}" y2="${r*U}"/>`;
  for(let c=0;c<9;c++){
    if(c===0||c===8){ lines+=`<line x1="${c*U}" y1="0" x2="${c*U}" y2="${9*U}"/>`; }
    else { lines+=`<line x1="${c*U}" y1="0" x2="${c*U}" y2="${4*U}"/><line x1="${c*U}" y1="${5*U}" x2="${c*U}" y2="${9*U}"/>`; }
  }
  lines+=`<line x1="${3*U}" y1="0" x2="${5*U}" y2="${2*U}"/><line x1="${5*U}" y1="0" x2="${3*U}" y2="${2*U}"/>`;
  lines+=`<line x1="${3*U}" y1="${7*U}" x2="${5*U}" y2="${9*U}"/><line x1="${5*U}" y1="${7*U}" x2="${3*U}" y2="${9*U}"/>`;
  let pts='';
  for(let r=0;r<10;r++)for(let c=0;c<9;c++){
    const p=b[r][c];
    const isSel = CHESS.sel && CHESS.sel[0]===r && CHESS.sel[1]===c;
    const tgt = CHESS.targets.some(([tr,tc])=>tr===r&&tc===c);
    const left=(c/8*100), top=(r/9*100);
    let inner='';
    if(p&&tgt) inner=`<div class="hint cap"></div><div class="xq-piece ${p.s}" style="position:absolute">${XQ_CH[p.s][p.t]}</div>`;
    else if(p) inner=`<div class="xq-piece ${p.s}">${XQ_CH[p.s][p.t]}</div>`;
    else if(tgt) inner=`<div class="hint"></div>`;
    const isLast = CHESS.last && CHESS.last.some(([lr,lc])=>lr===r&&lc===c);
    pts+=`<div class="xq-pt ${isSel?'sel':''} ${isLast?'last':''}" style="left:${left}%;top:${top}%" data-action="chess-cell" data-r="${r}" data-c="${c}">${inner}</div>`;
  }
  const turnTxt = CHESS.turn==='r'?'Đỏ đi':'Đen đi';
  return `
    <div class="page-head"><div><h1>Cờ tướng</h1><p>Bàn cờ giao lưu giữa các thành viên — chơi trực tiếp 2 người trên cùng màn hình (Đỏ đi trước).</p></div></div>
    ${roleHint('Chọn quân của bên đang tới lượt rồi bấm vào điểm sáng để đi. Đủ luật: mã cản chân, tượng không qua sông, pháo cần ngòi, chiếu tướng và cấm lộ mặt tướng.')}
    <div class="chess-wrap">
      <div class="xq-board">
        <div class="xq-grid">
          <svg class="xq-lines" viewBox="0 0 ${8*U} ${9*U}" preserveAspectRatio="none">${lines}</svg>
          <div class="xq-river">楚 河　　漢 界</div>
          ${pts}
        </div>
      </div>
      <div class="chess-side">
        <div class="panel">
          <div class="turn-badge"><span class="turn-dot ${CHESS.turn}"></span>${CHESS.over?'Kết thúc':turnTxt}</div>
          ${CHESS.msg?`<div class="badge ${CHESS.over?'badge-green':'badge-danger'}" style="margin-top:6px">${esc(CHESS.msg)}</div>`:`<p style="font-size:12.5px;color:var(--muted);margin-top:4px">Nước thứ ${CHESS.moves.length+1} · chúc hai bên chơi vui!</p>`}
          <div class="flex gap-8 mt-14">
            <button class="btn btn-outline btn-sm" style="flex:1" data-action="chess-undo" ${CHESS.history.length?'':'disabled'}>${ic('rotate',14)} Đi lại</button>
            <button class="btn btn-dark btn-sm" style="flex:1" data-action="chess-reset">Ván mới</button>
          </div>
        </div>
        <div class="panel">
          <b style="font-size:13.5px;display:block;margin-bottom:8px">Quân đã bị ăn</b>
          <div class="cap-tray">${CHESS.captured.length? CHESS.captured.map(q=>`<span class="cap-pc ${q.s}">${XQ_CH[q.s][q.t]}</span>`).join('') : '<span style="font-size:12px;color:var(--muted)">Chưa mất quân nào</span>'}</div>
        </div>
        <div class="panel">
          <b style="font-size:13.5px;display:block;margin-bottom:8px">Biên bản ván cờ</b>
          ${CHESS.moves.length? `<div class="mv-list">${CHESS.moves.reduce((acc,m,i)=>{ if(i%2===0) acc.push([m,null]); else acc[acc.length-1][1]=m; return acc; },[]).map((pair,i)=>`
            <div class="mv-row"><span class="mv-n">${i+1}.</span><span class="mv-r">${esc(pair[0].txt)}</span><span class="mv-b">${pair[1]?esc(pair[1].txt):''}</span></div>`).join('')}</div>`
            : '<p style="font-size:12px;color:var(--muted)">Chưa có nước nào. Đỏ đi trước.</p>'}
        </div>
        <div class="panel">
          <b style="font-size:13.5px;display:block;margin-bottom:8px">Quy ước quân</b>
          <div style="font-size:12.5px;color:var(--body);line-height:1.9">
            <div><span style="color:#C0392B;font-weight:700">Đỏ</span>: 帥 tướng · 仕 sĩ · 相 tượng · 傌 mã · 俥 xe · 炮 pháo · 兵 tốt</div>
            <div><span style="font-weight:700">Đen</span>: 將 tướng · 士 sĩ · 象 tượng · 馬 mã · 車 xe · 砲 pháo · 卒 tốt</div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function render(){
  const root = document.getElementById('root');
  root.innerHTML = state.user ? AppShell() : Landing();
}
function rerenderPreservingFocus(){
  const ae = document.activeElement;
  const id = ae && ae.id;
  const start = ae && typeof ae.selectionStart==='number' ? ae.selectionStart : null;
  const end = ae && typeof ae.selectionEnd==='number' ? ae.selectionEnd : null;
  render();
  if(id){
    const el = document.getElementById(id);
    if(el){
      el.focus();
      if(start!=null && el.setSelectionRange){ try{ el.setSelectionRange(start,end); }catch(e){} }
    }
  }
}

/* ============================================================
   23. GLOBAL SEARCH (topbar)
   ============================================================ */
function updateGlobalSearch(q){
  const box = document.getElementById('global-search-results');
  if(!box) return;
  q = q.trim().toLowerCase();
  if(!q){ box.classList.remove('show'); box.innerHTML=''; return; }
  const mMatches = [CURRENT_USER,...MEMBERS].filter(m=>(m.name+m.job).toLowerCase().includes(q)).slice(0,3);
  const sMatches = SKILLS.filter(s=>(s.title+s.desc).toLowerCase().includes(q)).slice(0,3);
  const pMatches = PROJECTS.filter(p=>(p.title+p.area).toLowerCase().includes(q)).slice(0,3);
  const aMatches = ACTIVITIES.filter(a=>(a.title+a.location).toLowerCase().includes(q)).slice(0,3);
  let html='';
  if(mMatches.length) html += `<div class="tsr-cat">Con người</div>` + mMatches.map(m=>`
    <div class="tsr-item" data-action="nav" data-route="${m.id===CURRENT_USER.id?'profile':'member'}" data-id="${m.id}" style="cursor:pointer">
      <img class="av" src="${m.avatar}" width="28" height="28"><div><b>${esc(m.name)}</b><small>${esc(m.job)}</small></div>
    </div>`).join('');
  if(sMatches.length) html += `<div class="tsr-cat">Năng lực</div>` + sMatches.map(s=>`
    <div class="tsr-item" data-action="nav" data-route="skills" style="cursor:pointer"><div>${ic('star',15)}</div><div><b>${esc(s.title)}</b><small>${esc(s.cat)}</small></div></div>`).join('');
  if(pMatches.length) html += `<div class="tsr-cat">Việc chung</div>` + pMatches.map(p=>`
    <div class="tsr-item" data-action="nav" data-route="project" data-id="${p.id}" style="cursor:pointer"><div>${ic('briefcase',15)}</div><div><b>${esc(p.title)}</b><small>${esc(p.area)}</small></div></div>`).join('');
  if(aMatches.length) html += `<div class="tsr-cat">Hoạt động</div>` + aMatches.map(a=>`
    <div class="tsr-item" data-action="nav" data-route="activity" data-id="${a.id}" style="cursor:pointer"><div>${ic('calendar',15)}</div><div><b>${esc(a.title)}</b><small>${esc(a.location)}</small></div></div>`).join('');
  if(!html) html = `<div class="tsr-item"><span class="muted">Không tìm thấy kết quả cho “${esc(q)}”</span></div>`;
  box.innerHTML = html;
  box.classList.add('show');
}
