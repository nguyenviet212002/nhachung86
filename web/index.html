--------------------------------------------------------------------------- */
function busy(form, on, label){
  const btn = form && form.querySelector('button[type="submit"]');
  if(!btn) return;
  btn.disabled = on;
  if(on){ btn.dataset.label = btn.textContent; btn.textContent = label || 'Đang xử lý…'; }
  else if(btn.dataset.label){ btn.textContent = btn.dataset.label; }
}

function applyProfileToCurrentUser(profile){
  if(!profile) return;
  Object.assign(CURRENT_USER,{
    id:profile.id,name:profile.full_name||CURRENT_USER.name,job:profile.job||'',bio:profile.bio||'',
    area:profile.area?.name||'',phone:profile.contact_values?.phone||'',email:profile.email||'',
    joined:profile.joined_at?new Date(profile.joined_at).toLocaleDateString('vi-VN'):'—',
    verified:profile.status==='member',avatar_url:profile.avatar_url||null,
    work_status:profile.work_status,work_summary:profile.work_summary,
    capabilities:profile.capabilities||[],referrer:profile.referrer||null,
    participation_history:profile.participation_history||[]
  });
  CURRENT_USER.avatar=secureImageUrl(profile.avatar_url,CURRENT_USER.avatar);
}

async function refreshCurrentProfile(){
  const profile=await api.get('/members/me');
  state.me={...state.me,...profile};
  applyProfileToCurrentUser(profile);
  try{localStorage.setItem('nc_member',JSON.stringify(state.me));}catch(e){}
  return profile;
}

async function doLoginReal(form, identifier, password){
  busy(form, true, 'Đang đăng nhập…');
  try{
    const r = await api.post('/auth/login', {identifier, password});
    api.setTokens(r);                       // { access, refresh } — snake_case của đặc tả
    const [identity,profile] = await Promise.all([api.get('/auth/me'),api.get('/members/me')]);
    if(!identity?.actor?.id || !profile?.id || identity.actor.id!==profile.id || (r.member?.id&&r.member.id!==profile.id)){
      throw new Error('Danh tính phiên đăng nhập không đồng nhất. Vui lòng đăng nhập lại.');
    }
    resetLiveMessaging(); LIVE_NOTIFICATIONS=[]; state.relations=null;
    state.me = {...r.member, ...(profile||{}), ...(identity?.actor||{}), roles:identity?.actor?.roles||[]};
    try{ localStorage.setItem('nc_member', JSON.stringify(state.me)); }catch(e){}
    // Từ đây danh tính frontend dùng cùng UUID với backend; quyền đăng việc,
    // sửa năng lực và hồ sơ đều so với chính id thành viên này.
    applyProfileToCurrentUser(profile);
    state.user = CURRENT_USER;
    if(state.me.roles.includes('approver')){
      state.role = 'admin';
      state.route = 'admin';
      state.joinRequests = null;
    }else{
      state.route = 'members';              // vào thẳng màn đã nối API thật
    }
    resetDirectory();
    state.marketLoaded=false; LIVE_JOB_DETAILS={};
    unlockSound();
    startRealtime();
    closeModal();
    render();
    loadMarketplace();
    if(state.route==='admin') loadJoinRequests();
    toast(`Đăng nhập thành công! Chào mừng trở lại, ${r.member.full_name.split(' ').slice(-1)[0]}.`);
  }catch(err){
    busy(form, false);
    toast(err.message, true);
  }
}

async function regSubmit(form){
  busy(form, true, 'Đang gửi đơn…');
  const d = state.regDraft;
  try{
    const r = await api.post('/auth/register', {
      phone: d.phone,
      full_name: d.full_name,
      birth_year: Number(d.birth_year),
      area_id: d.area_id,
      invite_token: d.invite_token,
      password: d.password,

    });

    state.regDraft.password = '';   // không giữ mật khẩu trong bộ nhớ lâu hơn mức cần

    busy(form, false);

    case 'dir-page':

    case 'dir-show-phone':

    case 'job-close':

    case 'job-delete':

    case 'toggle-dd': {

    case 'mark-all-read':
      if(liveMode()){
        Promise.all(LIVE_NOTIFICATIONS.filter(n=>!n.read_at).map(n=>api.post('/notifications/'+n.id+'/read'))).then(()=>{ LIVE_NOTIFICATIONS.forEach(n=>n.read_at=n.read_at||new Date().toISOString()); render(); }).catch(err=>toast(err.message,true));

    case 'open-notification': {
      const notice=liveNotifications().find(n=>n.id===id);
      if(!notice) break;
      if(liveMode()&&!notice.read_at) api.post('/notifications/'+encodeURIComponent(id)+'/read').then(r=>{notice.read_at=r.read_at;render();}).catch(()=>{});
      if(notice.target_type==='post'&&notice.target_id) go('jobResult',{id:notice.target_id});

      else if(notice.target_type==='member'&&notice.target_id){go(notice.target_id===state.me?.id?'profile':'member',{id:notice.target_id});}
      else if(notice.target_type==='notification') go('privacy');
      closeAllDropdowns();
      break;
    }
    case 'open-convo':
      state.activeConvo = id;
      go('messages');
      break;
    case 'open-convo-with': {
      if(liveMode()){
        if(!id || id===currentActorId()){
          toast('Không thể mở cuộc trò chuyện với chính tài khoản đang đăng nhập.', true);
          break;
        }
        if(/^[0-9a-f-]{36}$/i.test(id) && id!==state.me.id){

            recipient_id:id,
            kind:'activity',
            title:'Có thành viên muốn kết nối',
            body:`${CURRENT_USER.name} vừa mở cuộc trò chuyện với bạn.`,
            target_type:'member',
            target_id:state.me.id
          }).catch(()=>{});

        state.activeConvo=id;
        const row=DIRECTORY.rows.find(x=>x.id===id) || state.memberDetails[id]?.raw;

      state.activeConvo = c.id;
      go('messages');
      break;
    }

    case 'join-project': {

    }
    case 'switch-live-convo':

        render();

    case 'relations-reload':

    case 'create-invite-link': {

        input.select();

      // thành viên và trang quản trị khi tài khoản có quyền thật.
      if(state.role==='admin') state.route='admin';

      state.joinRequests=null;
      loadJoinRequests(true);
      break;

      approveJoinRequest(id,actionEl);
      break;
    case 'join-reject':
      openModal(JoinRejectModal(id));
      break;
    case 'chess-cell':
      xqMove(+actionEl.dataset.r, +actionEl.dataset.c);
      break;
    case 'chess-undo':
      if(xqUndo()){ render(); toast('Đã lùi lại một nước.'); }
      break;
    case 'chess-reset':
      xqReset(); render(); toast('Đã bắt đầu ván cờ mới.');
      break;
    case 'accept-applicant': {
      const j = JOBS.find(x=>x.id===actionEl.dataset.job);
      if(j){ const a=j.applicants[+actionEl.dataset.idx]; if(a){ a.status='Đã nhận'; toast(`Đã nhận ${a.name}. Hãy liên hệ trực tiếp để trao đổi.`); render(); } }
      break;
    }
    case 'reject-applicant': {
      const j = JOBS.find(x=>x.id===actionEl.dataset.job);
      if(j){ const a=j.applicants[+actionEl.dataset.idx]; if(a){ a.status='Từ chối'; toast(`Đã từ chối ${a.name}.`,true); render(); } }
      break;
    }
    case 'fund-repaid': {
      const l = FUND.ledger.find(x=>x.id===id);
      if(l && !l.repaid){ l.repaid=true; FUND.disbursed=FUND.ledger.reduce((s,x)=>s+(x.repaid?0:x.amount),0); toast(`Đã đánh dấu khoản của ${l.borrower} là đã hoàn trả.`); render(); }
      break;
    }
  }

  // memory image picker (inside create-memory modal)
  const pick = e.target.closest('[data-pick-img]');
  if(pick){
    selectedMemoryImg = pick.dataset.pickImg;
    document.querySelectorAll('.mem-pick-img').forEach(img=>img.style.border='2px solid transparent');
    pick.style.border = '2px solid var(--orange)';
  }
});

  if(imgIn && e.target.files && e.target.files[0]){
    const file = e.target.files[0];
    if(!file.type.startsWith('image/')){ toast('Vui lòng chọn tệp ảnh hợp lệ.', true); e.target.value=''; return; }
    if(file.size > 5*1024*1024){ toast('Ảnh quá lớn (tối đa 5MB).', true); e.target.value=''; return; }
    const reader = new FileReader();
    reader.onload = ev=>{
      const data = ev.target.result;
      const kind = imgIn.dataset.imgInput;
      const prev = document.getElementById(imgIn.dataset.imgPreview);
      if(prev){ prev.src = data; prev.style.display='block'; }
      if(kind==='avatar') uploadedAvatarData = data;
      else if(kind==='memory'){ uploadedMemoryData = data; document.querySelectorAll('.mem-pick-img').forEach(img=>img.style.border='2px solid transparent'); }
      if(liveMode()){
        api.upload('/files', file, kind==='avatar' ? {purpose:'member_avatar'} : {})
          .then(async r=>({id:r.id,blob:await api.blob('/files/'+r.id)}))
          .then(async uploaded=>{
            const blob=uploaded.blob;
            const url=URL.createObjectURL(blob);
            if(prev){ prev.src=url; prev.style.display='block'; }
            if(kind==='avatar'){
              uploadedAvatarData=url;
              const avatarPath='/files/'+uploaded.id;
              const updated=await api.patch('/members/me',{avatar_url:avatarPath});
              LIVE_FILE_URLS[avatarPath]=url;
              CURRENT_USER.avatar_url=avatarPath;
              CURRENT_USER.avatar=url;
              state.me={...state.me,...updated,avatar_url:avatarPath};
              try{localStorage.setItem('nc_member',JSON.stringify(state.me));}catch(e){}
            }else if(kind==='memory') uploadedMemoryData=url;
            toast(kind==='avatar'?'Đã lưu ảnh đại diện. Tải lại trang vẫn giữ nguyên.':'Đã tải ảnh lên máy chủ.');
          })
          .catch(err=>toast(err.message,true));
      }
    };
    reader.readAsDataURL(file);
    return;
  }
  if(e.target.id==='member-area'){ state.memberFilter.area = e.target.value; DIRECTORY.meta.page = 1; DIRECTORY.loaded = false; render(); }
  const priv = e.target.closest('[data-action-change="privacy-scope"]');
  if(priv){ toast(`Đã cập nhật quyền riêng tư cho "${priv.previousElementSibling ? priv.closest('.priv-row').querySelector('.l b').textContent : ''}"`); }
  const notif = e.target.closest('[data-action-change="notif-pref"]');
  if(notif){ NOTIF_PREFS[notif.dataset.key] = notif.checked; toast('Đã cập nhật tùy chọn thông báo.'); }
  const scope = e.target.closest('.scope-check');
  if(scope){ scope.classList.toggle('on', e.target.checked); }
});

      go('memory');
    }
    return;
  }

  if(form.id==='form-report-issue'){
    e.preventDefault();
    const story=val('rp-story');
    const ok = validateForm(form, [ ['story', [[story.length>=20, 'Vui lòng kể lại sự việc, ít nhất 20 ký tự.']]] ]);
    if(ok){ toast('Đã gửi tới Ban điều hành. Anh chị sẽ nhận trả lời trong 3 ngày.'); go('dispute'); }
    return;
  }

  if(form.id==='form-wizard'){
    e.preventDefault();
    if(!wizValidate()) return;
    const w = WIZARDS[WIZ.name];
    if(WIZ.step < w.steps.length-1){ WIZ.step++; openModal(WizardHTML(),'modal-lg'); }
    else {
      // Năng lực dùng API thật khi có phiên; các wizard khác vẫn giữ dữ liệu
      // cũ cho tới khi module tương ứng được nối.
      if(WIZ.name==='createSkill'&&liveMode()){
        const payload={title:val('wz-sk-title')||'Năng lực mới',description:val('wz-sk-desc')||null,category:val('wz-sk-cat')||null,price:val('wz-sk-price')||null,status:'published'};
        api.post('/capabilities',payload).then(async()=>{await refreshCurrentProfile();closeModal();WIZ.name=null;WIZ.step=0;state.marketLoaded=false;loadMarketplace(true);go('skills');toast('Đã đăng năng lực.');}).catch(err=>toast(err.message,true));
        return;
      }
      if(WIZ.name==='createSkill'){ CAP_NEW.unshift({init:'NH', title:val('wz-sk-title')||'Năng lực mới', by:state.user.name+' · '+(val('wz-sk-area')||'khu vực của tôi'), st:'Sẵn sàng'}); }
      if(WIZ.name==='createAidReq'){ AID_NEED.unshift({title:val('wz-aid-title')||'Việc cần giúp', sub:(val('wz-aid-when')||'chưa rõ thời gian')+' · '+(val('wz-aid-where')||''), tag:'Vừa gửi'}); }
      if(WIZ.name==='createActivity'){ ACT_UPCOMING.unshift({d:'—', m:'MỚI', title:val('wz-ac-title')||'Hoạt động mới', sub:(val('wz-ac-time')||'')+' · '+(val('wz-ac-place')||''), tag:'Vừa tạo'}); }
      const done = w.done, route = w.route;
      closeModal(); WIZ.name=null; WIZ.step=0;
      go(route); toast(done);
    }
    return;
  }

  if(form.id==='form-job-post'){
    e.preventDefault();
    const title=val('jp-title'), desc=val('jp-desc');
    const ok = validateForm(form, [
      ['title', [[title.length>=6, 'Tên công việc cần ít nhất 6 ký tự.']]],
      ['desc', [[desc.length>=15, 'Mô tả công việc cần ít nhất 15 ký tự.']]],
    ]);
    if(ok&&liveMode()){
      const due=val('jp-due');
      const payload={title,description:desc,terms:val('jp-terms')||null,area_id:val('jp-area')||null,job_type:'thoi_vu',close_at:due?new Date(due+'T23:59:59+07:00').toISOString():null};
      const call=state.editingJobId?api.patch(`/jobs/${encodeURIComponent(state.editingJobId)}`,payload):api.post('/jobs',payload);
      call.then(async j=>{await refreshCurrentProfile();state.editingJobId=null;LIVE_JOB_DETAILS={};state.marketLoaded=false;loadMarketplace(true);toast('Đã lưu nhu cầu việc.');go('jobResult',{id:j.id});}).catch(err=>toast(err.message,true));
    }else if(ok){ JOB_NEEDS.unshift({id:'nd'+Date.now(), title, area:val('jp-area')||'Khu vực 5', terms:val('jp-terms')||'thỏa thuận', by:state.user.name, init:'ĐS', status:'Đang mở'}); toast('Đã đăng nhu cầu!'); go('jobs'); }
    return;
  }

  if(form.id==='form-ready-profile'){
    e.preventDefault();
    const headline=val('ready-headline');
    if(headline.length<3){toast('Hãy ghi rõ công việc bạn có thể nhận.',true);return;}
    api.put('/jobs/ready/me',{headline,availability:val('ready-availability')||null,note:val('ready-note')||null,status:val('ready-status')||'ready',area_id:state.me?.area_id||null})
      .then(async()=>{await refreshCurrentProfile();state.marketLoaded=false;loadMarketplace(true);toast('Đã cập nhật trạng thái nhận việc.');render();})
      .catch(err=>toast(err.message,true));
    return;
  }

  if(form.id==='form-signal-compose'){
    e.preventDefault();
    const title=val('sc2-title'), desc=val('sc2-desc');
    const ok = validateForm(form, [
      ['title', [[title.length>=6, 'Tiêu đề cần ít nhất 6 ký tự.']]],
      ['desc', [[desc.length>=15, 'Nội dung cần ít nhất 15 ký tự.']]],
    ]);
    if(ok){ toast('Đã phát tín hiệu tới 7 người! Xem hành trình bên dưới.'); go('signalJourney'); }
    return;
  }

  if(form.id==='form-signal-respond'){
    e.preventDefault();
    const cond=val('sr-cond');
    const ok = validateForm(form, [ ['cond', [[cond.length>=10, 'Vui lòng ghi rõ điều kiện bạn cần (ít nhất 10 ký tự).']]] ]);
    if(ok){ toast('Đã gửi phản hồi theo khung! Người gửi sẽ so được với các phương án khác.'); go('signals'); }
    return;
  }

  if(form.id==='form-loan-apply'){
    e.preventDefault();
    const name=val('ln-name'), phone=val('ln-phone'), guarantor=val('ln-guarantor'), bank=val('ln-bank');
    const ok = validateForm(form, [
      ['name', [[name.length>=3, 'Vui lòng nhập họ tên.']]],
      ['phone', [[/^[0-9\s]{9,11}$/.test(phone), 'Số điện thoại không hợp lệ.']]],
      ['guarantor', [[!!guarantor, 'Vui lòng chọn người bảo chứng trong Hội.']]],
      ['bank', [[bank.length>=6, 'Vui lòng nhập số tài khoản chính chủ.']]],
    ]);
    if(ok){
      closeModal();
      toast(`Đã chuẩn bị xong hồ sơ. Vui lòng gửi qua Zalo của quỹ (${FUND.phone}) để được xét duyệt.`);
    }
    return;
  }

  if(form.id==='form-fund-disburse'){
    e.preventDefault();
    const borrower=val('fd-borrower'), guarantor=val('fd-guarantor');
    const ok = validateForm(form, [
      ['borrower', [[borrower.length>=1, 'Vui lòng nhập tên/viết tắt người vay.']]],
      ['guarantor', [[!!guarantor, 'Vui lòng chọn người bảo chứng.']]],
    ]);
    if(ok){
      const remain = FUND.total - FUND.disbursed;
      if(remain < FUND.perLoan){ toast('Quỹ không đủ số dư để giải ngân.', true); return; }
      const d='2026-08-17'; const due='2026-08-27';
      FUND.ledger.unshift({id:'l'+Date.now(), borrower, amount:FUND.perLoan, date:d, due, repaid:false, guarantor});
      FUND.disbursed = FUND.ledger.reduce((s,x)=>s+(x.repaid?0:x.amount),0);
      closeModal();
      toast(`Đã ghi giải ngân ${money(FUND.perLoan)} cho ${borrower}.`);
      render();
    }
    return;
  }
});

/* ============================================================
   27. INIT
   ============================================================ */

/* Phiên hết hạn hoặc refresh token bị thu hồi: api.js gọi vào đây sau khi đã
   xoá token. Một chỗ duy nhất, nên không màn nào phải tự nhớ xử lý 401. */
api.onAuthLost(function(){
  stopRealtime();
  if(!state.me) return;                 // đang dùng tài khoản demo, không đụng
  try{ localStorage.removeItem('nc_member'); }catch(e){}
  state.me = null; state.user = null; state.route = 'landing';
  LIVE_INVITE_URL=''; LIVE_INVITE_NOTE='';
  state.relations=null; LIVE_NOTIFICATIONS=[]; resetLiveMessaging();
  resetDirectory(); closeModal(); render();
  toast('Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại.', true);
});

/* Khôi phục phiên bằng danh tính gắn trong token và hồ sơ thật. `nc_member` chỉ là
   cache hiển thị, tuyệt đối không còn là nguồn UUID vì nó có thể thuộc phiên cũ. */
async function restoreLiveSession(){
  try{
    const [identity,profile]=await Promise.all([api.get('/auth/me'),api.get('/members/me')]);
    if(!identity?.actor?.id || !profile?.id || identity.actor.id!==profile.id) throw new Error('SESSION_IDENTITY_MISMATCH');
    resetLiveMessaging(); LIVE_NOTIFICATIONS=[]; state.relations=null;
    state.me={...profile,...identity.actor,roles:identity.actor.roles||[]};
    try{ localStorage.setItem('nc_member',JSON.stringify(state.me)); }catch(e){}
    applyProfileToCurrentUser(profile);
    state.user=CURRENT_USER;
    state.role=state.me.roles.includes('approver')?'admin':'member';
    state.route=state.role==='admin'?'admin':'members';
    resetDirectory(); state.marketLoaded=false; LIVE_JOB_DETAILS={};
    render(); startRealtime(); loadMarketplace();
    if(state.route==='admin') loadJoinRequests();
  }catch(e){
    stopRealtime(); api.clearTokens();
    try{ localStorage.removeItem('nc_member'); }catch(err){}
    state.me=null; state.user=null; state.route='landing';
    resetLiveMessaging(); render();
  }
}
if(api.isLoggedIn()) restoreLiveSession();

render();
</script>
