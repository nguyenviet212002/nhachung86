/* Nhắn tin thật: backend chỉ có "tin nhắn theo từng người" (GET/POST /messages),
   KHÔNG có khái niệm "danh sách hội thoại" gộp sẵn (xem audit). GET /messages
   KHÔNG kèm with_member_id trả về TOÀN BỘ tin đã gửi/nhận của bạn (phẳng, cả
   hai chiều) kèm read_at từng tin — đủ để tự gộp thành danh sách hội thoại +
   đếm số tin chưa đọc mỗi người, không cần route riêng nào ở backend. */
function setConversationsFromMessages(rows){
  const byId = new Map();
  for(const r of rows){
    const me = DATA.me && DATA.me.id;
    const otherId = r.sender_id===me ? r.recipient_id : r.sender_id;
    let cv = byId.get(otherId);
    if(!cv){ cv={id:otherId, withId:otherId, unread:0, msgs:[]}; byId.set(otherId,cv); }
    cv.msgs.push({id:r.id, from:r.sender_id===me?'me':'them', text:r.body, time:fmtDate(r.created_at)});
    if(r.recipient_id===me && !r.read_at) cv.unread++;
  }
  // Mới nhất lên đầu — rows đã tới theo thứ tự thời gian tăng dần (xem service#listMessages).
  DATA.conversations = [...byId.values()].reverse();
  DATA.msgUnread = DATA.conversations.reduce((s,c)=>s+c.unread,0);
}
async function chatWith(memberId,text){
  // Backend /messages là tin nhắn GIỮA HAI NGƯỜI (recipient_id) — không có khái
  // niệm "ghi chú cho chính mình". Chặn ở đây làm chốt chặn cuối, phòng khi có
  // chỗ nào quên ẩn nút "Nhắn tin" lúc đang xem chính hồ sơ/tin của mình.
  if(DATA.me && memberId===DATA.me.id){ toast('Không thể tự nhắn tin cho chính mình','flag'); return; }
  let cv = DATA.conversations.find(c=>c.withId===memberId);
  if(!cv){ cv={id:memberId, withId:memberId, unread:0, msgs:[]}; DATA.conversations.unshift(cv); }
  CHAT_ACTIVE = cv.id;
  go('chat');
  try{
    const res = await api.get(`/messages?with_member_id=${memberId}`);
    const list = (res&&res.data)||[];
    cv.msgs = list.map(m=>({from: m.sender_id===memberId?'them':'me', text:m.body, time:fmtDate(m.created_at)}));
  }catch(e){ /* giữ nguyên khung rỗng nếu server chưa trả được, không chặn giao diện */ }
  // GET /messages?with_member_id=... vừa gọi đã đánh dấu đã đọc các tin của
  // người này ở server (xem service#listMessages) — đồng bộ lại số đếm cục bộ.
  if(cv.unread){ DATA.msgUnread = Math.max(0, DATA.msgUnread-cv.unread); cv.unread=0; }
  if(text){ cv.msgs.push({from:'me', text, time:'Vừa xong'}); try{ await api.post('/messages',{recipient_id:memberId, body:text}); }catch(e){} }
  render();
}
/* Gợi ý người làm việc — xếp hạng bằng dữ liệu thật đã có sẵn (DATA.members,
   DATA.skills), không phải máy học: +3 nếu có năng lực cùng danh mục với
   việc, +2 nếu cùng khu vực, +1 nếu đang "nhận việc"/"hẹn giờ" (không tạm
   dừng). Chỉ những việc CHƯA AI NHẬN (apps===0) mới có nút này — nên không
   cần loại người đã ứng tuyển, vì chưa ai ứng tuyển cả. "Mời" KHÔNG tự gán
   việc: nó chỉ gửi một tin nhắn thật (chatWith, POST /messages có sẵn) —
   người được mời vẫn phải tự bấm ứng tuyển nếu đồng ý. */
function suggestCandidates(job){
  return DATA.members
    .filter(m=>m.id!==job.poster && (!DATA.me || m.id!==DATA.me.id))
    .map(m=>{
      const hasSkill = job.cat && DATA.skills.some(s=>s.memberId===m.id && s.cat===job.cat);
      const sameWard = !!(job.ward && m.ward && job.ward===m.ward);
      let score = (hasSkill?3:0) + (sameWard?2:0) + (m.status!=='ban'?1:0);
      return { m, score, hasSkill, sameWard };
    })
    .filter(x=>x.score>0)
    .sort((a,b)=>b.score-a.score)
    .slice(0,8);
}

async function taoHoatDongSubmit(){
  const cat=getSuggestValue('hd'), title=getVal('hd-title'), date=getVal('hd-date'),
    desc=getVal('hd-desc'), capacity=Number(getVal('hd-capacity'))||0;
  const box=qs('#hd-err'), txt=qs('#hd-err-txt');
  const err=(m)=>{ if(box&&txt){txt.textContent=m;box.style.display='flex';} };
  if(!cat||!title||!date){ err('Điền loại hoạt động, tên và ngày trước đã'); return; }
  if(desc.length<20){ err('Mô tả hoạt động cần ít nhất 20 ký tự.'); return; }
  if(!capacity||capacity<1){ err('Nhập số người tối đa hợp lệ (từ 1 trở lên).'); return; }
  box&&(box.style.display='none');
  const btn=qs('#hd-submit'); if(btn){btn.disabled=true;btn.textContent='Đang tạo…';}
  try{
    const time = getVal('hd-time')||'00:00';
    const starts_at = new Date(`${date}T${time}:00`).toISOString();
    // Ảnh hoạt động không đi qua endpoint đính riêng như jobs: activities.image_url
    // là 1 chuỗi (URL đầy đủ hoặc "/files/<uuid>") ngay trong payload tạo/sửa —
    // xem ensureProjectImage() ở backend. Upload trước, ghép "/files/"+id, rồi mới tạo.
    let image_url = null;
    const uploaded = await uploadFile('hdanh');
    if(uploaded && uploaded.id) image_url = '/files/'+uploaded.id;
    // location là optional NHƯNG nếu có mặt phải ≥2 ký tự (min(2) trong schema) —
    // chuỗi rỗng không hợp lệ như null, phải bỏ hẳn field thay vì gửi ''.
    const payload = { title, description: desc, area_id:areaIdByName(getSuggestValue('hdarea')), category:cat,
      location:getVal('hd-place')||null, starts_at, capacity, status:'planned', image_url };
    const created = await api.post('/projects', payload);
    if(created) DATA.activities.unshift(mapActivity(created));
    closeModal(); toast('Đã tạo hoạt động','calendar'); go('hoatdong');
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent='Tạo';}
    err(e.message||'Có lỗi, thử lại.');
  }
}

      if(areaName) DATA.me.ward = areaName;

    <button class="btn btn-blue" id="bc-submit" style="flex:2" onclick="baoCaoSubmit('${(ds&&ds.subjectType)||''}','${(ds&&ds.subjectId)||''}')">Gửi báo cáo</button></div>`);
async function baoCaoSubmit(subjectType,subjectId){
  const body = getVal('bc-body');
  const errBox = qs('#bc-err'), errTxt = qs('#bc-err-txt');
  if(errBox) errBox.style.display='none';
  if(body.length<10){ if(errBox){errTxt.textContent='Viết ít nhất 10 ký tự mô tả vấn đề.'; errBox.style.display='flex';} return; }
  const btn=qs('#bc-submit'); if(btn){btn.disabled=true;btn.textContent='Đang gửi…';}
  try{
    const payload = {body};
    if(subjectType&&subjectId){ payload.subject_type=subjectType; payload.subject_id=subjectId; }
    await api.post('/complaints', payload);
    closeModal(); toast('Đã gửi báo cáo tới Ban điều hành','check');
  }catch(e){
    if(errBox){errTxt.textContent=e.message||'Có lỗi, thử lại.'; errBox.style.display='flex';}
  }finally{
    if(btn){btn.disabled=false;btn.textContent='Gửi báo cáo';}
  }
}

async function dangKySubmit(){
  const box=qs('#dk-err'), txt=qs('#dk-err-txt');
  const err=(m)=>{ if(box&&txt){txt.textContent=m;box.style.display='flex';} };
  const invite_token=getVal('dk-invite'), full_name=getVal('dk-name'), birth_year=getVal('dk-birth'),
    phone=getVal('dk-phone'), area=getSuggestValue('xa'), password=getVal('dk-pw'), password2=getVal('dk-pw2'),
    referrer_phone=getVal('dk-refphone'), agree=qs('#dk-agree').checked;
  if(!invite_token) return err('Cần nhập mã mời — xin từ người quen trong Nhà Chung.');
  if(!full_name||!phone||!birth_year||!area) return err('Điền đủ họ tên, năm sinh, số điện thoại, xã/phường.');
  const area_id = areaIdByName(area);
  if(!area_id) return err('Chọn đúng xã/phường trong danh sách gợi ý.');
  if(password.length<8) return err('Mật khẩu cần tối thiểu 8 ký tự.');
  if(password!==password2) return err('Hai lần nhập mật khẩu chưa khớp nhau.');
  if(!agree) return err('Cần đồng ý Điều lệ cộng đồng trước khi gửi.');
  box&&(box.style.display='none');
  const btn=qs('#dk-submit'); if(btn){btn.disabled=true;btn.textContent='Đang gửi…';}
  try{
    // Thật: POST /auth/register KHÔNG trả token/thành viên — nó tạo một
    // join_request 'pending' ({join_request_id, step}, xem auth/service.js#register).
    // Người mới chỉ đăng nhập được SAU KHI người bảo lãnh xác nhận đã gặp mặt
    // (POST /join-requests/:id/confirm-met) và Ban duyệt duyệt đơn — không có
    // nhánh đăng nhập ngay sau khi gửi form.
    await api.post('/auth/register', {
      phone, full_name, birth_year:Number(birth_year), area_id, invite_token, password, terms:true,
      referrer_phone: referrer_phone||undefined,
    });
    toast('Đã gửi đơn đăng ký — chờ người bảo lãnh xác nhận đã gặp mặt và Ban duyệt duyệt đơn','check');
    go('dangnhap');
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent='Gửi đăng ký';}
    err(e.message||'Có lỗi khi đăng ký, kiểm tra lại mã mời và thử lại.');
  }
}

/* Quyền riêng tư thật: GET/PATCH /members/me/privacy/:field, level thật là
   public/on_consent/closed (không phải 1 công tắc Zalo giả như bản cũ). */
const PRIVACY_FIELD_LABEL = {phone:'Số điện thoại', zalo:'Zalo', messenger:'Messenger', address:'Địa chỉ cụ thể', job:'Nghề nghiệp', area:'Khu vực', price:'Giá / công', family:'Gia đình'};
const PRIVACY_LEVEL_LABEL = {public:'Công khai', on_consent:'Cần đồng ý', closed:'Ẩn hẳn'};
let MY_PRIVACY = null;
async function ensureMyPrivacy(){
  if(MY_PRIVACY) return;
  try{ const res = await api.get('/members/me/privacy'); MY_PRIVACY = res.data||[]; render(); }
  catch(e){ MY_PRIVACY = []; }
}
async function setPrivacyLevel(field, level){
  try{
    await api.patch(`/members/me/privacy/${field}`, {level});
    const row = MY_PRIVACY && MY_PRIVACY.find(r=>r.field_key===field);
    if(row) row.level = level;
    toast('Đã lưu quyền riêng tư','check'); render();

   không dẫn đi đâu cả (xem notifClick()). */

  if(MY_CONTACT_REQUESTS) return;
  try{

    MY_CONTACT_REQUESTS = (res&&res.data)||[];
    render();

async function decideContact(id, status){

    toast(status==='approved'?'Đã đồng ý cho xem':'Đã từ chối','check');

  }catch(e){ toast(e.message||'Có lỗi, thử lại.','flag'); }
}

   Lý do gộp: một "tín hiệu" (câu hỏi/nhu cầu phát ra) và một "việc cần người"
   thực chất là CÙNG MỘT THỨ — một nhu cầu được đăng lên, cộng đồng thấy,
   phản hồi, rồi có kết quả. Khác biệt duy nhất là: việc có thợ/hợp tác đi
   kèm ứng tuyển-chọn người-trả công; còn "hỏi & tìm" là hỏi thông tin, không
   cần thuê ai. Nên gộp thành 1 trung tâm "Việc & hợp tác" với 3 loại, mỗi
   việc đều có hành trình tin cậy 7 bước hiển thị minh bạch, và thêm loại
   "Hỏi & tìm" cho các câu hỏi không phải thuê người — không mất chức năng gì
   của "Tín hiệu" cũ, chỉ gộp chung một chỗ để đỡ phải vào 2 khu riêng biệt. */
/* Hành trình tin cậy — dựng từ job.status + trạng thái ứng viên thật
   (jobDetail.applications[].status: contacted/agreed/working/done/failed) cho
   CẢ 3 loại tin (can-nguoi/hop-tac/hoi-tim, "hỏi-tìm" giờ backend đã nhận qua
   job_type='hoi_tim' — trả lời câu hỏi cũng đi qua applications như ứng tuyển
   việc). Không còn 7 bước đứng yên như bản cũ (mapJob() luôn trả step:null nên
   trước đây mọi việc hiện mãi "Bước 1/7"). */
const JOB_PROGRESS_STEPS = [
  {label:'Đăng tin'}, {label:'Đang nhận ứng tuyển'}, {label:'Có người ứng tuyển'},
  {label:'Đã chọn người, đang làm'}, {label:'Hoàn tất'},
];
function jobProgress(j, jobDetail){
  if(j.status==='cancelled') return {idx:-1, note:'Việc này đã bị huỷ.'};
  const apps = (jobDetail && jobDetail.applications) || [];
  const hasDone = j.status==='filled' || apps.some(a=>a.status==='done');
  if(hasDone) return {idx:4};
  if(apps.some(a=>a.status==='agreed'||a.status==='working')) return {idx:3};
  if(apps.length>0) return {idx:2};
  if(j.status==='closed') return {idx:-1, note:'Việc này đã đóng, không nhận ứng tuyển nữa.'};
  return {idx:1};
}
function jobProgressBar(idx){
  return `<div class="jflow-bar">${JOB_PROGRESS_STEPS.map((s,i)=>`<div class="jf-step ${i<idx?'done':i===idx?'on':''}"><div class="jf-n">${i<idx?ic('check',11):i+1}</div><div class="jf-t">${s.label}</div></div>`).join('')}</div>`;
}

async function tuChoiDonSubmit(id){
  const reason = getVal('tcd-reason'), note = getVal('tcd-note');

  const btn=qs('#tcd-submit'); if(btn){btn.disabled=true;btn.textContent='Đang gửi…';}
  try{
    await api.post(`/join-requests/${id}/reject`, {reason_code:reason, note});
    const jr = DATA.joinRequests.find(x=>x.id===id); if(jr) jr.status='rejected';

const COMPLAINT_SUBJECT_LABEL = {job:'Việc', aid:'Lời nhờ giúp', activity:'Hoạt động', capability:'Năng lực'};
const COMPLAINT_SUBJECT_GO = {job:'viec-detail', aid:'giupnhau-detail', activity:'hoatdong-detail', capability:'nangluc-detail'};

  if(c.subject_type) return `<a data-go="${COMPLAINT_SUBJECT_GO[c.subject_type]}:${c.subject_id}">${COMPLAINT_SUBJECT_LABEL[c.subject_type]}</a>`;
  return '<span class="t-muted">Báo cáo chung</span>';
}
const COMPLAINT_STATUS_LABEL = {open:'Chờ xử lý', reviewing:'Đang xem', resolved:'Đã xử lý', dismissed:'Đã bỏ qua'};
const COMPLAINT_STATUS_CLASS = {open:'pending', reviewing:'pending', resolved:'accepted', dismissed:'done'};
/* Gửi hàng loạt — backend chỉ có tin nhắn 1-1 (POST /messages, recipient_id
   bắt buộc), không có khái niệm "thông báo chung tới cả Hội" — nên "hàng
   loạt" ở đây là gửi THẬT cùng một nội dung thành N tin nhắn riêng, tuần tự
   (không Promise.all cả loạt — rateLimit của /messages là 60 req/phút, cộng
   đồng ~50 người thì tuần tự vẫn nằm dưới ngưỡng, song đồng thời N cuộc gọi
   dễ vượt nếu cộng đồng lớn hơn). */
async function guiThongBaoHangLoat(){
  const body = getVal('bcast-body');
  if(!body || body.trim().length<3){ toast('Nhập nội dung thông báo trước đã.','flag'); return; }
  const recipients = DATA.members.filter(m=>!DATA.me||m.id!==DATA.me.id);
  if(!recipients.length){ toast('Không có ai để gửi.','flag'); return; }
  if(!confirm(`Gửi thông báo này tới ${recipients.length} thành viên?`)) return;
  const btn = qs('#bcast-submit'); if(btn){btn.disabled=true;btn.textContent='Đang gửi…';}
  let ok=0, fail=0;
  for(const m of recipients){
    try{ await api.post('/messages',{recipient_id:m.id, body}); ok++; }
    catch(e){ fail++; }
  }
  if(btn){btn.disabled=false;btn.textContent='Gửi';}
  const ta = qs('#bcast-body'); if(ta) ta.value='';
  toast(fail?`Đã gửi ${ok}/${recipients.length}, ${fail} lỗi`:`Đã gửi thông báo tới ${ok} người`, fail?'flag':'check');
}
async function decideComplaint(id, status){
  try{
    await api.patch(`/complaints/${id}`, {status});
    const c = DATA.complaints.find(x=>x.id===id);
    if(c) c.status = status;
    toast('Đã cập nhật khiếu nại','check');
    render();

async function goRevokeRole(memberId, role){
  const row = DATA.rolesMatrix.find(r=>r.role===role);

  if(!confirm(`Gỡ vai ${REAL_ROLE_LABEL[role]} của ${m?m.full_name:'người này'}?`)) return;

    await api.del(`/ops/members/${memberId}/roles/${role}`);

/* ══════════════════════════════════════════════════════════════
   ENGINE CỜ TƯỚNG (Xiangqi) — hàm thuần, không đụng DOM, dễ kiểm thử riêng.
   Bàn cờ: board[r][c], r=0..9 (hàng), c=0..8 (cột). r=0 là hàng trên cùng (Đen),
   r=9 là hàng dưới cùng (Đỏ). Sông giữa r=4 và r=5.
   Quân: {side:'r'|'b', type:'general'|'advisor'|'elephant'|'horse'|'chariot'|'cannon'|'soldier'}
   ══════════════════════════════════════════════════════════════ */

function xqInitBoard(){
  const b = Array.from({length:10},()=>Array(9).fill(null));
  const back = ['chariot','horse','elephant','advisor','general','advisor','elephant','horse','chariot'];
  back.forEach((t,c)=>{ b[0][c]={side:'b',type:t}; b[9][c]={side:'r',type:t}; });
  b[2][1]={side:'b',type:'cannon'}; b[2][7]={side:'b',type:'cannon'};
  b[7][1]={side:'r',type:'cannon'}; b[7][7]={side:'r',type:'cannon'};
  [0,2,4,6,8].forEach(c=>{ b[3][c]={side:'b',type:'soldier'}; b[6][c]={side:'r',type:'soldier'}; });
  return b;
}
function xqClone(board){ return board.map(row=>row.map(p=>p?{...p}:null)); }
function xqOnBoard(r,c){ return r>=0&&r<10&&c>=0&&c<9; }
function xqOpp(side){ return side==='r'?'b':'r'; }

/* nước đi "thô" của 1 quân — chưa lọc theo luật chiếu tướng/lộ mặt tướng */
function xqRawMoves(board,r,c){
  const p = board[r][c];
  if(!p) return [];
  const side=p.side, opp=xqOpp(side), out=[];
  const add=(nr,nc)=>{ if(!xqOnBoard(nr,nc)) return; const t=board[nr][nc]; if(!t||t.side===opp) out.push({r:nr,c:nc}); };
  const palaceRows = side==='r' ? [7,8,9] : [0,1,2];
  const inPalace=(rr,cc)=> palaceRows.includes(rr) && cc>=3 && cc<=5;
  const ownSideRows = side==='r' ? [5,6,7,8,9] : [0,1,2,3,4];

  if(p.type==='general'){
    [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr,dc])=>{ const nr=r+dr,nc=c+dc; if(inPalace(nr,nc)) add(nr,nc); });
  }else if(p.type==='advisor'){
    [[-1,-1],[-1,1],[1,-1],[1,1]].forEach(([dr,dc])=>{ const nr=r+dr,nc=c+dc; if(inPalace(nr,nc)) add(nr,nc); });
  }else if(p.type==='elephant'){
    [[-2,-2],[-2,2],[2,-2],[2,2]].forEach(([dr,dc])=>{
      const nr=r+dr,nc=c+dc, er=r+dr/2, ec=c+dc/2;
      if(xqOnBoard(nr,nc) && ownSideRows.includes(nr) && !board[er][ec]) add(nr,nc);
    });
  }else if(p.type==='horse'){
    [[-1,0,-2,-1],[-1,0,-2,1],[1,0,2,-1],[1,0,2,1],[0,-1,-1,-2],[0,1,-1,2],[0,-1,1,-2],[0,1,1,2]]
    .forEach(([legR,legC,dr,dc])=>{
      if(xqOnBoard(r+legR,c+legC) && !board[r+legR][c+legC]) add(r+dr,c+dc);
    });
  }else if(p.type==='chariot'){
    [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr,dc])=>{
      let nr=r+dr,nc=c+dc;
      while(xqOnBoard(nr,nc)){
        const t=board[nr][nc];
        if(!t){ out.push({r:nr,c:nc}); } else { if(t.side===opp) out.push({r:nr,c:nc}); break; }
        nr+=dr; nc+=dc;
      }
    });
  }else if(p.type==='cannon'){
    [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr,dc])=>{
      let nr=r+dr,nc=c+dc, screen=false;
      while(xqOnBoard(nr,nc)){
        const t=board[nr][nc];
        if(!screen){
          if(!t) out.push({r:nr,c:nc}); else screen=true;
        }else{
          if(t){ if(t.side===opp) out.push({r:nr,c:nc}); break; }
        }
        nr+=dr; nc+=dc;
      }
    });
  }else if(p.type==='soldier'){
    const fwd = side==='r' ? -1 : 1;
    const crossed = side==='r' ? r<=4 : r>=5;
    add(r+fwd,c);
    if(crossed){ add(r,c-1); add(r,c+1); }
  }
  return out;
}

function xqFindGeneral(board,side){
  for(let r=0;r<10;r++) for(let c=0;c<9;c++){ const p=board[r][c]; if(p&&p.side===side&&p.type==='general') return {r,c}; }
  return null;
}
function xqSquareAttacked(board,r,c,bySide){
  for(let rr=0;rr<10;rr++) for(let cc=0;cc<9;cc++){
    const p=board[rr][cc];
    if(p && p.side===bySide){
      if(xqRawMoves(board,rr,cc).some(m=>m.r===r&&m.c===c)) return true;
    }
  }
  return false;
}
function xqFlyingGeneral(board){
  const gr = xqFindGeneral(board,'r'), gb = xqFindGeneral(board,'b');
  if(!gr||!gb||gr.c!==gb.c) return false;
  const c=gr.c;
  for(let r=Math.min(gr.r,gb.r)+1;r<Math.max(gr.r,gb.r);r++) if(board[r][c]) return false;
  return true; // cùng cột, không quân nào chắn -> lộ mặt tướng
}
function xqInCheck(board,side){
  const g = xqFindGeneral(board,side);
  if(!g) return true;
  return xqSquareAttacked(board,g.r,g.c,xqOpp(side));
}
/* nước đi HỢP LỆ của 1 quân — đã lọc: không được để tướng mình bị chiếu, không lộ mặt tướng */
function xqLegalMoves(board,r,c){
  const p=board[r][c]; if(!p) return [];
  return xqRawMoves(board,r,c).filter(m=>{
    const nb = xqClone(board);
    nb[m.r][m.c]=nb[r][c]; nb[r][c]=null;
    if(xqFlyingGeneral(nb)) return false;
    if(xqInCheck(nb,p.side)) return false;
    return true;
  });
}
function xqSideHasMoves(board,side){
  for(let r=0;r<10;r++) for(let c=0;c<9;c++){
    const p=board[r][c];
    if(p && p.side===side && xqLegalMoves(board,r,c).length) return true;
  }
  return false;
}
/* áp 1 nước đi, trả về {board, captured, checkOpp, gameOver, winner, reason} */
function xqApplyMove(board,from,to){
  const nb = xqClone(board);
  const mover = nb[from.r][from.c];
  const captured = nb[to.r][to.c];
  nb[to.r][to.c]=mover; nb[from.r][from.c]=null;
  const opp = xqOpp(mover.side);
  const checkOpp = xqInCheck(nb,opp);
  const oppHasMoves = xqSideHasMoves(nb,opp);
  let gameOver=false, winner=null, reason=null;
  if(captured && captured.type==='general'){ gameOver=true; winner=mover.side; reason='bat-tuong'; }
  else if(!oppHasMoves){ gameOver=true; winner=mover.side; reason= checkOpp?'chieu-bi':'het-nuoc-di'; }
  return {board:nb, captured, checkOpp, gameOver, winner, reason};
}

/* ══════════════════════════════════════════════════════════════
   xqAI — chọn nước đi cho máy. Hàm thuần, không đụng DOM, dùng lại
   move generator xq* ở trên. Chạy được cả ở main thread lẫn trong
   Web Worker (xem xqBuildWorker ở dưới) nên không được đụng DOM/window.
   ══════════════════════════════════════════════════════════════ */
const XQ_VALUE = {advisor:20, elephant:20, horse:40, cannon:45, chariot:90};
const XQ_LEVELS = { de:{depth:2, margin:80}, vua:{depth:3, margin:30}, kho:{depth:3, margin:5} };

function xqSoldierValue(r, side){ return (side==='r' ? r<=4 : r>=5) ? 20 : 10; }
function xqPieceValue(p, r){
  if(p.type==='soldier') return xqSoldierValue(r, p.side);
  if(p.type==='general') return 0;
  return XQ_VALUE[p.type];
}
function xqCountMoves(board, side){
  let n=0;
  for(let r=0;r<10;r++) for(let c=0;c<9;c++){
    const p=board[r][c];
    if(p && p.side===side) n += xqRawMoves(board,r,c).length;
  }
  return n;
}
/* + tốt cho Đỏ, - tốt cho Đen. */
function xqEvaluate(board){
  let score=0;
  for(let r=0;r<10;r++) for(let c=0;c<9;c++){
    const p=board[r][c]; if(!p) continue;
    const v=xqPieceValue(p,r);
    score += p.side==='r' ? v : -v;
  }
  score += xqCountMoves(board,'r') - xqCountMoves(board,'b');
  return score;
}
function xqAllMoves(board, side){
  const out=[];
  for(let r=0;r<10;r++) for(let c=0;c<9;c++){
    const p=board[r][c];
    if(p && p.side===side){
      xqLegalMoves(board,r,c).forEach(m=>out.push({from:{r,c}, to:{r:m.r,c:m.c}, captured:!!board[m.r][m.c]}));
    }
  }
  out.sort((a,b)=>(b.captured?1:0)-(a.captured?1:0));
  return out;
}
function xqMinimax(board, side, depth, alpha, beta){
  const moves = xqAllMoves(board, side);
  if(moves.length===0) return side==='r' ? -99000 : 99000;
  if(depth===0) return xqEvaluate(board);
  const maximizing = side==='r';
  let best = maximizing ? -Infinity : Infinity;
  for(const m of moves){
    const res = xqApplyMove(board, m.from, m.to);
    const val = res.gameOver
      ? (res.winner==='r' ? 99000 : -99000)
      : xqMinimax(res.board, xqOpp(side), depth-1, alpha, beta);
    if(maximizing){ if(val>best) best=val; if(val>alpha) alpha=val; }
    else{ if(val<best) best=val; if(val<beta) beta=val; }
    if(beta<=alpha) break;
  }
  return best;
}
/* Tính điểm mọi nước ở gốc cây, trả về các nước trong biên độ margin so với
   nước tốt nhất (đã sắp tốt dần), để bên gọi chọn ngẫu nhiên có trọng số. */
function xqBestMoves(board, side, level){
  const cfg = XQ_LEVELS[level] || XQ_LEVELS.vua;
  const moves = xqAllMoves(board, side);
  const maximizing = side==='r';
  const scored = moves.map(m=>{
    const res = xqApplyMove(board, m.from, m.to);
    const val = res.gameOver
      ? (res.winner===side ? 99000 : -99000)
      : xqMinimax(res.board, xqOpp(side), cfg.depth-1, -Infinity, Infinity);
    return {from:m.from, to:m.to, captured:m.captured, val};
  });
  scored.sort((a,b)=> maximizing ? b.val-a.val : a.val-b.val);
  const bestVal = scored[0].val;
  return scored.filter(m => Math.abs(m.val-bestVal) <= cfg.margin);
}
/* Trọng số giảm dần theo thứ hạng (hạng 0 trọng số cao nhất). */
function xqPickWeighted(list){
  const weights = list.map((_,i)=> list.length - i);
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for(let i=0;i<list.length;i++){ r-=weights[i]; if(r<=0) return list[i]; }
  return list[list.length-1];
}
function xqChooseMove(board, side, level){
  const m = xqPickWeighted(xqBestMoves(board, side, level));
  return {from:m.from, to:m.to};
}

/* Worker chạy xqChooseMove ngoài luồng chính để không đứng giao diện ở mức
   Khó. Không tách file .js riêng (dự án không có build step) — nạp mã worker
   bằng cách nối .toString() của đúng các hàm thuần cần thiết rồi tạo Blob. */
const XQ_WORKER_FNS = [xqClone, xqOnBoard, xqOpp, xqRawMoves, xqFindGeneral, xqSquareAttacked,
  xqFlyingGeneral, xqInCheck, xqLegalMoves, xqSideHasMoves, xqApplyMove,
  xqSoldierValue, xqPieceValue, xqCountMoves, xqEvaluate, xqAllMoves, xqMinimax, xqBestMoves, xqPickWeighted, xqChooseMove];
function xqBuildWorker(){
  const src = `const XQ_VALUE=${JSON.stringify(XQ_VALUE)};\nconst XQ_LEVELS=${JSON.stringify(XQ_LEVELS)};\n`
    + XQ_WORKER_FNS.map(fn=>fn.toString()).join('\n')
    + `\nself.onmessage=function(e){ const {board,side,level,id}=e.data; self.postMessage(Object.assign(xqChooseMove(board,side,level),{id})); };`;
  const blob = new Blob([src], {type:'application/javascript'});
  return new Worker(URL.createObjectURL(blob));
}
let XQ_WORKER = null;
function xqGetWorker(){ if(!XQ_WORKER) XQ_WORKER = xqBuildWorker(); return XQ_WORKER; }
function xqStopWorker(){ if(XQ_WORKER){ XQ_WORKER.terminate(); XQ_WORKER=null; } }

const XQ_THINK_MS = { de:[500,1500], vua:[800,2000], kho:[1000,2800] };
/* Trả nước đi của máy sau 1 khoảng "suy nghĩ" tự nhiên — thời gian chờ tối
   thiểu tính song song với lúc Worker tính toán, không cộng dồn nối tiếp. */
let XQ_REQ_ID = 0;
function xqRequestMove(board, side, level){
  const [lo,hi] = XQ_THINK_MS[level] || XQ_THINK_MS.vua;
  const extra = Math.min(xqAllMoves(board, side).length * 15, 900);
  const minDelay = lo + Math.random()*(hi-lo) + extra;
  const started = Date.now();
  const id = ++XQ_REQ_ID;
  return new Promise(resolve=>{
    let w;
    try{ w = xqGetWorker(); }
    catch(e){ resolve(xqChooseMove(board, side, level)); return; }
    const fallback = ()=>{ XQ_WORKER=null; resolve(xqChooseMove(board, side, level)); };
    w.onerror = fallback;
    w.onmessage = (e)=>{
      if(e.data.id !== id) return;
      const wait = Math.max(0, minDelay - (Date.now()-started));
      setTimeout(()=>resolve(e.data), wait);
    };
    w.postMessage({board, side, level, id});
  });
}

/* ══════════════════════════════════════════════════════════════
   V.cotuong — Cờ tướng giao lưu, chơi 2 người trên cùng máy (pass-and-play)
   Dùng engine thuần ở trên (xq*), chỉ lo phần vẽ + bắt sự kiện ở đây.
   ══════════════════════════════════════════════════════════════ */
const CHESS_CHAR = {
  r:{general:'帥',advisor:'仕',elephant:'相',horse:'傌',chariot:'俥',cannon:'炮',soldier:'兵'},
  b:{general:'將',advisor:'士',elephant:'象',horse:'馬',chariot:'車',cannon:'砲',soldier:'卒'},
};
let CHESS = { board:xqInitBoard(), turn:'r', selected:null, legal:[], over:false, winner:null, reason:null, lastMove:null };
/* Đổi bên = xoay góc nhìn bàn cờ 180° cho người ngồi phía Đen — không phải
   trạng thái ván cờ nên tách khỏi CHESS, "Ván mới" không xoá lại góc nhìn. */
let CHESS_FLIP = false;
function chessFlipBoard(){ CHESS_FLIP = !CHESS_FLIP; render(); }

function chessReset(){ CHESS = { board:xqInitBoard(), turn:'r', selected:null, legal:[], over:false, winner:null, reason:null, lastMove:null }; render(); }
function chessCellClick(r,c){
  if(CHESS.over) return;
  const p = CHESS.board[r][c];
  if(CHESS.selected){
    const isDest = CHESS.legal.some(m=>m.r===r&&m.c===c);
    if(isDest){
      const res = xqApplyMove(CHESS.board, CHESS.selected, {r,c});
      CHESS.lastMove = {from:CHESS.selected, to:{r,c}};
      CHESS.board = res.board;
      CHESS.turn = xqOpp(CHESS.board[r][c].side);
      CHESS.selected = null; CHESS.legal = [];
      if(res.gameOver){ CHESS.over=true; CHESS.winner=res.winner; CHESS.reason=res.reason; chessSound('end'); }
      else if(res.checkOpp){ CHESS.reason='chieu'; chessSound('check'); }
      else{ CHESS.reason=null; chessSound(res.captured?'capture':'place'); }
      render();
      return;
    }
    if(p && p.side===CHESS.board[CHESS.selected.r][CHESS.selected.c].side){
      CHESS.selected={r,c}; CHESS.legal=xqLegalMoves(CHESS.board,r,c); render(); return;
    }
    CHESS.selected=null; CHESS.legal=[]; render(); return;
  }
  if(p && p.side===CHESS.turn){ CHESS.selected={r,c}; CHESS.legal=xqLegalMoves(CHESS.board,r,c); render(); }
}

function chessGridSvg(){
  const U=40, W=8*U, H=9*U;
  let lines='';
  for(let r=0;r<10;r++) lines+=`<line x1="0" y1="${r*U}" x2="${W}" y2="${r*U}" stroke="#7a5326" stroke-width="1.2"/>`;
  lines+=`<line x1="0" y1="0" x2="0" y2="${H}" stroke="#7a5326" stroke-width="1.2"/>`;
  lines+=`<line x1="${W}" y1="0" x2="${W}" y2="${H}" stroke="#7a5326" stroke-width="1.2"/>`;
  for(let c=1;c<8;c++){
    lines+=`<line x1="${c*U}" y1="0" x2="${c*U}" y2="${4*U}" stroke="#7a5326" stroke-width="1.2"/>`;
    lines+=`<line x1="${c*U}" y1="${5*U}" x2="${c*U}" y2="${H}" stroke="#7a5326" stroke-width="1.2"/>`;
  }
  lines+=`<line x1="${3*U}" y1="0" x2="${5*U}" y2="${2*U}" stroke="#7a5326" stroke-width="1.2"/>`;
  lines+=`<line x1="${5*U}" y1="0" x2="${3*U}" y2="${2*U}" stroke="#7a5326" stroke-width="1.2"/>`;
  lines+=`<line x1="${3*U}" y1="${7*U}" x2="${5*U}" y2="${9*U}" stroke="#7a5326" stroke-width="1.2"/>`;
  lines+=`<line x1="${5*U}" y1="${7*U}" x2="${3*U}" y2="${9*U}" stroke="#7a5326" stroke-width="1.2"/>`;
  return `<svg class="xq-lines" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${lines}</svg>`;
}

/* Vẽ 1 bàn cờ hoàn chỉnh (lưới + sông + toàn bộ 90 điểm) — dùng chung cho
   mọi màn cờ tướng chạy phía client (cotuong, cotuong-may, cotuong-the).
   opts.onCellClick là TÊN hàm global (chuỗi), theo đúng quy ước onclick=""
   nội tuyến đã dùng khắp file này — không truyền function reference. */
function chessBoardHtml(board, opts){
  opts = opts || {};
  const selected = opts.selected || null, legal = opts.legal || [], lastMove = opts.lastMove || null;
  const flip = !!opts.flip, disabled = !!opts.disabled, onCellClick = opts.onCellClick || null;
  const justMovedTo = opts.justMovedTo || null;
  const pts = [];
  for(let r=0;r<10;r++) for(let c=0;c<9;c++){
    const p = board[r][c];
    const isSel = selected && selected.r===r && selected.c===c;
    const isDest = legal.some(m=>m.r===r&&m.c===c);
    const isLast = lastMove && ((lastMove.from.r===r&&lastMove.from.c===c)||(lastMove.to.r===r&&lastMove.to.c===c));
    const isJustMoved = justMovedTo && justMovedTo.r===r && justMovedTo.c===c;
    const dr = flip?9-r:r, dc = flip?8-c:c;
    const leftFrac = dc/8, topFrac = dr/9;
    let inner = '';
    if(p) inner = `<div class="xq-pc ${p.side==='r'?'red':'black'} ${isSel?'sel':''} ${isJustMoved?'moved':''}">${CHESS_CHAR[p.side][p.type]}</div>`;
    else if(isDest) inner = `<div class="xq-dot"></div>`;
    const clickAttr = onCellClick ? ` onclick="${onCellClick}(${r},${c})"` : '';
    const disabledAttr = disabled ? ' disabled' : '';
    pts.push(`<button type="button" class="xq-pt ${isDest&&p?'cap':''} ${isLast?'last':''}" style="left:calc(var(--xq-pad) + (100% - var(--xq-pad)*2) * ${leftFrac});top:calc(var(--xq-pad) + (100% - var(--xq-pad)*2) * ${topFrac})"${clickAttr}${disabledAttr}>${inner}</button>`);
  }
  return `<div class="xq-wrap"><div class="xq-board">${chessGridSvg()}<div class="xq-river">楚 河　　漢 界</div>${pts.join('')}</div></div>`;
}

/* Banner thông báo nổi bật (chiếu tướng / thắng-thua / giải thành công) cho
   các màn cờ full màn hình — xem CSS .xq-announce. tone: 'win'|'lose'|''.
   fade=true (mặc định false) tự mờ dần sau ~2s, dùng cho "Chiếu tướng!"
   giữa ván (ván chưa xong, không nên che bàn cờ mãi). */
function xqAnnounceHtml(text, tone, fade){
  const spans = [...text].map((ch,i)=>`<span style="animation-delay:${(i*0.05).toFixed(2)}s">${ch===' '?'&nbsp;':ch}</span>`).join('');
  return `<div class="xq-announce ${tone||''} ${fade?'fade':''}">${spans}</div>`;
}

/* ══════════════════════════════════════════════════════════════
   V['cotuong-van'] — một ván cờ online cụ thể: chơi (nếu là 1 trong 2
   người) hoặc xem trực tiếp (mọi thành viên khác). Nguồn sự thật LUÔN LÀ
   SERVER — click chỉ gọi POST /moves, bàn cờ chỉ đổi khi sự kiện 'move' từ
   chính SSE của mình quay lại (xem spec mục 4, tránh lệch bàn cờ nếu server
   từ chối nước đi).
   ══════════════════════════════════════════════════════════════ */
let GAME_STATE = null, GAME_STATE_ID = null, GAME_EVENTSOURCE = null;
let GAME_SELECTED = null, GAME_LEGAL = [];
let GAME_STREAM_RETRIES = 0;

function stopGameStream(){
  if(GAME_EVENTSOURCE){ GAME_EVENTSOURCE.close(); GAME_EVENTSOURCE=null; }
  GAME_STATE=null; GAME_STATE_ID=null; GAME_SELECTED=null; GAME_LEGAL=[];
  GAME_STREAM_RETRIES=0;
  GAMES_LIST=null;
}
function connectGameStream(id){
  if(GAME_EVENTSOURCE) GAME_EVENTSOURCE.close();
  const token = api.accessToken(); if(!token) return;
  GAME_EVENTSOURCE = new EventSource(api.baseUrl()+'/games/'+id+'/stream?access_token='+encodeURIComponent(token));
  GAME_EVENTSOURCE.addEventListener('ready', ()=>{ GAME_STREAM_RETRIES=0; });
  GAME_EVENTSOURCE.addEventListener('game_start', e=>{
    const d = JSON.parse(e.data);
    if(GAME_STATE){ GAME_STATE.board=d.board; GAME_STATE.turn=d.turn; GAME_STATE.status='active'; }
    render();
  });
  GAME_EVENTSOURCE.addEventListener('move', e=>{
    const d = JSON.parse(e.data);
    if(GAME_STATE){ GAME_STATE.board=d.board; GAME_STATE.turn=d.turn; GAME_STATE.last_move=d.last_move; }
    GAME_SELECTED=null; GAME_LEGAL=[];
    chessSound(d.captured?'capture':'place');
    render();
  });
  GAME_EVENTSOURCE.addEventListener('game_end', e=>{
    const d = JSON.parse(e.data);
    if(GAME_STATE){
      GAME_STATE.status='finished'; GAME_STATE.end_reason=d.reason;
      GAME_STATE.winner_member_id = d.winner ? (d.winner==='r'?GAME_STATE.red_member_id:GAME_STATE.black_member_id) : null;
    }
    chessSound('end');
    render();
  });
  GAME_EVENTSOURCE.onerror = ()=>{
    if(GAME_EVENTSOURCE){ GAME_EVENTSOURCE.close(); GAME_EVENTSOURCE=null; }
    if(GAME_STATE_ID!==id) return; // đã điều hướng đi chỗ khác, không cần nối lại
    GAME_STREAM_RETRIES++;
    if(GAME_STREAM_RETRIES>5){
      toast('Mất kết nối trực tiếp với ván cờ, hãy tải lại trang.','x');
      return;
    }
    setTimeout(()=>{
      if(GAME_STATE_ID!==id) return;
      api.get('/auth/me').catch(()=>{}).then(()=>{
        if(GAME_STATE_ID!==id) return;
        connectGameStream(id);
      });
    }, 1500);
  };
}
function loadGame(id){
  GAME_STATE = null; GAME_STATE_ID = id; GAME_SELECTED=null; GAME_LEGAL=[];
  api.get('/games/'+id).then(g=>{
    if(GAME_STATE_ID!==id) return; // đã điều hướng đi chỗ khác trong lúc chờ
    GAME_STATE=g; connectGameStream(id); render();
  }).catch(e=>{
    if(GAME_STATE_ID!==id) return;
    GAME_STATE={error:e.message||'Không tải được ván cờ.'}; render();
  });
}
function gameCellClick(r,c){
  if(!GAME_STATE || GAME_STATE.error || GAME_STATE.status!=='active') return;
  const mySide = GAME_STATE.red_member_id===DATA.me.id ? 'r' : GAME_STATE.black_member_id===DATA.me.id ? 'b' : null;
  if(!mySide || mySide!==GAME_STATE.turn) return; // xem hoặc chưa tới lượt: bàn chỉ đọc
  const p = GAME_STATE.board[r][c];
  if(GAME_SELECTED){
    const isDest = GAME_LEGAL.some(m=>m.r===r&&m.c===c);
    if(isDest){
      const from=GAME_SELECTED, to={r,c};
      const gid = GAME_STATE.id;
      GAME_SELECTED=null; GAME_LEGAL=[];
      api.post('/games/'+gid+'/moves', {from,to}).then(g=>{
        if(GAME_STATE_ID===gid && GAME_STATE){ GAME_STATE.board=g.board; GAME_STATE.turn=g.turn; GAME_STATE.status=g.status; render(); }
      }).catch(e=>{
        toast(e.message||'Nước đi không hợp lệ.','x'); loadGame(GAME_STATE.id);
      });
      render();
      return;
    }
    if(p && p.side===mySide){ GAME_SELECTED={r,c}; GAME_LEGAL=xqLegalMoves(GAME_STATE.board,r,c); render(); return; }
    GAME_SELECTED=null; GAME_LEGAL=[]; render(); return;
  }
  if(p && p.side===mySide){ GAME_SELECTED={r,c}; GAME_LEGAL=xqLegalMoves(GAME_STATE.board,r,c); render(); }
}
function resignGame(id){
  if(!confirm('Xin thua ván này?')) return;
  api.post('/games/'+id+'/resign').catch(e=>toast(e.message||'Có lỗi, thử lại.','x'));
}

V['cotuong-van'] = (params)=>{
  const id = params[0];
  if(!id) return `<div class="empty" style="margin-top:15vh"><h3>Không tìm thấy ván cờ</h3></div>`;
  if(GAME_STATE_ID!==id){ loadGame(id);
    return `<p style="padding-top:15vh;text-align:center;color:var(--muted)">Đang tải ván cờ…</p>`; }

  const st = GAME_STATE;

  const isMyTurn = mySide && mySide===st.turn && st.status==='active';

        </div>` : `<p style="font-size:14.5px;color:var(--muted)">Đang chờ ${esc(st.black_name)} trả lời lời thách đấu.</p>`}
      </div>`;
  }
  if(st.status==='finished' && !st.board){
    return `<div class="xq-fs-card" style="text-align:center">
      <h1>${esc(st.red_name)} <span style="color:var(--muted);font-weight:400">vs</span> ${esc(st.black_name)}</h1>
      <p style="margin-top:10px">Lời thách đấu đã bị từ chối</p>

    </div>`;
  }
  const pts=[];
  for(let r=0;r<10;r++) for(let c=0;c<9;c++){
    const p = st.board[r][c];
    const isSel = GAME_SELECTED && GAME_SELECTED.r===r && GAME_SELECTED.c===c;
    const isDest = GAME_LEGAL.some(m=>m.r===r&&m.c===c);
    const isLast = st.last_move && ((st.last_move.from.r===r&&st.last_move.from.c===c)||(st.last_move.to.r===r&&st.last_move.to.c===c));
    const dr=CHESS_FLIP?9-r:r, dc=CHESS_FLIP?8-c:c;
    const leftFrac=dc/8, topFrac=dr/9;
    let inner='';
    if(p) inner = `<div class="xq-pc ${p.side==='r'?'red':'black'} ${isSel?'sel':''}">${CHESS_CHAR[p.side][p.type]}</div>`;
    else if(isDest) inner = `<div class="xq-dot"></div>`;
    pts.push(`<button type="button" class="xq-pt ${isDest&&p?'cap':''} ${isLast?'last':''}" style="left:calc(var(--xq-pad) + (100% - var(--xq-pad)*2) * ${leftFrac});top:calc(var(--xq-pad) + (100% - var(--xq-pad)*2) * ${topFrac})" onclick="gameCellClick(${r},${c})" ${isMyTurn?'':'disabled'}>${inner}</button>`);
  }
  const turnTxt = st.turn==='r' ? 'Đỏ đi' : 'Đen đi';

/* ══════════════════════════════════════════════════════════════
   V['cotuong-may'] — chơi với máy (AI). Dùng chung 2 hàm chessVsAi* với
   V['cotuong-the'] (cờ thế, Task 7) — cả 2 chỉ khác nhau ở CÁCH nạp state
   ban đầu, không khác ở cách áp nước đi.
   ══════════════════════════════════════════════════════════════ */
let CHESS_AI = null; // null = đang ở màn chọn bên/cấp độ, chưa vào ván
let CHESS_AI_SETUP = { side:'r', level:'vua' };

/* Áp 1 nước đi của NGƯỜI vào state, vẽ lại, rồi gọi tiếp onPlayerMoved (thường
   là để kích máy đi nếu chưa xong ván). */
function chessVsAiPlayMove(state, from, to, onPlayerMoved){
  const res = xqApplyMove(state.board, from, to);
  state.lastMove = {from, to};
  state.justMoved = null;
  state.board = res.board;
  state.turn = xqOpp(state.board[to.r][to.c].side);
  state.selected = null; state.legal = [];
  if(res.gameOver){ state.over=true; state.winner=res.winner; state.reason=res.reason; chessSound('end'); }
  else if(res.checkOpp){ state.reason='chieu'; chessSound('check'); }
  else{ state.reason=null; chessSound(res.captured?'capture':'place'); }
  render();
  if(onPlayerMoved) onPlayerMoved();
}
function chessVsAiCellClick(state, r, c, onPlayerMoved){
  if(!state || state.over || state.thinking) return;
  if(state.turn !== state.playerSide) return;
  state.justMoved = null;
  const p = state.board[r][c];
  if(state.selected){
    const isDest = state.legal.some(m=>m.r===r&&m.c===c);
    if(isDest){ chessVsAiPlayMove(state, state.selected, {r,c}, onPlayerMoved); return; }
    if(p && p.side===state.board[state.selected.r][state.selected.c].side){
      state.selected={r,c}; state.legal=xqLegalMoves(state.board,r,c); render(); return;
    }
    state.selected=null; state.legal=[]; render(); return;
  }
  if(p && p.side===state.turn){ state.selected={r,c}; state.legal=xqLegalMoves(state.board,r,c); render(); }
}
/* isStillCurrent: hàm kiểm tra "ván này còn là ván đang hiện trên màn không"
   — bắt buộc so bằng ĐỊNH DANH object (===), không so bằng biến global, để
   không áp nhầm nước máy vừa tính xong cho 1 ván đã bị "Ván mới"/đổi thế cờ
   ghi đè trong lúc Worker còn đang chạy. */
function chessVsAiMaybeMove(state, isStillCurrent){
  if(!state || state.over) return;
  if(state.turn === state.playerSide) return;
  state.thinking = true; render();
  xqRequestMove(state.board, state.turn, state.level).then(move=>{
    if(!isStillCurrent()) return;
    const res = xqApplyMove(state.board, move.from, move.to);
    state.lastMove = {from:move.from, to:move.to};
    state.justMoved = move.to;
    state.board = res.board;
    state.turn = xqOpp(state.board[move.to.r][move.to.c].side);
    state.thinking = false;
    if(res.gameOver){ state.over=true; state.winner=res.winner; state.reason=res.reason; chessSound('end'); }
    else if(res.checkOpp){ state.reason='chieu'; chessSound('check'); }
    else{ state.reason=null; chessSound(res.captured?'capture':'place'); }
    render();
  });
}

function chessAiSetSide(side){ CHESS_AI_SETUP.side = side; render(); }
function chessAiSetLevel(level){ CHESS_AI_SETUP.level = level; render(); }
function chessAiStart(){
  CHESS_AI = { board:xqInitBoard(), turn:'r', selected:null, legal:[], over:false, winner:null, reason:null,
    lastMove:null, justMoved:null, thinking:false, playerSide:CHESS_AI_SETUP.side, level:CHESS_AI_SETUP.level };
  render();
  const captured = CHESS_AI;
  chessVsAiMaybeMove(captured, ()=> CHESS_AI === captured);
}
function chessAiBackToSetup(){ xqStopWorker(); CHESS_AI = null; render(); }
function chessAiReset(){ xqStopWorker(); chessAiStart(); }
function chessAiCellClick(r,c){
  chessVsAiCellClick(CHESS_AI, r, c, ()=>{
    const captured = CHESS_AI;
    chessVsAiMaybeMove(captured, ()=> CHESS_AI === captured);
  });
}

/* ══════════════════════════════════════════════════════════════
   V['cotuong-the'] — cờ thế: chọn 1 thế có sẵn theo độ khó, chơi tiếp với
   AI (dùng lại chessVsAi* ở Task 5) tới khi chiếu bí hoặc bị chiếu bí.
   ══════════════════════════════════════════════════════════════ */
let CHESS_THE_LEVEL = 'de';
let CHESS_THE_IDX = 0;
let CHESS_THE = null;

function coTheList(level){ return CO_THE.filter(p=>p.level===level); }
function chessTheBuild(level, idx){
  const list = coTheList(level);
  if(!list.length) return null;
  const i = ((idx % list.length) + list.length) % list.length;
  const puz = list[i];
  return { board:xqClone(puz.board), turn:puz.playerSide, selected:null, legal:[], over:false, winner:null, reason:null,
    lastMove:null, justMoved:null, thinking:false, playerSide:puz.playerSide, level:puz.level,
    puzzleId:puz.id, idx:i, total:list.length };
}
function chessTheEnsureLoaded(){
  if(!CHESS_THE) CHESS_THE = chessTheBuild(CHESS_THE_LEVEL, CHESS_THE_IDX);
}
function chessTheSetLevel(level){ xqStopWorker(); CHESS_THE_LEVEL=level; CHESS_THE_IDX=0; CHESS_THE=chessTheBuild(level,0); render(); }
function chessThePrev(){ xqStopWorker(); CHESS_THE=chessTheBuild(CHESS_THE_LEVEL, CHESS_THE_IDX-1); if(CHESS_THE) CHESS_THE_IDX=CHESS_THE.idx; render(); }
function chessTheNext(){ xqStopWorker(); CHESS_THE=chessTheBuild(CHESS_THE_LEVEL, CHESS_THE_IDX+1); if(CHESS_THE) CHESS_THE_IDX=CHESS_THE.idx; render(); }
function chessTheRetry(){ xqStopWorker(); CHESS_THE=chessTheBuild(CHESS_THE_LEVEL, CHESS_THE_IDX); render(); }
function chessTheCellClick(r,c){
  chessVsAiCellClick(CHESS_THE, r, c, ()=>{
    const captured = CHESS_THE;
    chessVsAiMaybeMove(captured, ()=> CHESS_THE === captured);
  });
}

V['cotuong-the'] = ()=>{
  chessTheEnsureLoaded();
  const levelDefs = [['de','Thế Dễ'],['vua','Thế Vừa'],['kho','Thế Khó']];
  const tabs = levelDefs.map(([lv,label])=>
    `<button class="btn ${CHESS_THE_LEVEL===lv?'btn-blue':'btn-out'} btn-sm" onclick="chessTheSetLevel('${lv}')">${label}</button>`
  ).join('');
  if(!CHESS_THE){
    return `<div class="xq-fs-card">
      <h1>Cờ thế</h1>
      <div class="xq-ctrl-row" style="margin-top:12px">${tabs}</div>
      <div class="empty" style="margin-top:14px"><h3>Chưa có thế cờ nào ở mức này</h3></div>
    </div>`;
  }
  const st = CHESS_THE;
  const flip = st.playerSide==='b';
  const turnTxt = st.turn===st.playerSide ? 'Tới lượt bạn' : 'Đối thủ đang đi...';
  const reasonTxt = {chieu:'Chiếu tướng!', ['chieu-bi']:'Chiếu bí — hết cờ!', ['het-nuoc-di']:'Hết nước đi!', ['bat-tuong']:'Bắt được tướng!'}[st.reason]||'';
  const solved = st.over && st.winner===st.playerSide;
  const failed = st.over && st.winner!==st.playerSide;
  const statusCls = st.over ? (solved?'win':'lose') : '';
  const statusLabel = st.over ? (solved?'Giải thành công!':'Chưa xong, thử lại thế này') : turnTxt;
  const announce = st.over
    ? xqAnnounceHtml(solved?'Giải thành công!':'Chưa xong!', solved?'win':'lose')
    : (reasonTxt ? xqAnnounceHtml(reasonTxt, '', true) : '');
  const solvedBar = solved ? `<div class="xq-solved-bar">
    <button class="btn btn-blue" onclick="chessTheNext()">Thế tiếp theo ${ic('chev',15)}</button>
    <a href="#cotuong-online" data-go="cotuong-online" class="btn btn-out">Quay lại</a>
  </div>` : '';
  return `
  <div class="xq-status-bar ${statusCls}">${statusLabel}</div>
  ${announce}
  ${chessBoardHtml(st.board, {selected:st.selected, legal:st.legal, lastMove:st.lastMove, flip, onCellClick:'chessTheCellClick', disabled: st.over||st.thinking||st.turn!==st.playerSide, justMovedTo:st.justMoved})}
  ${solvedBar}
  <div class="xq-fs-panel${XQ_FS_MENU_OPEN?` show`:``}">
    <h1>Cờ thế</h1>
    <p style="font-size:13px;color:var(--muted);margin-bottom:12px">Bạn cầm bên ${st.playerSide==='r'?'Đỏ':'Đen'} · Thế ${st.idx+1}/${st.total}</p>
    <div class="xq-ctrl-row">${tabs}</div>
    <div class="xq-ctrl-row" style="margin-top:14px">
      <button class="btn btn-out" style="flex:1" onclick="chessThePrev()">← Thế trước</button>
      <button class="btn btn-out" style="flex:1" onclick="chessTheNext()">Thế sau →</button>
    </div>
    <button class="btn btn-out btn-full" style="margin-top:8px" onclick="chessTheRetry()">${ic('refresh',15)} Chơi lại thế này</button>
  </div>`;
};

/* ══════════════════════════════════════════════════════════════
   V.chat — Tin nhắn (2 cột: danh sách hội thoại + khung chat)
   ══════════════════════════════════════════════════════════════ */
let CHAT_ACTIVE = null;
function chatOpen(id){ chatWith(id); }
function chatShowList(){ const s=qs('.chat-shell'); if(s) s.classList.remove('show-chat'); }
async function chatSend(){
  const inp = qs('#chatInput'); if(!inp||!inp.value.trim()||!CHAT_ACTIVE) return;
  const text = inp.value.trim(); inp.value='';
  const cv = DATA.conversations.find(c=>c.id===CHAT_ACTIVE);
  if(cv) cv.msgs.push({from:'me', text, time:'Vừa xong'});
  render();
  try{ await api.post('/messages', {recipient_id:CHAT_ACTIVE, body:text}); }catch(e){}
  setTimeout(()=>{const b=qs('.chat-body'); if(b) b.scrollTop=b.scrollHeight; const i=qs('#chatInput'); if(i) i.focus();},0);
}
function chatConvItemsHtml(){
  const q = (STATE.chat.q||'').trim().toLowerCase();
  const list = DATA.conversations.filter(c=>{
    const cm=member(c.withId); const last=c.msgs[c.msgs.length-1];
    return matchKw(q, cm.name, last?last.text:'');
  });
  return list.map(c=>{const cm=member(c.withId); const last=c.msgs[c.msgs.length-1];
    return `<div class="conv-item ${c.id===CHAT_ACTIVE?'on':''}" onclick="chatOpen('${c.id}')">
      <div class="av">${initials(cm.name)}</div>
      <div class="conv-main"><div class="conv-top"><span class="conv-nm">${cm.name}</span><span class="conv-tm">${last?last.time:''}</span></div><div class="conv-last">${last?esc(last.text):'Chưa có tin nhắn'}</div></div>
      ${c.unread?`<span class="conv-unread">${c.unread}</span>`:''}
    </div>`;}).join('') || '<p style="text-align:center;color:var(--muted);font-size:13px;padding:16px">Không tìm thấy hội thoại phù hợp.</p>';
}
function chatSearchInput(el){ STATE.chat.q=el.value; const box=qs('#chat-conv-items'); if(box) box.innerHTML=chatConvItemsHtml(); }
V.chat = ()=>{
  if(!DATA.conversations.length){
    return `
    <div class="page-head"><div><h1>Tin nhắn</h1><p>Trao đổi nhanh trong Nhà Chung — việc quan trọng vẫn nên gọi điện hoặc hẹn Zalo.</p></div></div>
    <div class="empty"><div class="ic">${ic('mail',24)}</div><h3>Chưa có hội thoại nào</h3>
      <p>Bấm "Nhắn tin" hoặc "Xin liên hệ" ở hồ sơ ai đó để bắt đầu trò chuyện.</p>
      <a class="btn btn-blue" data-go="congnguoi">${ic('users',15)} Xem Con người</a></div>`;
  }
  const cv = DATA.conversations.find(c=>c.id===CHAT_ACTIVE) || DATA.conversations[0];
  CHAT_ACTIVE = cv.id;
  const m = member(cv.withId);
  return `
  <div class="page-head"><div><h1>Tin nhắn</h1><p>Trao đổi nhanh trong Nhà Chung — việc quan trọng vẫn nên gọi điện hoặc hẹn Zalo.</p></div></div>
  <div class="chat-shell">
    <aside class="conv-list">
      <div class="conv-search"><input value="${esc(STATE.chat.q||'')}" placeholder="Tìm hội thoại…" oninput="chatSearchInput(this)"></div>
      <div id="chat-conv-items">${chatConvItemsHtml()}</div>
    </aside>
    <section class="chat-main">
      <div class="chat-head">
        <button class="chat-back" onclick="chatShowList()">${ic('chev',15)}</button>
        <div class="av">${initials(m.name)}</div>
        <div><div class="nm">${m.name}</div><div class="st">● Thành viên Nhà Chung</div></div>
      </div>
      <div class="chat-body">${cv.msgs.length?cv.msgs.map(x=>`<div class="msg ${x.from}">${esc(x.text)}<span class="msg-time">${x.time}</span></div>`).join(''):'<p style="text-align:center;color:var(--muted);font-size:13px;padding:20px">Chưa có tin nhắn — gõ lời chào bên dưới nhé.</p>'}</div>
      <div class="composer">
        <input id="chatInput" placeholder="Nhập tin nhắn…" onkeydown="if(event.key==='Enter')chatSend()">
        <button class="send" onclick="chatSend()">${ic('send',17)}</button>
      </div>
    </section>
  </div>`;
};

</script>
</body>
</html>
