<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Nhà Chung 86 — Hội Đồng Niên Bính Dần 1986</title>
<meta name="description" content="Chợ việc và tương trợ cộng đồng cho 52 anh chị em Bính Dần 1986, Hưng Yên.">
<link rel="icon" type="image/png" href="assets/logo/logo2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════
   NHÀ CHUNG 86 — hệ thiết kế v3
   Dựng theo đúng khuôn mẫu GigViet: header ngang dính đỉnh, KHÔNG sidebar,
   thẻ việc dạng hàng ngang, lưới thống kê, tab+bảng cho khu quản trị.
   Màu: giữ xanh lá đậm + trắng đã chốt (thay cho --blue của mẫu gốc).
   ══════════════════════════════════════════════════════════ */
:root{
  --brand:#0E6B4F; --brand-d:#0A5540; --brand-l:#EAF5F0; --brand-vl:#F2F9F6;
  --ink:#1e293b; --ink2:#64748b; --muted:#94a3b8;
  --line:#e5e7eb; --line2:#f1f5f9;
  --bg:#fff; --bg2:#f9fafb; --bg3:#f8fafc;
  --dark:#0F241D;
  --green:#16a34a; --green-l:#ecfdf5;
  --amber:#f59e0b; --amber-l:#fffbeb;
  --red:#ef4444; --red-l:#fef2f2;
  --icon:#64748b;
  --r:8px; --r2:14px;
  --font:'Be Vietnam Pro',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
h1,h2,h3,h4,p,.title,.tl-role,.mj-t{overflow-wrap:anywhere;word-break:break-word}
html{scroll-behavior:smooth}
body{font-family:var(--font);color:var(--ink);background:var(--bg2);line-height:1.62;-webkit-font-smoothing:antialiased;font-size:16px;min-height:100vh;letter-spacing:.1px}
#root{display:flex;flex-direction:column;min-height:100vh}
#root main{flex:1}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}
button{font-family:var(--font);cursor:pointer;border:none;background:none}
ul{list-style:none}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}

/* ===== Nút ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:var(--r);font-weight:700;font-size:15px;padding:13px 23px;transition:.15s;white-space:nowrap}
.btn-blue,.btn-brand{background:var(--brand);color:#fff}
.btn-blue:hover,.btn-brand:hover{background:var(--brand-d)}
.btn-out{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn-out:hover{border-color:var(--brand);color:var(--brand)}
.btn-green{background:#fff;color:var(--green);border:1.5px solid var(--green)}
.btn-red{background:#fff;color:var(--red);border:1.5px solid #fecaca}
.btn-sm{padding:9px 16px;font-size:14.5px}
.btn-lg{padding:14px 28px;font-size:16px}
.btn-block{width:100%}
.btn svg{width:15px;height:15px;flex:none}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ===== TopBar (thanh mảnh trên cùng) ===== */
.topbar{background:var(--dark);color:#cbd5e1;font-size:14px}
.topbar .wrap{display:flex;justify-content:space-between;align-items:center;height:34px}
.topbar .l{display:flex;gap:18px}
.topbar .l span{display:flex;align-items:center;gap:6px;color:#9db8ae}

/* ===== Header (dính đỉnh, ngang — thay sidebar) ===== */
.header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.header .wrap{display:flex;align-items:center;min-height:80px;padding:8px 24px;gap:20px;flex-wrap:nowrap}
.logo{display:flex;align-items:center;gap:9px;font-size:21.5px;font-weight:800;color:var(--ink);letter-spacing:-.4px;flex:none;white-space:nowrap}
.logo img{height:56px;width:auto;display:block}
.logo .b{color:var(--brand)}
.nav{display:flex;gap:20px;margin-left:6px;flex:none;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.nav::-webkit-scrollbar{display:none}
.nav a{font-size:14.5px;font-weight:500;color:var(--ink2);padding:4px 0;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.nav a:hover,.nav a.on{color:var(--brand)}
.nav a.on{font-weight:700;border-color:var(--brand)}
.nav a .n{background:var(--brand-l);color:var(--brand-d);font-size:12px;font-weight:800;border-radius:100px;padding:1px 6px;flex:none;line-height:1.56}
.header-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex:none;white-space:nowrap}
.ic-bell{position:relative;color:var(--ink2);font-size:18px;width:36px;height:36px;border-radius:var(--r);display:flex;align-items:center;justify-content:center}
.ic-bell:hover{background:var(--bg3)}
.ic-bell .dot{position:absolute;top:3px;right:5px;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid #fff}
.avatar-mini{display:flex;align-items:center;gap:9px;cursor:pointer;padding:5px 8px 5px 5px;border-radius:100px;position:relative}
.avatar-mini:hover{background:var(--bg3)}
.avatar-mini .av{width:32px;height:32px;border-radius:50%;background:var(--brand-l);color:var(--brand-d);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.avatar-mini .nm{font-size:14.5px;font-weight:700}
.avatar-mini .rl{font-size:12.5px;color:var(--muted);display:block;margin-top:-2px}
.hamb{display:none;font-size:21.5px;color:var(--ink);width:36px;height:36px;align-items:center;justify-content:center}

/* dropdown user menu */
.umenu{position:absolute;top:46px;right:0;background:#fff;border:1px solid var(--line);border-radius:var(--r2);box-shadow:0 12px 32px rgba(15,23,42,.14);min-width:200px;padding:6px;display:none;z-index:60}
.umenu.show{display:block}
.umenu a,.umenu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;font-size:14.5px;border-radius:8px;color:var(--ink)}
.umenu a:hover,.umenu button:hover{background:var(--bg3)}
.umenu .div{height:1px;background:var(--line2);margin:5px 4px}
.umenu .logout{color:var(--red)}

/* mobile drawer */
.drawer-ov{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:90;display:none}
.drawer-ov.show{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:82%;max-width:320px;background:#fff;z-index:91;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;overflow-y:auto}
.drawer.show{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line2)}
.drawer nav{display:flex;flex-direction:column;padding:8px}
.drawer nav a{padding:13px 12px;font-size:16px;font-weight:600;color:var(--ink);border-radius:8px;display:flex;align-items:center;gap:11px}
.drawer nav a.on{color:var(--brand);background:var(--brand-l)}
.drawer .foot{margin-top:auto;padding:16px 18px;border-top:1px solid var(--line2);display:flex;flex-direction:column;gap:10px}

/* ===== Bottom tab bar (chỉ mobile, khu đã đăng nhập) ===== */
.tabbar{display:none}

/* ===== Nội dung ===== */
.content{padding:28px 0 60px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:24.5px;font-weight:800;letter-spacing:-.3px}
.page-head p{font-size:14.5px;color:var(--ink2);margin-top:4px}
.crumb{padding:0 0 14px;font-size:14px;color:var(--ink2)}
.crumb a:hover{color:var(--brand)}
.crumb i,.crumb svg{margin:0 6px;color:var(--muted);vertical-align:-2px}

/* ===== Thẻ / khối chung ===== */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:20px}
.section{background:#fff;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.card-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line2)}
.card-head h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-head h3 svg{color:var(--icon)}
.see-all{font-size:14.5px;font-weight:700;color:var(--brand)}
.sec-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sec-title svg{color:var(--icon)}

/* ===== imgph — ô ảnh giữ chỗ ===== */
.imgph{background:var(--bg3);border:2px dashed #cbd5e1;border-radius:var(--r2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted)}
.imgph svg{opacity:.7}
.imgph span{font-size:13px;font-weight:600}

/* ===== Chip / badge / status / tag ===== */
.chip{font-size:14px;padding:6px 13px;border-radius:100px;background:var(--bg3);color:var(--ink2);display:inline-flex;align-items:center;gap:7px}
.chip svg{width:12px;height:12px}
.chip.salary{background:var(--brand-l);color:var(--brand-d);font-weight:700}
.fchip{height:42px;border:1.5px solid var(--line);border-radius:100px;padding:0 18px;font-size:14.5px;font-weight:600;color:var(--ink2);background:#fff;display:inline-flex;align-items:center;gap:7px;flex-shrink:0}
.fchip:hover{border-color:var(--brand);color:var(--brand)}
.fchip.on{background:var(--brand-l);color:var(--brand-d);border-color:var(--brand);font-weight:700}
.badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:100px;color:#fff;display:inline-block}
.badge.urgent{background:var(--amber)}
.badge.hot{background:var(--red)}
.status{font-size:13.5px;font-weight:700;padding:5px 12px;border-radius:100px;display:inline-flex;align-items:center;gap:6px}
.status svg{width:8px;height:8px}
.status.pending{background:var(--amber-l);color:#b45309}
.status.accepted,.status.active,.status.ok{background:var(--green-l);color:#047857}
.status.rejected{background:var(--red-l);color:#b91c1c}
.status.done{background:var(--brand-l);color:var(--brand-d)}
.verified{color:var(--green);font-size:12.5px;margin-left:3px}

/* ===== Filter bar (tìm kiếm + chip lọc) ===== */
.searchbar{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 8px rgba(15,23,42,.04);padding:12px;margin-bottom:14px;flex-wrap:wrap}
.searchbar .kw{position:relative;flex:1;min-width:180px}
.searchbar .kw svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbar input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:var(--r);padding:0 14px 0 40px;font-family:var(--font);font-size:15px;color:var(--ink)}
.searchbar input:focus{outline:none;border-color:var(--brand)}
.searchbar select{height:46px;min-width:150px;border:1.5px solid var(--line);border-radius:var(--r);padding:0 14px;font-family:var(--font);font-size:15px;background:#fff}
.searchbar .btn{height:46px}
.filterrow{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filterrow .l{display:flex;gap:8px;flex:1;overflow-x:auto;padding-bottom:2px}
.result-cnt{font-size:14.5px;color:var(--ink2);margin-bottom:14px}
.result-cnt b{color:var(--ink);font-weight:700}

/* ===== Thẻ việc dạng hàng ngang (job row) ===== */
.gigrow{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:18px 20px;display:flex;gap:16px;align-items:center;transition:.15s;margin-bottom:14px}
.gigrow:hover{border-color:var(--brand);box-shadow:0 4px 16px rgba(14,107,79,.08)}
.gigrow .logo{width:52px;height:52px;border-radius:10px;flex:none;background:var(--brand-l);color:var(--brand-d);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;overflow:hidden}
.gigrow .body{flex:1;min-width:0}
.gigrow .trow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.gigrow .title{font-size:16.5px;font-weight:700;color:var(--ink)}
.gigrow .title:hover{color:var(--brand)}
.gigrow .co{font-size:14.5px;color:var(--ink2);margin:3px 0 9px}
.gigrow .tags{display:flex;flex-wrap:wrap;gap:7px}
.gigrow .actions{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:10px;flex:none;align-self:stretch}
.gigrow .time{font-size:13px;color:var(--muted);white-space:nowrap}
.gigrow .cta{display:flex;gap:8px;align-items:center}
.gigrow .save{width:36px;height:36px;border:1.5px solid var(--line);border-radius:var(--r);color:var(--ink2);background:#fff;flex:none;display:flex;align-items:center;justify-content:center}
.gigrow .save.on{border-color:var(--brand);color:var(--brand);background:var(--brand-l)}

/* ===== Lưới thống kê (stat-grid) ===== */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:18px}
.stat-ico{width:38px;height:38px;border-radius:10px;background:var(--brand-l);color:var(--brand-d);display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.stat-num{font-size:25.5px;font-weight:800;letter-spacing:-.3px}
.stat-lbl{font-size:14px;color:var(--ink2);margin-top:2px}
.stat-delta{font-size:13px;color:var(--green);font-weight:600;margin-top:7px;display:flex;align-items:center;gap:4px}
.stat-delta.muted{color:var(--muted)}

/* ===== Tabs ===== */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{font-size:14.5px;font-weight:600;color:var(--ink2);padding:11px 15px;border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:700}
.tab .cnt{font-size:13px;color:var(--muted);margin-left:3px}
.tab.on .cnt{color:var(--brand)}

/* ===== Bảng (khu quản trị) ===== */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:15px 18px;border-bottom:1px solid var(--line2);font-weight:700}
td{padding:16px 18px;border-bottom:1px solid var(--line2);font-size:14.5px}
tr:last-child td{border-bottom:none}
.t-strong{font-weight:700;color:var(--ink)}
.t-muted{color:var(--muted)}
.t-time{font-size:13.5px;color:var(--ink2)}
.cand{display:flex;align-items:center;gap:10px}
.cand .av{width:34px;height:34px;border-radius:50%;background:var(--brand-l);color:var(--brand-d);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14.5px}
.ci-nm{font-weight:700;font-size:14.5px}
.ci-sub{font-size:13px;color:var(--muted)}
.act-btns{display:flex;gap:7px;justify-content:flex-end}

/* ===== Thẻ dạng lưới (blog/ký ức) ===== */
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.gcard{background:#fff;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;transition:.15s}
.gcard:hover{box-shadow:0 6px 20px rgba(15,23,42,.08);transform:translateY(-2px)}
.gcard .img{aspect-ratio:16/10}
.gcard .body{padding:17px 18px 19px}
.gcard .tag{font-size:12.5px;font-weight:700;color:var(--brand-d);background:var(--brand-l);padding:3px 9px;border-radius:100px}
.gcard .title{font-size:15.5px;font-weight:700;margin:9px 0 8px;line-height:1.41}
.gcard .meta{display:flex;gap:12px;font-size:13px;color:var(--muted)}
.pcard{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:24px 16px;display:flex;flex-direction:column;align-items:center;text-align:center;transition:.15s;text-decoration:none}
.pcard:hover{box-shadow:0 6px 20px rgba(15,23,42,.08);transform:translateY(-2px)}
.pcard .title{font-size:15px;font-weight:700;margin-top:12px;color:var(--ink)}
.pcard .meta{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:4px}

/* ===== hành trình tin cậy 7 bước (trong màn chi tiết việc) ===== */
.jflow-bar{display:flex;gap:2px;overflow-x:auto;padding-bottom:2px}
.jf-step{flex:1;min-width:64px;text-align:center;position:relative}
.jf-step::after{content:"";position:absolute;top:13px;left:50%;width:100%;height:2px;background:var(--line2);z-index:0}
.jf-step:last-child::after{display:none}
.jf-n{width:26px;height:26px;border-radius:50%;background:var(--line2);color:var(--muted);font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 5px;position:relative;z-index:1}
.jf-step.done .jf-n{background:var(--brand-l);color:var(--brand-d)}
.jf-step.on .jf-n{background:var(--brand);color:#fff}
.jf-t{font-size:12px;font-weight:700;color:var(--muted)}
.jf-step.on .jf-t{color:var(--ink)}

/* ===== Cờ tướng ===== */
.xq-wrap{display:flex;justify-content:center;padding:22px;border-radius:16px;
  background:radial-gradient(ellipse at 50% 0%,#1f4a3a,#0e2e22 70%);
  box-shadow:inset 0 2px 14px rgba(0,0,0,.35)}
.xq-board{--xq-pad:26px;position:relative;width:100%;max-width:472px;aspect-ratio:8/9;container-type:inline-size;
  background:repeating-linear-gradient(90deg,rgba(140,100,45,.08) 0 2px,transparent 2px 22px),
    radial-gradient(ellipse at 30% 20%,#F6E6BE,#E8CE97 55%,#D6B87C 100%);
  border-radius:var(--r-md,10px);
  box-shadow:0 10px 24px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.25),inset 0 -6px 16px rgba(120,80,30,.25);
  padding:var(--xq-pad);border:5px solid #7a4e22;box-sizing:border-box}
.xq-lines{position:absolute;left:var(--xq-pad);top:var(--xq-pad);width:calc(100% - var(--xq-pad)*2);height:calc(100% - var(--xq-pad)*2)}
.xq-river{position:absolute;left:var(--xq-pad);right:var(--xq-pad);top:calc(var(--xq-pad) + (100% - var(--xq-pad)*2)*.5 - 9px);text-align:center;display:flex;justify-content:space-between;
  padding:0 14%;font-size:16px;font-weight:700;color:#8a6a3a;letter-spacing:2px;pointer-events:none}
.xq-pt{position:absolute;width:12%;aspect-ratio:1;transform:translate(-50%,-50%);border:0;background:transparent;
  padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.xq-pt:disabled{cursor:default}
.xq-pc{width:84%;height:84%;border-radius:50%;
  background:radial-gradient(circle at 35% 28%,#FFFBEF,#F0DCA8 55%,#D8B978 100%);
  border:1.5px solid #8a5d24;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-family:'Songti SC','SimSun',serif;
  box-shadow:0 3px 5px rgba(0,0,0,.35),inset 0 1px 1px rgba(255,255,255,.85),inset 0 -2px 3px rgba(120,80,30,.4);
  /* Chữ trong quân theo % bề rộng bàn cờ (container query) — bàn to thì
     chữ to theo, không còn cỡ chữ cố định nhỏ hơn hẳn quân khi bàn phóng
     lớn. font-size 17px phía trước là fallback cho trình duyệt cũ không
     hiểu đơn vị cqw (khi đó dòng cqw bị bỏ qua, giữ nguyên 17px). */
  font-size:17px;font-size:5cqw}
.xq-pc.red{color:#B4231F}
.xq-pc.black{color:#1f2937}
.xq-pc.sel{box-shadow:0 0 0 3px var(--brand),0 3px 5px rgba(0,0,0,.35)}
.xq-pt.last .xq-pc{box-shadow:0 0 0 2px var(--brand),0 0 10px 2px rgba(212,175,55,.7)}
.xq-dot{width:28%;height:28%;border-radius:50%;background:rgba(14,90,60,.6);box-shadow:0 0 0 3px rgba(14,90,60,.15)}
.xq-pt.cap{outline:2.5px solid var(--bad,#c13b31);outline-offset:-2px;border-radius:50%}
@keyframes xq-pop{from{transform:scale(.35);opacity:0}to{transform:scale(1);opacity:1}}
.xq-pc.moved{animation:xq-pop .28s ease}
@media(max-width:600px){.xq-board{--xq-pad:18px}}
/* Hàng nút điều khiển cờ tướng (chọn bên/cấp độ, Ván mới, chuyển thế...):
   cho phép xuống dòng thay vì tràn ra ngoài khi nút không đủ chỗ (button
   mặc định white-space:nowrap nên flex:1 không tự co được dưới độ rộng nội
   dung, xem CSS .btn). */
.xq-ctrl-row{display:flex;flex-wrap:wrap;gap:8px}
.xq-ctrl-row>.btn{flex:1 1 120px}
/* Màn đánh cờ tướng full màn hình (xem xqFullscreenShell) — phủ kín viewport,
   không header/drawer/footer, chỉ có nút X tròn nổi góc trên để thoát, nút
   menu (☰) mở bảng điều khiển nổi (chọn cấp độ/thế/bên, Ván mới...), và 1
   thanh trạng thái mỏng luôn hiện (lượt ai đi/thắng-thua) — để bàn cờ là
   thứ duy nhất chiếm phần lớn màn hình theo đúng yêu cầu. */
.xq-fs{position:fixed;inset:0;z-index:200;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:radial-gradient(ellipse at 50% 0%,#1f4a3a,#0e2e22 70%)}
.xq-fs .wrap{max-width:none;padding:0}
.xq-fs .content{padding:56px 8px 16px}
.xq-fs .xq-wrap{padding:0;border-radius:0;background:transparent;box-shadow:none}
.xq-fs .xq-board{max-width:min(97vw,780px,calc((100vh - 130px)*8/9))}
.xq-fs-x,.xq-fs-menu-btn{position:fixed;top:calc(10px + env(safe-area-inset-top));z-index:210;
  width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;border:1.5px solid rgba(255,255,255,.25);cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.xq-fs-x{right:calc(10px + env(safe-area-inset-right))}
.xq-fs-menu-btn{left:calc(10px + env(safe-area-inset-left))}
.xq-fs-x:hover,.xq-fs-menu-btn:hover{background:rgba(0,0,0,.55)}
/* Báo "tới lượt bạn" — chữ nhỏ nằm thẳng trên nền xanh (không còn viên
   thuốc trắng nổi lên) cho đồng bộ với màn hình phủ xanh toàn bộ. */
.xq-status-bar{position:fixed;top:calc(18px + env(safe-area-inset-top));left:64px;right:64px;z-index:204;
  color:#dff3e6;font-size:12.5px;font-weight:700;letter-spacing:.2px;text-align:center;
  text-shadow:0 1px 4px rgba(0,0,0,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xq-status-bar.win{color:#8fe8b4}
.xq-status-bar.lose{color:#ff9d92}
/* Banner thông báo lớn (chiếu tướng / giải thành công / thắng-thua) — chữ
   nổi kiểu chạm vàng, từng chữ nhấp nhô uốn lượn khi hiện ra. .fade dùng
   cho "chiếu tướng" giữa ván (tự mờ đi sau ~2s để không che bàn cờ khi vẫn
   đang chơi tiếp); còn lại (thắng/thua/giải xong) ở nguyên trên màn hình. */
.xq-announce{position:fixed;left:50%;top:40%;z-index:220;pointer-events:none;
  display:flex;gap:1px;font-family:'Songti SC','SimSun',serif;font-weight:900;
  font-size:clamp(30px,7.5vw,58px);color:#ffd76a;letter-spacing:1px;
  text-shadow:0 2px 0 #7a4410,0 1px 0 #c98a1f,0 5px 10px rgba(0,0,0,.5),0 0 26px rgba(255,196,80,.55);
  animation:xq-ann-in .45s cubic-bezier(.22,1.6,.4,1) both}
.xq-announce.lose{color:#ffb2a3;text-shadow:0 2px 0 #7a1f10,0 1px 0 #c9401f,0 5px 10px rgba(0,0,0,.5),0 0 26px rgba(255,90,60,.5)}
.xq-announce.fade{animation:xq-ann-in .45s cubic-bezier(.22,1.6,.4,1) both,xq-ann-out .6s ease 1.9s forwards}
.xq-announce span{display:inline-block;animation:xq-ann-wave 1.15s ease-in-out infinite}
@keyframes xq-ann-in{from{opacity:0;transform:translate(-50%,-50%) scale(.35) rotate(-8deg)}to{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}}
@keyframes xq-ann-out{to{opacity:0;transform:translate(-50%,-50%) scale(.8)}}
@keyframes xq-ann-wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media(max-width:600px){.xq-announce{gap:0}}
.xq-fs-panel{display:none;position:fixed;top:calc(58px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));
  z-index:206;background:#fff;border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.28);padding:16px;
  width:min(360px,calc(100vw - 20px));max-height:calc(100vh - 90px);overflow-y:auto}
.xq-fs-panel.show{display:block}
/* .xq-fs-card: dùng cho các trạng thái CHƯA có bàn cờ (chọn cấp độ trước khi
   bắt đầu, đang tải, chờ nhận lời thách đấu...) — luôn hiện sẵn giữa màn
   hình, KHÔNG qua nút menu toggle (khác .xq-fs-panel — panel ẩn/hiện được,
   card thì luôn hiện vì lúc đó chưa có gì khác để xem). */
.xq-fs-card{position:fixed;top:12vh;left:50%;transform:translateX(-50%);z-index:206;background:#fff;
  border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.28);padding:20px;
  width:min(420px,calc(100vw - 24px));max-height:calc(100vh - 90px);overflow-y:auto}
.xq-fs-panel h1,.xq-fs-card h1{font-size:19px;margin-bottom:2px}
/* Thanh nút nổi dưới màn hình, hiện tự động khi giải xong 1 thế cờ — cho
   phép bấm sang thế tiếp theo ngay, hoặc quay lại, không cần mở menu. */
.xq-solved-bar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));z-index:215;
  transform:translateX(-50%);display:flex;gap:10px;animation:xq-solved-in .4s ease .35s both}
@keyframes xq-solved-in{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}

/* ===== Chat ===== */
.chat-shell{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 240px);min-height:460px;border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:#fff}
.conv-list{border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.conv-search{padding:12px;border-bottom:1px solid var(--line2)}
.conv-search input{width:100%;height:38px;border:1.5px solid var(--line);border-radius:100px;padding:0 14px;font-family:var(--font);font-size:14.5px}
.conv-item{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
.conv-item:hover,.conv-item.on{background:var(--brand-l)}
.conv-item .av{width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none}
.conv-main{flex:1;min-width:0}
.conv-top{display:flex;justify-content:space-between;gap:6px}
.conv-nm{font-size:14.5px;font-weight:700}
.conv-tm{font-size:12.5px;color:var(--muted);flex:none}
.conv-last{font-size:13.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.conv-unread{background:var(--bad,#c13b31);color:#fff;font-size:12px;font-weight:800;border-radius:100px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px;flex:none}
.chat-main{display:flex;flex-direction:column;min-width:0}
.chat-head{display:flex;align-items:center;gap:11px;padding:12px 16px;border-bottom:1px solid var(--line2)}
.chat-head .av{width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14.5px}
.chat-head .nm{font-size:15px;font-weight:700}
.chat-head .st{font-size:13px;color:var(--green)}
.chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg2)}
.msg{max-width:72%;padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.56;position:relative}
.msg.them{align-self:flex-start;background:#fff;border:1px solid var(--line2);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.msg-time{font-size:11.5px;opacity:.65;margin-top:4px;display:block}
.composer{display:flex;gap:9px;padding:12px;border-top:1px solid var(--line2)}
.composer input{flex:1;height:42px;border:1.5px solid var(--line);border-radius:100px;padding:0 16px;font-family:var(--font);font-size:14.5px}
.composer .send{width:42px;height:42px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
@media(max-width:768px){
  .chat-shell{grid-template-columns:1fr;height:calc(100vh - 200px)}
  .conv-list{position:absolute;inset:0;z-index:3;background:#fff}
  .chat-shell.show-chat .conv-list{display:none}
  .chat-back{display:inline-flex!important}
}
.chat-back{display:none;width:32px;height:32px;border-radius:50%;background:var(--bg3);align-items:center;justify-content:center;margin-right:2px}

/* ===== upload ảnh (dùng chung mọi form đăng tin) ===== */
.upload-box input[type=file]{display:none}
.upload-preview{width:100%;border-radius:var(--r2);overflow:hidden;position:relative}
.upload-preview img{width:100%;height:160px;object-fit:cover;display:block}
.upload-preview .rm{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(15,23,42,.6);color:#fff;display:flex;align-items:center;justify-content:center;border:0}

.mini-job{display:flex;gap:10px;padding:11px 0;border-top:1px solid var(--line2);align-items:center}
.mini-job:first-of-type{border-top:none;padding-top:0}
.mini-job .logo{background:var(--brand-l);color:var(--brand-d);display:flex;align-items:center;justify-content:center;flex:none}
.mini-job .mj-t{font-size:14px;font-weight:700;line-height:1.41;margin-bottom:2px}
.mini-job .mj-c{font-size:12.5px;color:var(--ink2)}
.mini-job:hover .mj-t{color:var(--brand)}

/* ===== Timeline (kinh nghiệm) ===== */
.timeline .tl-item{padding-left:20px;border-left:2px solid var(--line2);position:relative;padding-bottom:18px}
.timeline .tl-item::before{content:"";position:absolute;left:-5px;top:2px;width:8px;height:8px;border-radius:50%;background:var(--brand)}
.timeline .tl-item:last-child{padding-bottom:0}
.tl-role{font-size:15px;font-weight:700}
.tl-meta{font-size:13.5px;color:var(--ink2);margin:2px 0 5px}
.tl-desc{font-size:14.5px;color:var(--ink2);line-height:1.66}

/* ===== progress bar / bluebox ===== */
.prog-top{display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:8px}
.prog-top .pct{font-weight:800;color:var(--brand)}
.prog-bar{height:7px;background:var(--line2);border-radius:100px;overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--brand);border-radius:100px}
.bluebox{background:linear-gradient(155deg,var(--dark),#153c30);border-radius:var(--r2);padding:22px;color:#fff}
.bluebox .ico{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;margin-bottom:12px;color:#fff}
.bluebox h4{font-size:16px;font-weight:800;margin-bottom:7px}
.bluebox p{font-size:14px;color:#CFE3D9;line-height:1.61;margin-bottom:14px}
.bluebox .bx-btn{display:block;text-align:center;background:#fff;color:var(--brand-d);font-weight:700;font-size:14.5px;padding:10px;border-radius:var(--r)}

/* ===== info-row / box ===== */
.box{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:20px}
.box h3{font-size:14.5px;font-weight:700;margin-bottom:13px}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;font-size:14.5px;border-top:1px solid var(--line2)}
.info-row:first-of-type{border-top:none}
.info-row .lbl{color:var(--ink2)}
.info-row .val{color:var(--ink);font-weight:700}

/* ===== Trống / phân trang ===== */
.empty{text-align:center;padding:56px 20px}
.empty .ic{width:72px;height:72px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--muted)}
.empty h3{font-size:16.5px;font-weight:700;margin-bottom:6px}
.empty p{font-size:14.5px;color:var(--ink2);margin-bottom:16px}
.pagination{display:flex;justify-content:center;gap:6px;margin-top:22px}
.pagination a{width:36px;height:36px;border:1.5px solid var(--line);border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:14.5px;font-weight:600;color:var(--ink2)}
.pagination a.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* ===== Hero (trang chủ công khai) ===== */
.hero{position:relative;padding:64px 0;min-height:680px;display:flex;align-items:center;overflow:hidden;
  background:linear-gradient(100deg,rgba(234,245,240,.95) 0%,rgba(242,249,246,.5) 45%,rgba(255,255,255,0) 70%),var(--bg2)}
.hero .wrap{position:relative;z-index:1;width:100%}
.hero-text{max-width:540px}
.hero h1{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.22;margin-bottom:14px}
.hero h1 .b{color:var(--brand)}
.hero .lead{font-size:16.5px;color:var(--ink2);margin-bottom:22px}
.hero-btns{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.hero-trust{display:flex;gap:20px;flex-wrap:wrap}
.ht-item{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink)}
.ht-item svg{color:var(--icon)}
.hero-visual{position:absolute;top:0;right:0;bottom:0;width:58%;z-index:0}
.hero-visual .imgph{height:100%}
.hero-visual img{width:100%;height:100%;object-fit:cover;display:block;
  -webkit-mask-image:linear-gradient(to bottom,#000 58%,rgba(0,0,0,0) 100%);
  mask-image:linear-gradient(to bottom,#000 58%,rgba(0,0,0,0) 100%)}
.sec{padding:48px 0}
.sec-head{text-align:center;margin-bottom:32px}
.sec-head h2{font-size:26.5px;font-weight:800;letter-spacing:-.4px;margin-bottom:6px}
.sec-head p{font-size:15px;color:var(--ink2)}
.sec-head-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.sec-head-row h2{font-size:23.5px;font-weight:800}
.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:28px}
.feat-card{background:#fff;border-radius:var(--r2);overflow:hidden;box-shadow:0 2px 14px rgba(15,23,42,.05)}
.feat-card .imgph{aspect-ratio:16/10;border-radius:0;border:none;border-bottom:2px dashed #e2e8f0}
.feat-card .fc-body{padding:17px 18px 20px}
.feat-card h3{font-size:16.5px;font-weight:700;margin-bottom:6px;line-height:1.36}
.feat-card p{font-size:14.5px;color:var(--ink2)}
.feat-card.ic-card{padding:26px 22px 28px}
.feat-card.ic-card .fc-body{padding:0}
.feat-ic{width:48px;height:48px;border-radius:50%;background:var(--brand-l);color:var(--brand-d);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.center-btn{text-align:center}
.features{background:var(--brand-vl)}
.how .wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:36px;align-items:center}
.how-left .sec-head{text-align:left;margin-bottom:28px}
.steps{display:flex;justify-content:space-between;gap:14px;position:relative}
.steps::before{content:"";position:absolute;top:19px;left:8%;right:8%;height:2px;border-top:2px dashed #cbd5e1;z-index:0}
.step{flex:1;text-align:center;position:relative;z-index:1}
.step-num{width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;margin:0 auto 12px}
.step h4{font-size:14.5px;font-weight:700;margin-bottom:5px}
.step p{font-size:13.5px;color:var(--ink2);padding:0 4px;line-height:1.56}
.how-visual .imgph{aspect-ratio:1/1}
.why-grid{display:grid;grid-template-columns:1fr 1fr 170px 1fr 1fr;gap:20px;align-items:center}
.why-item .wi-ic{width:42px;height:42px;border-radius:11px;background:var(--brand-l);display:flex;align-items:center;justify-content:center;color:var(--brand-d);margin-bottom:10px}
.why-item h4{font-size:14.5px;font-weight:700;margin-bottom:4px}
.why-item p{font-size:13.5px;color:var(--ink2);line-height:1.56}
.why-mascot .imgph{aspect-ratio:1;background:transparent;border-style:dashed}
.statsban-inner{background:var(--brand);border-radius:18px;padding:32px 38px;display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;color:#fff}
.sb-text h3{font-size:20.5px;font-weight:800;line-height:1.41;margin-bottom:14px}
.sb-text .btn{background:#fff;color:var(--brand-d)}
.sb-stats{display:flex;gap:28px}
.sb-stat{text-align:center}
.sb-stat b{display:block;font-size:27.5px;font-weight:800}
.sb-stat span{font-size:13.5px;opacity:.9}
.botstrip{border-top:1px solid var(--line2);padding:20px 0;background:#fff}
.botstrip .wrap{display:flex;justify-content:center;gap:40px;flex-wrap:wrap}
.bs-item{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink2)}
.bs-item svg{color:var(--icon)}

/* ===== Footer ===== */
.footer{background:#fff;border-top:1px solid var(--line);padding:40px 0 0}
.foot-grid{display:grid;grid-template-columns:2fr 1.1fr 1.1fr 1fr;gap:30px;padding-bottom:28px}
.foot-logo{display:flex;align-items:center;gap:8px;font-size:20.5px;font-weight:800;margin-bottom:9px}
.foot-logo img{height:42px;width:auto;display:block}
.foot-tag{font-size:14px;color:var(--ink2);line-height:1.66;margin-bottom:14px}
.socials{display:flex;gap:9px}
.soc{width:32px;height:32px;border-radius:50%;background:var(--bg3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.foot-col h4{font-size:14px;font-weight:700;margin-bottom:12px}
.foot-col a{display:block;font-size:14px;color:var(--ink2);line-height:2.16}
.foot-col a:hover{color:var(--brand)}
.foot-bottom{border-top:1px solid var(--line);padding:16px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--muted)}
.foot-bottom .links{display:flex;gap:16px}

/* ===== Auth (login/register) ===== */
.auth-wrap{max-width:420px;margin:44px auto;padding:0 20px}
.auth-wrap.wide{max-width:920px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-sec{margin:22px 0 14px;padding-top:18px;border-top:1px solid var(--line2)}
.form-sec:first-child{margin-top:0;padding-top:0;border-top:none}
.form-sec b{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.form-sec span{font-size:13.5px;color:var(--muted);display:block;margin-top:3px}
.upload-box{border:2px dashed var(--line);border-radius:var(--r2);padding:22px;text-align:center;color:var(--muted);cursor:pointer}
.upload-box:hover{border-color:var(--brand);color:var(--brand)}
.upload-box svg{margin:0 auto 8px}
@media(max-width:768px){.form-row{grid-template-columns:1fr}}
.auth-card{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:30px 28px}
.auth-head{text-align:center;margin-bottom:22px}
.auth-head h1{font-size:22.5px;font-weight:800}
.auth-head p{font-size:14.5px;color:var(--ink2);margin-top:5px}
.oauth{display:flex;flex-direction:column;gap:9px;margin-bottom:18px}
.oauth-btn{display:flex;align-items:center;justify-content:center;gap:9px;height:46px;border:1.5px solid var(--line);border-radius:var(--r);font-weight:700;font-size:14.5px;background:#fff}
.divider{text-align:center;font-size:13.5px;color:var(--muted);margin:16px 0;position:relative}
.divider::before,.divider::after{content:"";position:absolute;top:50%;width:38%;height:1px;background:var(--line2)}
.divider::before{left:0}.divider::after{right:0}
.field{margin-bottom:17px}
.label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
.input{width:100%;height:48px;border:1.5px solid var(--line);border-radius:var(--r);padding:0 15px;font-family:var(--font);font-size:15px}
.input:focus{outline:none;border-color:var(--brand)}
.form-check{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--ink2);margin-bottom:16px}
.auth-foot{text-align:center;font-size:14.5px;color:var(--ink2);margin-top:16px}
.auth-foot a{color:var(--brand);font-weight:700}
.role-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.role-opt{border:1.5px solid var(--line);border-radius:var(--r2);padding:16px;text-align:center;cursor:pointer}
.role-opt.on{border-color:var(--brand);background:var(--brand-l)}
.role-opt .ic{width:38px;height:38px;border-radius:10px;background:var(--bg3);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;color:var(--ink2)}
.role-opt.on .ic{background:var(--brand);color:#fff}
.role-opt h4{font-size:14.5px;font-weight:700}
.role-opt p{font-size:13px;color:var(--ink2);margin-top:2px}

/* ===== Cửa sổ / wizard ===== */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:18px}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:var(--r2);width:100%;max-width:480px;max-height:88vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:#fff}
.modal-head b{font-size:16.5px;font-weight:800;flex:1}
.modal-x{width:32px;height:32px;border-radius:var(--r);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.modal-body{padding:20px}
.modal-foot{display:flex;gap:9px;padding:14px 20px 20px}
.suggest{display:flex;flex-wrap:wrap;gap:8px}
.steps-dot{display:flex;gap:5px;padding:14px 20px 0}
.steps-dot i{flex:1;height:4px;border-radius:99px;background:var(--line2);display:block}
.steps-dot i.on{background:var(--brand)}
.lightbox-ov{position:fixed;inset:0;background:rgba(15,23,42,.92);display:none;align-items:center;justify-content:center;z-index:150;padding:24px;cursor:zoom-out}
.lightbox-ov.show{display:flex}
.lightbox-ov img{max-width:100%;max-height:100%;border-radius:10px;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.5);cursor:default}
.lightbox-x{position:fixed;top:18px;right:18px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.lightbox-x:hover{background:rgba(255,255,255,.24)}
.toastwrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--dark);color:#fff;padding:12px 18px;border-radius:100px;font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:9px;box-shadow:0 14px 34px rgba(0,0,0,.25)}
.notice{display:flex;gap:11px;padding:13px 15px;border-radius:var(--r);font-size:14.5px;line-height:1.56}
.notice svg{flex:none;margin-top:1px}
.notice.brand{background:var(--brand-l);color:#083F30}
.notice.wait{background:var(--amber-l);color:#8A5806}

/* ===== khối 2 cột dùng chung ===== */
.cols{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
.cols-side{display:flex;flex-direction:column;gap:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.stack>*+*{margin-top:15px}

/* ===== Responsive ===== */
@media(max-width:980px){
  .nav{display:none}
  .hamb{display:flex}
  .header-right .avatar-mini .nm,.header-right .avatar-mini .rl{display:none}
  .hero{min-height:0}
  .hero-text{max-width:none}
  .hero-visual{display:none}
  .hero h1{font-size:31.5px}
  .feat-grid{grid-template-columns:1fr}
  .how .wrap{grid-template-columns:1fr}
  .how-visual{order:-1;max-width:320px;margin:0 auto}
  .card-grid,.g3,.job-grid{grid-template-columns:1fr 1fr}
  .why-grid{grid-template-columns:1fr 1fr}
  .why-mascot{display:none}
  .statsban-inner{grid-template-columns:1fr;text-align:center}
  .sb-stats{justify-content:center}
  .foot-grid{grid-template-columns:1fr 1fr}
  .cols{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:1fr 1fr}
}
@media(max-width:768px){
  .wrap{padding:0 16px}
  .content{padding:18px 0 90px}
  .gigrow{flex-wrap:wrap}
  .gigrow .actions{flex-direction:row;align-items:center;width:100%;justify-content:space-between;align-self:auto}
  .searchbar{flex-direction:column}
  .searchbar .kw,.searchbar select,.searchbar .btn{width:100%}
  .filterrow{flex-direction:column;align-items:stretch}
  .filterrow .l{overflow-x:visible;flex-wrap:wrap}
  table thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr{border-bottom:1px solid var(--line2);padding:10px 0}
  td{border-bottom:none;padding:5px 4px}
  .act-btns{justify-content:flex-start;margin-top:8px}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;height:60px;background:#fff;border-top:1px solid var(--line);z-index:80;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11.5px;font-weight:700}
  .tabbar a.on{color:var(--brand)}
  .tabbar .fab .fb{width:44px;height:44px;border-radius:50%;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;margin-top:-22px;box-shadow:0 6px 16px rgba(14,107,79,.4);border:3px solid #fff}
}
@media(max-width:600px){
  .card-grid,.g3,.g2,.stat-grid,.why-grid,.role-pick{grid-template-columns:1fr}
  .foot-grid{grid-template-columns:1fr}
  .sb-stats{flex-direction:column;gap:14px}
}

function ic(name,size=18){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`;}

/* ---------- 2. TIỆN ÍCH ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function initials(name){return (name||'').trim().split(/\s+/).slice(-2).map(w=>w[0]).join('').toUpperCase();}
function fmtDate(d){const dt=new Date(d);return dt.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'});}
function fmtDay(d){const dt=new Date(d);return dt.getDate();}
function fmtMonth(d){const dt=new Date(d);return 'TH'+(dt.getMonth()+1);}
function timeAgo(d){const s=(Date.now()-new Date(d).getTime())/1000;
  if(s<3600)return Math.max(1,Math.round(s/60))+' phút trước';
  if(s<86400)return Math.round(s/3600)+' giờ trước';
  if(s<86400*30)return Math.round(s/86400)+' ngày trước';
  return fmtDate(d);}
function money(n){return n.toLocaleString('vi-VN')+'đ';}
function qs(sel,root=document){return root.querySelector(sel);}
function qsa(sel,root=document){return [...root.querySelectorAll(sel)];}

/* toast */
function toast(msg,iconName='check'){
  let wrap=qs('.toastwrap');
  if(!wrap){wrap=document.createElement('div');wrap.className='toastwrap';document.body.appendChild(wrap);}
  const el=document.createElement('div');el.className='toast';el.innerHTML=ic(iconName,16)+`<span>${esc(msg)}</span>`;
  wrap.appendChild(el);setTimeout(()=>el.remove(),2600);
}

/* modal chung */
function openModal(html,{wide=false}={}){
  let ov=qs('.overlay');
  if(!ov){ov=document.createElement('div');ov.className='overlay';document.body.appendChild(ov);
    ov.addEventListener('click',e=>{if(e.target===ov)closeModal();});}
  ov.innerHTML=`<div class="modal ${wide?'wide':''}">${html}</div>`;
  ov.classList.add('show');
}
function closeModal(){const ov=qs('.overlay');if(ov)ov.classList.remove('show');SUGGEST_VALUES={};
  Object.keys(UPLOAD_FILES).forEach(k=>delete UPLOAD_FILES[k]);
  Object.keys(UPLOAD_FILES_MULTI).forEach(k=>delete UPLOAD_FILES_MULTI[k]);
  Object.keys(UPLOAD_COVER_IDX).forEach(k=>delete UPLOAD_COVER_IDX[k]);
  SH_AVATAR_FILE=null;
  DV_DRAFT={};
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeLightbox();}});
/* Phóng to 1 ảnh — dùng chung cho mọi lưới ảnh thật (việc, năng lực, giúp
   nhau, hoạt động…) thay vì mỗi nơi tự làm. path là "/files/<id>" thật;
   ảnh local mới chọn (chưa upload, base64 data-URL từ FileReader) không đi
   qua secureImageUrl nên gọi thẳng openLightboxUrl() với URL sẵn có. */
function lightbox(path){ const url = secureImageUrl(path); if(url) openLightboxUrl(url); }
function openLightboxUrl(url){
  let ov = document.getElementById('lightbox-ov');
  if(!ov){
    ov = document.createElement('div'); ov.id='lightbox-ov'; ov.className='lightbox-ov';
    ov.addEventListener('click', e=>{ if(e.target===ov) closeLightbox(); });
    document.body.appendChild(ov);
  }
  ov.innerHTML = `<button type="button" class="lightbox-x" onclick="closeLightbox()">${ic('x',20)}</button><img src="${url}" alt="">`;
  ov.classList.add('show');
}
function closeLightbox(){ const ov=document.getElementById('lightbox-ov'); if(ov) ov.classList.remove('show'); }

   đăng nhập vẫn gọi được (đặc tả cho phép, vì màn đăng ký cần nó). Làm phẳng ra
   để dùng làm danh sách chọn (suggestFieldArea) và tra tên → id khi gửi lên. */
function flattenAreas(nodes,acc){
  acc = acc||[];
  (nodes||[]).forEach(n=>{ acc.push({id:n.id,name:n.name}); if(n.children&&n.children.length) flattenAreas(n.children,acc); });
  return acc;
}

const JOB_DETAIL = {};

/* Realtime cho màn chi tiết việc (V['viec-detail']) — cùng cơ chế SSE
   connectGameStream() dùng cho cờ tướng online: người đăng và người ứng
   tuyển đang cùng mở 1 tin sẽ thấy ứng viên mới/trạng thái mới ngay, không
   cần rời màn hình rồi quay lại hay tải lại trang. Sự kiện 'job_updated' chỉ
   báo "có gì đó đổi", không kèm dữ liệu — đơn giản hơn cờ tướng vì chi tiết
   việc (applications/introductions/events) vốn đã gộp chung 1 lời gọi GET
   /jobs/:id, nên chỉ cần xoá cache rồi nạp lại là đủ, không cần hợp state
   từng phần như bàn cờ. */
let JOB_STREAM_ID = null, JOB_STREAM_ES = null, JOB_STREAM_RETRIES = 0;
function stopJobStream(){
  if(JOB_STREAM_ES){ JOB_STREAM_ES.close(); JOB_STREAM_ES=null; }
  JOB_STREAM_ID = null; JOB_STREAM_RETRIES = 0;
}
function connectJobStream(id){
  if(JOB_STREAM_ES) JOB_STREAM_ES.close();
  const token = api.accessToken(); if(!token) return;
  JOB_STREAM_ID = id;
  JOB_STREAM_ES = new EventSource(api.baseUrl()+'/jobs/'+id+'/stream?access_token='+encodeURIComponent(token));
  JOB_STREAM_ES.addEventListener('ready', ()=>{ JOB_STREAM_RETRIES=0; });
  JOB_STREAM_ES.addEventListener('job_updated', ()=>{
    if(JOB_STREAM_ID!==id) return;
    delete JOB_DETAIL[id];
    ensureJobDetail(id);
  });
  JOB_STREAM_ES.onerror = ()=>{
    if(JOB_STREAM_ES){ JOB_STREAM_ES.close(); JOB_STREAM_ES=null; }
    if(JOB_STREAM_ID!==id) return; // đã rời màn chi tiết này, không cần nối lại
    JOB_STREAM_RETRIES++;
    if(JOB_STREAM_RETRIES>5) return; // im lặng bỏ qua — chuông thông báo vẫn báo được việc mới
    setTimeout(()=>{
      if(JOB_STREAM_ID!==id) return;
      api.get('/auth/me').catch(()=>{}).then(()=>{
        if(JOB_STREAM_ID!==id) return;
        connectJobStream(id);
      });
    }, 1500);
  };
}

const REVEALED_CONTACTS = {}; // "<memberId>:<field>" -> giá trị đã xem
async function revealContact(memberId, field){
  const key = memberId+':'+field;
  if(Object.hasOwn(REVEALED_CONTACTS,key)) return;

const CONTACT_STATE_LABEL = {requested:'Đang chờ đồng ý', denied:'Đã từ chối', can_request:'Cần xin phép', closed:'Đã ẩn'};
function contactStateRow(memberId, field, env){
  env = env || {state:'closed'};
  if(env.state==='self') return '';
  const key = memberId+':'+field;

  }else{

}
/* Ảnh thật (job_need_images, activities.image_url) đều nằm sau GET /files/:id
   — route đó đòi Bearer token, nên <img src="/files/..."> trần không tải được
   (trình duyệt không tự gắn header cho thẻ img). Cách đúng: tải bằng
   api.blob() (có gắn token), giữ lại thành object URL rồi vẽ lại — cùng cách
   secureImageUrl() đã chạy thật trong web/index-cu.html. */
const LIVE_FILE_URLS = {}; // path "/files/<id>" -> object URL đã tải xong
const LIVE_FILE_LOADING = {};
function secureImageUrl(path){
  if(!path) return null;
  if(LIVE_FILE_URLS[path]) return LIVE_FILE_URLS[path];
  if(!LIVE_FILE_LOADING[path]){
    LIVE_FILE_LOADING[path] = true;
    api.blob(path).then(blob=>{
      LIVE_FILE_URLS[path] = URL.createObjectURL(blob);
      render();
    }).catch(()=>{}).finally(()=>{ delete LIVE_FILE_LOADING[path]; });
  }
  return null; // chưa có, nơi gọi tự hiện ảnh giữ chỗ trong lúc chờ
}

      DATA.aid = (aidRes&&aidRes.data||[]).map(mapAid);

      DATA.notifications = (notifRes&&notifRes.data)||[];
      DATA.notifUnread = (unreadRes&&unreadRes.count)||0;
      DATA.complaints = (complaintsRes&&complaintsRes.data)||[];
      DATA.joinRequests = (joinReqRes&&joinReqRes.data)||[];
      DATA.verifications = (verifRes&&verifRes.data)||[];

      DATA.fundEntries = (fundRes&&fundRes.data)||[];

      // Chưa có route backend (xem audit) — để rỗng, màn tương ứng tự hiện thông báo "chưa sẵn sàng".

      ROLE = (DATA.me && (DATA.me.role==='admin'||DATA.me.role==='moderator'||DATA.me.role==='approver')) ? 'admin' : 'member';

    }
    BOOTED = true;
  }catch(e){

  }
}

/* ---------- Âm thanh + realtime (tin nhắn/thông báo) ----------
   Trình duyệt chặn phát âm thanh tự động cho tới khi có tương tác đầu tiên
   của người dùng — soundUnlocked chỉ bật thật khi đó xảy ra (xem listener
   'click'/'keydown' ở cuối). Kỹ thuật tạo tiếng "ting" bằng Web Audio API
   (2 nốt ngắn) chép đúng theo playTing() đang chạy thật trong index-cu.html,
   không cần file âm thanh rời. */
let soundUnlocked = false;
/* Nốt nhạc ngắn dựng bằng Web Audio API, không cần file âm thanh rời — dùng
   chung cho "ting" báo tin/thông báo VÀ tiếng cờ tướng (đi quân/ăn quân/
   chiếu/thắng-thua) bên dưới, mỗi việc một mẫu tần số khác nhau. */
function beep(tones){
  if(!soundUnlocked) return;
  try{
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    const ctx = new C(); const now = ctx.currentTime;
    tones.forEach(({hz,at,dur,gain})=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      const t0=now+(at||0), d=dur||.1;
      o.frequency.value=hz; o.type='sine';
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain||.12, t0+.015);
      g.gain.exponentialRampToValueAtTime(.0001, t0+d);
      o.connect(g).connect(ctx.destination); o.start(t0); o.stop(t0+d+.02);
    });
  }catch(e){}
}
function playTing(){ beep([{hz:880,at:0,dur:.1},{hz:660,at:.11,dur:.1}]); }
/* Tiếng cờ tướng: mỗi loại nước đi một mẫu riêng để nghe phân biệt được mà
   không cần nhìn màn hình — đi quân (nhẹ), ăn quân (đục hơn), chiếu tướng
   (2 tiếng gấp), hết ván/thắng-thua (3 nốt đi lên). */
function chessSound(kind){
  if(kind==='place') beep([{hz:170,at:0,dur:.06,gain:.30},{hz:950,at:0,dur:.02,gain:.10}]);
  else if(kind==='capture') beep([{hz:150,at:0,dur:.10,gain:.34},{hz:100,at:.06,dur:.12,gain:.28}]);
  else if(kind==='check') beep([{hz:880,at:0,dur:.11,gain:.30},{hz:880,at:.15,dur:.11,gain:.30}]);
  else if(kind==='end') beep([{hz:392,at:0,dur:.14,gain:.28},{hz:494,at:.15,dur:.14,gain:.28},{hz:588,at:.30,dur:.26,gain:.30}]);
}
function unlockSound(){ soundUnlocked=true; }
document.addEventListener('click', unlockSound, {once:true});
document.addEventListener('keydown', unlockSound, {once:true});

/* GET /notifications/stream (SSE) — chỉ route này nhận Bearer qua query param
   ?access_token= vì EventSource không gắn được header tuỳ ý. Server đã lọc
   đúng người nhận (publishToMember), lọc lại ở client chỉ là chốt phòng thủ. */
let notificationStream = null;
function stopRealtime(){ if(notificationStream){ notificationStream.close(); notificationStream=null; } }
function startRealtime(){
  stopRealtime();
  if(!window.EventSource) return;
  const token = api.accessToken(); if(!token) return;
  notificationStream = new EventSource(api.baseUrl()+'/notifications/stream?access_token='+encodeURIComponent(token));
  notificationStream.addEventListener('notification', e=>{
    try{
      const n = JSON.parse(e.data);
      DATA.notifications.unshift(n);
      DATA.notifUnread += 1;
      if(n.kind==='contact_request') MY_CONTACT_REQUESTS = null; // buộc nạp lại nếu đang mở Cài đặt
      if(n.kind==='join_request') refreshJoinRequests(); // đơn vừa được duyệt/từ chối — màn Duyệt & xác minh của approver khác tự cập nhật
      playTing();
      render();
    }catch(err){}
  });
  notificationStream.addEventListener('message', e=>{
    try{
      const m = JSON.parse(e.data);
      const me = DATA.me && DATA.me.id;
      if(!me || (m.sender_id!==me && m.recipient_id!==me)) return;
      const otherId = m.sender_id===me ? m.recipient_id : m.sender_id;
      if(!otherId || otherId===me) return;
      // Tiếng "ting" đã phát ở sự kiện 'notification' đi kèm (server luôn phát
      // cả hai cho một tin nhắn mới) — ở đây chỉ cập nhật khung chat/danh sách
      // hội thoại, không phát tiếng lần hai cho cùng một tin.
      let cv = DATA.conversations.find(c=>c.withId===otherId);
      if(!cv){ cv={id:otherId, withId:otherId, unread:0, msgs:[]}; DATA.conversations.unshift(cv); }
      if(!cv.msgs.some(x=>x.id===m.id)){
        cv.msgs.push({id:m.id, from: m.sender_id===otherId?'them':'me', text:m.body, time:fmtDate(m.created_at)});
        // Tin đến (không phải mình gửi) và không phải đoạn đang mở xem ⇒ tính
        // là chưa đọc. Đang mở xem đúng đoạn đó thì coi như đã thấy rồi, dù
        // read_at ở server chỉ thật sự cập nhật lần sau mở lại (xem chatWith()).
        if(m.recipient_id===me && CHAT_ACTIVE!==otherId){ cv.unread++; DATA.msgUnread++; }
        render();
      }
    }catch(err){}
  });
  notificationStream.onerror = ()=>{};
}

let AFTER_LOGIN = null;

function variantOf(screen){
  if(screen.startsWith('admin')) return 'admin';
  // hosocongkhai đứng trong PUBLIC_SCREENS để khách chưa đăng nhập vẫn xem
  // được (không bị đá sang màn đăng nhập) — nhưng NẾU người xem đã đăng nhập,
  // vẫn phải giữ khung thành viên (menu Bảng nhà/Việc/Giúp nhau…, avatar góc
  // phải…), không rơi về khung khách chỉ có "Đăng nhập/Xin gia nhập" như hồi
  // chưa sửa (bấm vào 1 người ở "Con người" là mất hẳn thanh điều hướng).
  if(screen==='hosocongkhai') return isAuthed() ? 'member' : 'public';
  // Cùng lý do hosocongkhai ở trên: logo luôn trỏ về #congchung (xem
  // headerComp) — thành viên đã đăng nhập bấm logo trước đây bị rơi về khung
  // khách (chỉ còn nút "Đăng nhập"/"Xin gia nhập"), trông y hệt vừa bị đăng
  // xuất dù token vẫn còn nguyên. V.congchung ở dưới render lại đúng Bảng nhà.
  if(screen==='congchung') return isAuthed() ? 'member' : 'public';
  if(PUBLIC_SCREENS.has(screen)) return 'public';
  return 'member';
}

let PREV_SCREEN = null;
function render(){
  const {screen,params}=parseHash();
  if(PREV_SCREEN==='cotuong-van' && screen!=='cotuong-van') stopGameStream();
  if(PREV_SCREEN==='viec-detail' && screen!=='viec-detail') stopJobStream();
  if((PREV_SCREEN==='cotuong-may'||PREV_SCREEN==='cotuong-the') && screen!=='cotuong-may' && screen!=='cotuong-the'){
    xqStopWorker();
    if(CHESS_AI) CHESS_AI.thinking=false;
    if(CHESS_THE) CHESS_THE.thinking=false;
  }
  // Đổi hẳn sang màn khác (không phải re-render lại CHÍNH màn cờ đang mở) thì
  // đóng bảng menu nổi — tránh menu của thế cờ cũ "dính" sang màn kế tiếp.
  if(screen!==PREV_SCREEN) XQ_FS_MENU_OPEN = false;
  PREV_SCREEN = screen;
  const root=document.getElementById('root');
  const variant = variantOf(screen);

  if(BOOT_ERROR){ root.innerHTML = bootErrorScreen(); return; }

  if((variant==='member'||variant==='admin') && !isAuthed()){
    AFTER_LOGIN = {screen, params};
    LOGIN_REQUIRED_NOTICE = true;
    root.innerHTML = wrapPage('public', 'dangnhap', PUB.dangnhap(), false);
    window.scrollTo(0,0); bindGlobal(); return;
  }

  let body, activeTop;
  if(variant==='admin'){
    if(ROLE!=='admin'){ root.innerHTML = wrapPage('member', 'trongnha', adminLocked(), true); bindGlobal(); window.scrollTo(0,0); return; }
    const sub = screen.replace('admin-','')||'tongquan';
    body = (ADM[sub]||ADM.tongquan)();
    activeTop = 'admin-'+sub;
  }else if(variant==='public'){
    body = (PUB[screen]||PUB.congchung)(params);
    activeTop = screen;
  }else{
    body = (V[screen]||V.notfound)(params,screen);
    activeTop = screen;
  }
  // Màn chơi cờ tướng (đánh thật, không phải danh sách/sảnh) hiện full màn
  // hình — không header/nav/footer — chỉ có bàn cờ + nút X để thoát, theo
  // đúng yêu cầu "bấm vào đánh cờ thì full screen, có nút X để thoát".
  if(XQ_FULLSCREEN_SCREENS.has(screen)){
    root.innerHTML = xqFullscreenShell(body, XQ_FULLSCREEN_CLOSE[screen] || 'congchung');
    window.scrollTo(0,0);
    bindGlobal();
    return;
  }
  // isLanding (bố cục full-bleed, không khung .wrap/.content) chỉ đúng cho
  // trang chủ KHÁCH thật — congchung khi đã đăng nhập giờ render Bảng nhà
  // (xem variantOf()), cần khung thường như mọi màn thành viên khác.
  root.innerHTML = wrapPage(variant, activeTop, body, screen==='congchung' && variant==='public');
  window.scrollTo(0,0);
  bindGlobal();
}

/* ---------- 7. KHUNG TRANG — 1 header ngang + 1 footer đầy đủ dùng chung mọi variant, KHÔNG sidebar ---------- */
function wrapPage(variant, active, bodyHtml, isLanding){
  return `
  ${headerComp(variant, active)}
  ${drawerComp(variant, active)}
  <main>${isLanding ? bodyHtml : `<div class="wrap"><div class="content">${bodyHtml}</div></div>`}</main>
  ${footerFull(variant)}
  ${variant!=='public' ? tabbarComp(variant, active) : ''}
  `;
}

/* Màn đánh cờ tướng thật (không phải sảnh/danh sách) hiện toàn màn hình,
   thay hẳn cho wrapPage — không header/drawer/footer/tabbar. closeTarget
   là màn quay lại khi bấm nút X (không đánh nữa/đổi ý). */
const XQ_FULLSCREEN_SCREENS = new Set(['cotuong','cotuong-may','cotuong-the','cotuong-van']);
const XQ_FULLSCREEN_CLOSE = { cotuong:'congchung', 'cotuong-may':'cotuong-online', 'cotuong-the':'cotuong-online', 'cotuong-van':'cotuong-online' };
/* Có mở bảng menu nổi (.xq-fs-panel) hay không — PHẢI lưu ở biến state
   thật, không chỉ đổi class DOM: mọi thao tác trong panel (đổi cấp độ, thế
   trước/sau...) đều gọi lại render() (thay nguyên root.innerHTML), nên nếu
   không nhớ vào biến thì panel sẽ tự đóng ngay khi vừa bấm 1 nút bên trong. */

/* ---------- 9b. Ô tải ảnh lên (dùng chung mọi form đăng tin) ----------
   Chọn ảnh xong hiện xem trước ngay (FileReader chỉ để xem trước tại chỗ).
   File gốc được giữ lại trong UPLOAD_FILES để khi bấm Lưu/Đăng mới thật sự
   upload lên server qua uploadFile(fid) — không gửi base64 nặng qua JSON. */
const UPLOAD_FILES = {}; // fid -> File
function uploadField(fid,label){
  return `<div class="field"><label class="label">${label}</label>${uploadBoxHtml(fid)}</div>`;
}
function uploadBoxHtml(fid){
  return `<div class="upload-box" id="up-${fid}" onclick="document.getElementById('file-${fid}').click()">
    ${ic('camera',22)}<div style="font-size:13px;font-weight:600;margin-top:4px">Bấm để tải ảnh lên</div>
    <div style="font-size:11.5px;color:var(--muted);margin-top:2px">JPG, PNG — tối đa 5MB</div>
    <input type="file" id="file-${fid}" accept="image/*" style="display:none" onchange="uploadPreview('${fid}',this)">
  </div>`;
}
function uploadPreview(fid,input){
  const file = input.files && input.files[0]; if(!file) return;
  if(file.size > 5*1024*1024){ toast('Ảnh vượt quá 5MB, chọn ảnh nhỏ hơn nhé','flag'); input.value=''; return; }
  UPLOAD_FILES[fid]=file;
  const reader = new FileReader();
  reader.onload = e=>{
    const box = document.getElementById('up-'+fid);
    if(!box) return;
    box.outerHTML = `<div class="upload-preview" id="up-${fid}"><img src="${e.target.result}" alt="Ảnh đã chọn">
      <button type="button" class="rm" onclick="uploadReset('${fid}')">${ic('x',14)}</button></div>`;
  };
  reader.readAsDataURL(file);
}
function uploadReset(fid){
  delete UPLOAD_FILES[fid];
  const box = document.getElementById('up-'+fid);
  if(box) box.outerHTML = uploadBoxHtml(fid);
}
/* upload thật lên server (multipart/form-data) — gọi lúc bấm nút Lưu/Đăng.
   POST /files trả về {id} (KHÔNG phải {url} — đã xác nhận trong files/service.js);
   nơi gọi tự ghép "/files/"+id khi cần dùng làm image_url, hoặc gửi id đó làm
   file_id cho endpoint đính ảnh riêng (ví dụ POST /jobs/:id/images). "purpose"
   chỉ có ý nghĩa cho ảnh đại diện/bìa thành viên (member_avatar/member_cover) —
   để trống với ảnh việc/hoạt động/năng lực. null nếu không chọn ảnh. */
async function uploadFile(fid,purpose){
  const file = UPLOAD_FILES[fid];
  if(!file) return null;
  return await api.upload('/files', file, purpose?{purpose}:{});
}

/* Ô tải NHIỀU ảnh + chọn 1 ảnh làm ảnh bìa — dùng cho việc (job_needs hỗ trợ
   gallery thật qua POST /jobs/:id/images {file_id,sort_order}), khác uploadField()
   ở trên chỉ nhận 1 ảnh. Bấm vào 1 ảnh trong lưới xem trước để đặt làm bìa —
   ảnh bìa luôn được upload với sort_order=0 nên hiện đầu tiên ở trang chi tiết. */
const UPLOAD_FILES_MULTI = {}; // fid -> File[]
const UPLOAD_COVER_IDX = {};   // fid -> chỉ số ảnh đang được chọn làm bìa
function multiUploadField(fid,label){
  return `<div class="field"><label class="label">${label}</label>
    <div class="upload-box" id="up-${fid}" onclick="document.getElementById('file-${fid}').click()">
      ${ic('camera',22)}<div style="font-size:13px;font-weight:600;margin-top:4px">Bấm để chọn ảnh (chọn được nhiều ảnh)</div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:2px">JPG, PNG — mỗi ảnh tối đa 5MB</div>
      <input type="file" id="file-${fid}" accept="image/*" multiple style="display:none" onchange="multiUploadPreview('${fid}',this)">
    </div>
    <div id="grid-${fid}" style="display:none;gap:8px;flex-wrap:wrap;margin-top:8px"></div>
  </div>`;
}
function multiUploadPreview(fid,input){
  const picked = Array.from(input.files||[]);
  if(!picked.length) return;
  const ok = picked.filter(f=>{
    if(f.size > 5*1024*1024){ toast(`Ảnh "${f.name}" vượt quá 5MB, đã bỏ qua`,'flag'); return false; }
    return true;
  });
  if(!ok.length) return;
  UPLOAD_FILES_MULTI[fid] = (UPLOAD_FILES_MULTI[fid]||[]).concat(ok);
  if(UPLOAD_COVER_IDX[fid]===undefined) UPLOAD_COVER_IDX[fid]=0;
  renderMultiUploadGrid(fid);
  input.value='';
}
function renderMultiUploadGrid(fid){
  const files = UPLOAD_FILES_MULTI[fid]||[];
  const grid = document.getElementById('grid-'+fid);
  if(!grid) return;
  if(!files.length){ grid.style.display='none'; grid.innerHTML=''; return; }
  grid.style.display='flex';
  grid.innerHTML = files.map((f,i)=>`<div style="position:relative;width:72px;height:72px">
    <img data-mu-idx="${i}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;border:2px solid ${i===UPLOAD_COVER_IDX[fid]?'var(--brand)':'transparent'};cursor:pointer" title="Bấm để đặt làm ảnh bìa">
    ${i===UPLOAD_COVER_IDX[fid]?`<span style="position:absolute;top:2px;left:2px;background:var(--brand);color:#fff;font-size:9px;padding:1px 4px;border-radius:4px;font-weight:600">Bìa</span>`:''}
    <button type="button" onclick="multiUploadRemove('${fid}',${i})" style="position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#000;color:#fff;border:none;font-size:11px;line-height:1;cursor:pointer">${ic('x',10)}</button>
  </div>`).join('');
  files.forEach((f,i)=>{
    const imgEl = grid.querySelector(`img[data-mu-idx="${i}"]`);
    if(!imgEl) return;
    const reader = new FileReader();
    reader.onload = e=>{ imgEl.src = e.target.result; };
    reader.readAsDataURL(f);
    imgEl.onclick = ()=>{ UPLOAD_COVER_IDX[fid]=i; renderMultiUploadGrid(fid); };
  });
}
function multiUploadRemove(fid,idx){
  const files = UPLOAD_FILES_MULTI[fid]||[];
  files.splice(idx,1);
  if(UPLOAD_COVER_IDX[fid]>=files.length) UPLOAD_COVER_IDX[fid]=Math.max(0,files.length-1);
  renderMultiUploadGrid(fid);
}
/* Upload thật từng ảnh lên /files rồi trả về mảng file_id — PHẦN TỬ ĐẦU LUÔN
   LÀ ẢNH BÌA đã chọn, để nơi gọi gán sort_order theo đúng thứ tự mảng này. */
async function uploadMultiFiles(fid){
  const files = UPLOAD_FILES_MULTI[fid]||[];
  if(!files.length) return [];
  const coverIdx = UPLOAD_COVER_IDX[fid]||0;
  const ordered = [files[coverIdx], ...files.filter((_,i)=>i!==coverIdx)];
  const ids = [];
  for(const f of ordered){
    try{ const res = await api.upload('/files', f, {}); if(res && res.id) ids.push(res.id); }
    catch(e){ /* 1 ảnh lỗi không chặn các ảnh còn lại */ }
  }
  return ids;
}

/* Ô tìm kiếm dùng chung cho các màn danh sách (Việc & hợp tác, Năng lực,
   Giúp nhau, Hoạt động…) — khung .searchbar/.kw tái dùng từ PUB.khampha.
   CỐ Ý không gọi setFilter()/render() toàn trang trên oninput: y hệt lý do
   globalSearchInput()/areaSearchInput() ở trên đã ghi rõ — render() thay
   nguyên root.innerHTML nên gõ tới đâu mất focus/con trỏ tới đó. Mỗi màn có
   hàm "…SearchInput(el)" riêng: cập nhật STATE (để chuyển tab/rời màn rồi
   quay lại vẫn giữ đúng từ khoá), rồi chỉ vẽ lại đúng khung #…-results. */
function searchKw(ns, placeholder, oninput){

function matchKw(q, ...fields){
  if(!q) return true;
  const hay = fields.filter(Boolean).join(' ').toLowerCase();

function shAvatarPick(input){
  const file = input.files && input.files[0]; if(!file) return;

/* Chip khu vực dùng DATA.areasFlat thật (nạp lúc boot qua loadAreas()) thay vì
   danh sách xã hardcode — value đọc lại bằng getSuggestValue() vẫn là TÊN xã,

/* 107 khu vực thật trong DB — liệt kê hết thành chip (kiểu suggestField() ở
   dưới) thì thành 1 hàng dài không tìm nổi. Thay bằng ô gõ-tìm: gõ vài ký tự,
   lọc trong DATA.areasFlat, chọn 1 kết quả. Vẫn ghi vào #val-<groupId> +
   SUGGEST_VALUES như suggestField() để getSuggestValue() dùng lại được nguyên
   xi ở mọi wizard đang gọi suggestFieldArea(). */
function suggestFieldArea(label,groupId){
  const has = DATA.areasFlat.length>0;
  const current = SUGGEST_VALUES[groupId]||'';
  return `<div class="field"><label class="label">${label}</label>
    <div style="position:relative">
      <input type="text" class="input" id="search-${groupId}" autocomplete="off" value="${esc(current)}"
        placeholder="${has?'Gõ tên xã/phường để tìm…':'Đang tải khu vực…'}"
        oninput="areaSearchInput('${groupId}')" onfocus="areaSearchInput('${groupId}')" onblur="areaSearchBlur('${groupId}')">
      <div id="ddown-${groupId}" style="display:none;position:absolute;top:100%;left:0;right:0;background:var(--card,#fff);border:1px solid var(--bd);border-radius:8px;margin-top:4px;max-height:220px;overflow:auto;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.14)"></div>
    </div>
    <input type="hidden" id="val-${groupId}" value="${esc(current)}">
  </div>`;
}
function areaSearchInput(groupId){
  const input = document.getElementById('search-'+groupId);
  const ddown = document.getElementById('ddown-'+groupId);
  if(!input||!ddown) return;
  const q = input.value.trim().toLowerCase();
  const all = DATA.areasFlat.map(a=>a.name);
  const matches = (q?all.filter(n=>n.toLowerCase().includes(q)):all).slice(0,8);
  if(!matches.length){ ddown.style.display='none'; ddown.innerHTML=''; return; }
  ddown.style.display='block';
  ddown.innerHTML = matches.map(n=>`<button type="button" style="display:block;width:100%;text-align:left;padding:9px 12px;border:none;background:none;font-size:13.5px;cursor:pointer" onmousedown="areaSearchPick('${groupId}','${esc(n).replace(/'/g,"\\'")}')">${esc(n)}</button>`).join('');
}
function areaSearchPick(groupId,name){
  const input = document.getElementById('search-'+groupId);
  const hidden = document.getElementById('val-'+groupId);
  const ddown = document.getElementById('ddown-'+groupId);
  if(input) input.value=name;
  if(hidden) hidden.value=name;
  SUGGEST_VALUES[groupId]=name;
  if(ddown){ ddown.style.display='none'; ddown.innerHTML=''; }
}
function areaSearchBlur(groupId){
  // Trì hoãn để onmousedown của kết quả (nếu có) kịp chạy trước khi ô rớt khỏi ddown.
  setTimeout(()=>{ const d=document.getElementById('ddown-'+groupId); if(d) d.style.display='none'; }, 150);

/* Tìm kiếm toàn cục (chuông tìm kiếm ở topbar) — tra song song 5 nguồn thật
   (jobs/members/capabilities/projects/aid đều có sẵn ?q=). Vẽ trực tiếp vào
   #searchResults thay vì gọi render() toàn trang — làm như areaSearchInput ở
   trên, để không làm mất focus/con trỏ trong ô đang gõ mỗi khi có kết quả mới. */
let GLOBAL_SEARCH_TIMER = null, GLOBAL_SEARCH_SEQ = 0;
function globalSearchInput(){
  clearTimeout(GLOBAL_SEARCH_TIMER);
  const input = document.getElementById('search-global');
  const box = document.getElementById('searchResults');
  if(!input||!box) return;
  const q = input.value.trim();
  const mySeq = ++GLOBAL_SEARCH_SEQ;
  if(q.length<2){ box.innerHTML = q?'<p style="font-size:13px;color:var(--muted);padding:10px">Gõ ít nhất 2 ký tự để tìm.</p>':''; return; }
  box.innerHTML = '<p style="font-size:13px;color:var(--muted);padding:10px">Đang tìm…</p>';
  GLOBAL_SEARCH_TIMER = setTimeout(async ()=>{
    let jobsRes,membersRes,capsRes,projRes,aidRes;
    try{
      [jobsRes,membersRes,capsRes,projRes,aidRes] = await Promise.all([
        api.get('/jobs?q='+encodeURIComponent(q)+'&limit=5'),
        api.get('/members?q='+encodeURIComponent(q)+'&limit=5'),
        api.get('/capabilities?q='+encodeURIComponent(q)+'&limit=5'),
        api.get('/projects?q='+encodeURIComponent(q)+'&limit=5'),
        api.get('/aid?q='+encodeURIComponent(q)+'&limit=5'),
      ]);
    }catch(e){
      if(mySeq!==GLOBAL_SEARCH_SEQ) return; // ô tìm đã đổi chữ trong lúc chờ, kết quả cũ không còn giá trị
      const b=document.getElementById('searchResults'); if(b) b.innerHTML='<p style="font-size:13px;color:var(--muted);padding:10px">Có lỗi khi tìm, thử lại.</p>';
      return;
    }
    if(mySeq!==GLOBAL_SEARCH_SEQ) return; // trả lời không theo đúng thứ tự (mạng chậm) — chỉ vẽ lượt gõ mới nhất
    const groups = [
      {label:'Việc & hợp tác', items:(jobsRes&&jobsRes.data||[]).map(j=>({title:j.title, sub:j.poster_name, go:'viec-detail:'+j.id}))},
      {label:'Con người', items:(membersRes&&membersRes.data||[]).map(m=>({title:m.full_name, sub:m.job||'', go:'congnguoi-detail:'+m.id}))},
      {label:'Năng lực', items:(capsRes&&capsRes.data||[]).map(c=>({title:c.title, sub:c.full_name||'', go:'nangluc-detail:'+c.id}))},
      {label:'Hoạt động', items:(projRes&&projRes.data||[]).map(p=>({title:p.title, sub:fmtDate(p.starts_at), go:'hoatdong-detail:'+p.id}))},
      {label:'Giúp nhau', items:(aidRes&&aidRes.data||[]).map(a=>({title:a.title, sub:a.requester_name||'', go:'giupnhau-detail:'+a.id}))},
    ].filter(g=>g.items.length);
    const outBox = document.getElementById('searchResults');
    if(!outBox) return;
    if(!groups.length){ outBox.innerHTML = `<p style="font-size:13px;color:var(--muted);padding:10px">Không tìm thấy kết quả nào cho "${esc(q)}".</p>`; return; }
    outBox.innerHTML = groups.map(g=>`<div style="padding:8px 10px 2px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase">${g.label}</div>${g.items.map(it=>`<button type="button" onclick="closeSearchPanel();go('${it.go}')" style="display:block;width:100%;text-align:left;padding:8px 10px;border:none;background:none;border-radius:8px;cursor:pointer"><div style="font-size:13.5px;font-weight:600">${esc(it.title)}</div>${it.sub?`<div style="font-size:12px;color:var(--muted)">${esc(it.sub)}</div>`:''}</button>`).join('')}`).join('');
  }, 350);
}
function closeSearchPanel(){ const p=qs('#searchPanel'); if(p) p.classList.remove('show'); }
/* SUGGEST_VALUES nhớ lựa chọn qua NHIỀU BƯỚC của 1 wizard nhiều bước (đăng
   việc/nhờ giúp/thêm năng lực). openModal() thay TOÀN BỘ HTML của modal ở mỗi
   bước — input ẩn #val-<groupId> của bước 1 không còn trong DOM khi tới bước
   xem trước/gửi ở bước cuối, nên getSuggestValue() đọc DOM sẽ luôn ra rỗng nếu
   không có chỗ nhớ riêng. Dọn ở closeModal() khi đóng hẳn 1 wizard. */
let SUGGEST_VALUES = {};
function suggestField(label,groupId,options,{other=true}={}){
  const chips = options.map(o=>`<button type="button" class="fchip" onclick="chipPick(this,'${groupId}')" data-val="${esc(o)}">${esc(o)}</button>`).join('');
  return `<div class="field"><label class="label">${label}</label>
    <div class="suggest" id="grp-${groupId}">${chips}${other?`<button type="button" class="fchip" onclick="chipPick(this,'${groupId}',true)" data-val="">${ic('edit',13)} Khác…</button>`:''}</div>
    <input type="text" id="other-${groupId}" class="input" placeholder="Gõ điều bạn cần…" style="display:none;margin-top:8px" oninput="setSuggestOther('${groupId}',this.value)">
    <input type="hidden" id="val-${groupId}">
  </div>`;
}
function chipPick(el,groupId,isOther){
  qsa('#grp-'+groupId+' .fchip').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  const otherInput=document.getElementById('other-'+groupId);
  const hidden=document.getElementById('val-'+groupId);
  if(isOther){otherInput.style.display='block';otherInput.focus();hidden.value=otherInput.value||'';SUGGEST_VALUES[groupId]=otherInput.value||'';}
  else{otherInput.style.display='none';hidden.value=el.dataset.val;SUGGEST_VALUES[groupId]=el.dataset.val;}
}
function setSuggestOther(groupId,value){
  const hidden=document.getElementById('val-'+groupId);
  if(hidden) hidden.value=value;
  SUGGEST_VALUES[groupId]=value;
}
/* đọc lại giá trị người dùng đã chọn/gõ trong 1 suggestField — dùng khi gom dữ
   liệu để gửi API. DOM còn (đang ở đúng bước đó) thì đọc DOM; DOM đã mất (đã
   sang bước khác trong CÙNG wizard) thì lấy từ SUGGEST_VALUES đã nhớ lại. */
function getSuggestValue(groupId){
  const el=document.getElementById('val-'+groupId);
  if(el) return el.value.trim();
  return (SUGGEST_VALUES[groupId]||'').trim();
}
/* đọc giá trị input/textarea thường theo id, rỗng nếu không có phần tử */
function getVal(id){ const el=document.getElementById(id); return el ? el.value.trim() : ''; }

const WIZ = {};

/* Ứng tuyển việc thật: POST /jobs/:id/applications {note} — note bắt buộc ≥10 ký tự. */
WIZ.xinNhanViec = (ds)=>{

    <div id="xnv-err" class="notice wait" style="display:none">${ic('flag',16)}<span id="xnv-err-txt"></span></div>

async function xinNhanViecSubmit(jobId){
  const note = getVal('xnv-note');
  const box=qs('#xnv-err'), txt=qs('#xnv-err-txt');
  if(note.length<10){ if(box&&txt){txt.textContent='Viết ít nhất 10 ký tự.';box.style.display='flex';} return; }
  const btn=qs('#xnv-submit'); if(btn){btn.disabled=true;btn.textContent='Đang gửi…';}
  try{
    await api.post(`/jobs/${jobId}/applications`, {note});
    closeModal(); toast('Đã xin nhận việc','handshake'); render();
  }catch(e){
    if(btn){btn.disabled=false;btn.textContent='Gửi';}
    if(box&&txt){ txt.textContent=e.message||'Có lỗi, thử lại.'; box.style.display='flex'; }
  }
}
/* Chọn ứng viên thật: PATCH /jobs/:id/applications/:connectionId {status}.
   connectionId = applications[i].id từ GET /jobs/:id (đã xác nhận trong
   jobs/service.js#get — KHÔNG phải id thành viên) — xem ensureJobDetail() và
   V['viec-detail'] nơi applicants được dựng từ dữ liệu thật này. "Chọn" nghĩa
   là chuyển trạng thái kết nối từ contacted → agreed. */
async function chonUngVien(jobId,connectionId,memberName){
  try{
    await api.patch(`/jobs/${jobId}/applications/${connectionId}`, {status:'agreed'});
    delete JOB_DETAIL[jobId];
    toast('Đã chọn '+memberName,'check');
    await ensureJobDetail(jobId);
    render();
  }catch(e){ toast(e.message||'Có lỗi khi chọn ứng viên, thử lại.','flag'); }
}
/* Cùng route với chonUngVien (PATCH /jobs/:id/applications/:connId), chỉ khác
   status đích — backend cho phép 'contacted' -> 'failed' (xem transitions ở
   jobs/service.js#updateApplication), tức "không chọn người này". Trước bản
   này giao diện chỉ có nút "Chọn", không có cách đánh dấu ai đó không được
   chọn — họ nằm mãi ở "đang chờ" dù người đăng đã chọn người khác. */
async function tuChoiUngVien(jobId,connectionId,memberName){
  if(!confirm('Không chọn '+memberName+' cho việc này?')) return;
  try{
    await api.patch(`/jobs/${jobId}/applications/${connectionId}`, {status:'failed'});
    delete JOB_DETAIL[jobId];
    toast('Đã báo không chọn '+memberName,'check');
    await ensureJobDetail(jobId);
    render();
  }catch(e){ toast(e.message||'Có lỗi, thử lại.','flag'); }
}
